<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match 🧠</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at bottom, #0d3b4f 0%, #061a22 100%);
    color: white;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
  }

  #starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.1;} 50%{opacity:0.7;} }

  .back-to-path { position: fixed; top: 18px; left: 18px; z-index: 999; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(20px); color: rgba(255,255,255,0.65); text-decoration: none; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; padding: 9px 16px 9px 12px; border-radius: 30px; transition: all 0.2s; }
  .back-to-path:hover { background: rgba(255,255,255,0.14); color: #fff; transform: translateX(-2px); }
  .back-to-path svg { width: 14px; height: 14px; }

  .header { text-align: center; margin-bottom: 20px; z-index: 10; }
  .hint-tag { display:inline-block; background:rgba(30,144,168,0.2); border:1px solid rgba(80,200,220,0.3); color:#7fdfee; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:5px 14px; border-radius:20px; margin-bottom:12px; }
  h1 { font-family:'Playfair Display', serif; font-size:28px; margin-bottom:6px; }
  .subtitle { font-size:13px; opacity:0.45; }

  .stats-row { display:flex; gap:24px; margin-bottom: 18px; z-index: 10; }
  .stat { text-align:center; }
  .stat-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; opacity:0.35; }
  .stat-val { font-size:24px; font-weight:700; color:#7fdfee; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(340px, 88vw);
    z-index: 10;
  }

  .card {
    aspect-ratio: 1;
    border-radius: 14px;
    position: relative;
    cursor: pointer;
    perspective: 600px;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    backface-visibility: hidden;
  }

  .card-front {
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.12);
  }
  .card-front::after { content: '💙'; opacity: 0.3; font-size: 18px; }

  .card-back {
    background: linear-gradient(135deg, #1e90a8, #0d3b4f);
    border: 1px solid rgba(127,223,238,0.3);
    transform: rotateY(180deg);
  }

  .card.matched .card-back {
    background: linear-gradient(135deg, #2ecc71, #1a8a5a);
    border-color: rgba(46,204,113,0.5);
    animation: matchPulse 0.6s ease;
  }
  @keyframes matchPulse { 0%{transform: rotateY(180deg) scale(1);} 50%{transform: rotateY(180deg) scale(1.1);} 100%{transform: rotateY(180deg) scale(1);} }

  .success-overlay {
    position: fixed; inset: 0; background: rgba(6,26,34,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; padding: 30px;
  }
  .success-overlay.active { display: flex; animation: fadeIn 0.6s ease; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .success-overlay h2 { font-family:'Playfair Display', serif; font-size:28px; color:#7fdfee; margin-bottom:10px; }
  .success-overlay p { opacity:0.55; font-size:14px; margin-bottom:26px; max-width:300px; }
  .btn-next { background: linear-gradient(135deg, #ff4d85, #ff8fa8); color:white; border:none; padding:16px 38px; border-radius:30px; font-size:17px; font-weight:700; font-family:'Nunito',sans-serif; cursor:pointer; box-shadow:0 12px 30px rgba(255,77,133,0.4); transition: transform 0.2s; }
  .btn-next:hover { transform: scale(1.05); }
</style>
</head>
<body>
<style id="site-polish-style">
  html{scroll-behavior:smooth;}

  #spLoadVeil{
    position:fixed;inset:0;z-index:99997;
    background:inherit;
    pointer-events:none;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:1;
    transition:opacity .9s ease, backdrop-filter .9s ease;
  }
  #spLoadVeil.sp-gone{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);}

  /* NOTE: intentionally not touching opacity/filter of body's children here —
     several pages manage their own .scene visibility via opacity, and doing
     so here would force every scene visible at once. The veil above handles
     the whole "fade in from blur" effect on its own. */

  .sp-glow-hit{
    animation:spGlowPulse .55s ease;
  }
  @keyframes spGlowPulse{
    0%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
    40%{filter:drop-shadow(0 0 14px rgba(255,111,149,.9));}
    100%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
  }

  #spChapterLabel{
    position:fixed;
    top:16px;left:50%;transform:translateX(-50%);
    z-index:99991;
    font-family:'Playfair Display',Georgia,serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
    background:rgba(0,0,0,.22);
    padding:6px 14px;
    border-radius:20px;
    backdrop-filter:blur(3px);
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  #spChapterLabel.sp-show{opacity:.85;}
</style>

<div id="spLoadVeil"></div>
<div id="spChapterLabel"></div>

<script id="site-polish-script">
(function(){
  /* ---------- 1. Load fade-in (blur to sharp) ---------- */
  function revealVeil(){
    var veil = document.getElementById('spLoadVeil');
    if(!veil || veil.classList.contains('sp-gone')) return;
    veil.classList.add('sp-gone');
    setTimeout(function(){ if(veil.parentNode) veil.remove(); }, 1000);
  }
  window.addEventListener('load', function(){
    requestAnimationFrame(function(){ requestAnimationFrame(revealVeil); });
  });
  if(document.readyState === 'complete'){
    revealVeil();
  }

  /* ---------- 2. Hover / tap glow on interactive elements ---------- */
  var interactiveSelector = 'button, a, input, .btn-continue, .btn-next, [onclick], [role="button"]';

  function pulse(el){
    el.classList.remove('sp-glow-hit');
    void el.offsetWidth;
    el.classList.add('sp-glow-hit');
  }

  document.addEventListener('mouseover', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  });
  document.addEventListener('touchstart', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  }, {passive:true});

  /* ---------- 3. Smooth scroll ---------- */
  /* handled via CSS scroll-behavior:smooth above */

  /* ---------- 4. Chapter label (brief, then fades away) ---------- */
  var CHAPTERS = {
    'index.html': 'Chapter 1 · The Beginning',
    'passwordgate.html': 'Chapter 1 · The Beginning',
    'potl-welcome.html': 'Chapter 1 · The Beginning',
    'firsts.html': 'Chapter 2 · Our Firsts',
    'jigsaw.html': 'Chapter 2 · Our Firsts',
    'tangled_love.html': 'Chapter 2 · Our Firsts',
    'stars.html': 'Chapter 3 · Under the Stars',
    'catch.html': 'Chapter 3 · Under the Stars',
    'our_constellation_part1.html': 'Chapter 3 · Under the Stars',
    'our_constellation.html': 'Chapter 3 · Under the Stars',
    'our_memorie_8_.html': 'Chapter 3 · Under the Stars',
    'memorymatch.html': 'Chapter 3 · Under the Stars',
    'night_quotes.html': 'Chapter 4 · Just Us',
    'playlist.html': 'Chapter 4 · Just Us',
    'videos.html': 'Chapter 4 · Just Us',
    'proposal.html': 'Chapter 4 · Just Us',
    'flames_new_fonts.html': 'Chapter 4 · Just Us',
    'potl-securitycheck.html': 'Chapter 4 · Just Us',
    'heart.html': 'Chapter 5 · For You',
    'cards (2).html': 'Chapter 5 · For You',
    'i_love_you.html': 'Chapter 5 · For You',
    'For_Anusha_-_Complete_Journey (2).html': 'Chapter 6 · Forever',
    'swipe.html': 'Chapter 6 · Forever',
    'her-smile-gallery (1).html': 'Chapter 6 · Forever',
    'three_quotes.html': 'Chapter 6 · Forever',
    'ourmoments (2).html': 'Chapter 6 · Forever',
    'love_quotes.html': 'Chapter 6 · Forever',
    'hearts.html': 'Chapter 7 · The Promise',
    'contract.html': 'Chapter 7 · The Promise',
    'proposal_with_song.html': 'Chapter 7 · The Promise'
  };

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var label = CHAPTERS[here];

  if(here === 'polaroids.html'){
    var visits = parseInt(sessionStorage.getItem('spPolaroidsVisits') || '0', 10) + 1;
    sessionStorage.setItem('spPolaroidsVisits', visits);
    label = visits <= 1 ? 'Chapter 2 · Our Firsts' : 'Chapter 7 · The Promise';
  }

  if(label){
    var el = document.getElementById('spChapterLabel');
    el.textContent = label;
    setTimeout(function(){ el.classList.add('sp-show'); }, 1300);
    setTimeout(function(){ el.classList.remove('sp-show'); }, 4200);
  }
})();
</script>


<a href="lock.html" class="back-to-path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Path</a>

<div id="starfield"></div>

<div class="header">
  <div class="hint-tag">🧠 Memory Match</div>
  <h1>Pair Up Our Moments</h1>
  <p class="subtitle">Match every emoji pair to continue</p>
</div>

<div class="stats-row">
  <div class="stat"><div class="stat-label">Moves</div><div class="stat-val" id="movesVal">0</div></div>
  <div class="stat"><div class="stat-label">Matched</div><div class="stat-val" id="matchedVal">0/8</div></div>
</div>

<div class="grid" id="grid"></div>

<div class="success-overlay" id="successOverlay">
  <div style="font-size:60px; margin-bottom:16px;">🧠💕</div>
  <h2 id="successTitle">Perfect memory!</h2>
  <p>Every pair, just like every moment with you — unforgettable.</p>
  <button class="btn-next" onclick="goNext()">Continue the Path →</button>
</div>

<script>
  // ════════════════════════════════════════════
  //  CUSTOMIZE: swap these emoji for ones that
  //  mean something specific to you two
  // ════════════════════════════════════════════
  const SYMBOLS = ['💕','🌸','☕','🌙','✨','🎵','🌧️','💌'];

  let deck = [...SYMBOLS, ...SYMBOLS]
    .map(s => ({ symbol: s, id: Math.random() }))
    .sort(() => Math.random() - 0.5);

  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let lockBoard = false;

  const grid = document.getElementById('grid');

  deck.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.symbol = item.symbol;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front"></div>
        <div class="card-face card-back">${item.symbol}</div>
      </div>
    `;
    card.addEventListener('click', () => flipCard(card));
    grid.appendChild(card);
  });

  function flipCard(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flipped.length >= 2) return;

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      moves++;
      document.getElementById('movesVal').textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [a, b] = flipped;
    if (a.dataset.symbol === b.dataset.symbol) {
      a.classList.add('matched');
      b.classList.add('matched');
      matchedCount++;
      document.getElementById('matchedVal').textContent = matchedCount + '/8';
      flipped = [];

      if (matchedCount === SYMBOLS.length) {
        setTimeout(showSuccess, 600);
      }
    } else {
      lockBoard = true;
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flipped = [];
        lockBoard = false;
      }, 800);
    }
  }

  function showSuccess() {
    const title = document.getElementById('successTitle');
    if (moves <= 12) title.textContent = 'Perfect memory!';
    else if (moves <= 18) title.textContent = 'You found them all!';
    else title.textContent = 'Got there in the end!';
    document.getElementById('successOverlay').classList.add('active');
  }

  function goNext() {
    window.location.href = 'night_quotes.html';
  }

  // Starfield
  const sf = document.getElementById('starfield');
  for(let i=0;i<80;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
    sf.appendChild(s);
  }
</script>

<style id="cursor-trail-style">
  .ct-particle{
    position:fixed;
    top:0;left:0;
    pointer-events:none;
    z-index:99995;
    will-change:transform, opacity, filter;
    user-select:none;
  }
</style>

<script id="cursor-trail-script">
(function(){
  if(window.__ctInit) return;
  window.__ctInit = true;

  var THEMES = {
    'flames_new_fonts.html': [
      { type:'sparkle', glyph:'✦', colors:['#ffc36b','#ffe14d','#ff9a4d'] },
      { type:'sparkle', glyph:'✧', colors:['#ff7a3d','#ffb347'] },
      { type:'heart',   glyph:'♥', colors:['#ff6f45','#ff8f5a'] }
    ],
    'stars.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#a8d8ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#8fd6ff','#e0f4ff'] },
      { type:'petal',   glyph:'❀', colors:['#c9e8ff','#e6f4ff'] }
    ],
    'our_constellation_part1.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'our_constellation.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'tangled_love.html': [
      { type:'heart', glyph:'♥', colors:['#ff5f8f','#e8547a'] },
      { type:'petal', glyph:'✿', colors:['#ffc3dd','#ffb6d9'] }
    ],
    'contract.html': [
      { type:'sparkle', glyph:'✦', colors:['#e8b978','#d4a95f'] },
      { type:'heart',   glyph:'♥', colors:['#ff8fac'] }
    ]
  };

  var DEFAULT_THEME = [
    { type:'heart',  glyph:'♥', colors:['#ff6f95','#ff8fac','#e8547a','#ffb3c6'] },
    { type:'heart',  glyph:'❤', colors:['#ff5f8f','#ff9ecb'] },
    { type:'petal',  glyph:'✿', colors:['#ffc3dd','#ffd6e6','#f7a8c4'] },
    { type:'petal',  glyph:'❀', colors:['#ffb6d9','#ffe0ef'] },
    { type:'petal',  glyph:'✾', colors:['#ffd6a5','#ffe8c9'] },
    { type:'sparkle',glyph:'✦', colors:['#ffe14d','#ffc36b','#fff3b0'] },
    { type:'sparkle',glyph:'✧', colors:['#c9e8ff','#ffffff'] },
    { type:'sparkle',glyph:'·', colors:['#ffffff','#ffe9f2'] }
  ];

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var shapes = THEMES[here] || DEFAULT_THEME;

  var isSmallScreen = window.innerWidth < 400;
  var minInterval = isSmallScreen ? 75 : 50;

  var lastSpawn = 0;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildWaveKeyframes(x, y, size, kind){
    var totalDriftY = kind === 'sparkle' ? rand(-26,-10) : rand(50,95);
    var swayAmp = kind === 'sparkle' ? rand(4,10) : rand(18,34);
    var swayDir = Math.random() < 0.5 ? 1 : -1;
    var totalRot = rand(-50,50) * (kind === 'petal' ? 1.6 : 1);
    var steps = 6;
    var frames = [];

    for(var i=0;i<=steps;i++){
      var t = i/steps;
      var vy = totalDriftY * (t*t*(3-2*t));
      var vx = Math.sin(t*Math.PI*1.3) * swayAmp * swayDir * (kind === 'sparkle' ? 0.4 : 1);
      var rot = totalRot * t;
      var scale, opacity;
      if(kind === 'sparkle'){
        scale = t < 0.3 ? (0.4 + t*2.6) : (1.15 - (t-0.3)*0.6);
        opacity = t < 0.15 ? t/0.15 : (t > 0.7 ? Math.max(0,(1-t)/0.3) : 0.75 + Math.sin(t*22)*0.25);
      } else {
        scale = t < 0.25 ? (0.5 + t*2) : (1 - (t-0.25)*0.35);
        opacity = t < 0.12 ? t/0.12 : Math.max(0, 1 - Math.pow((t-0.12)/0.88, 1.4));
      }
      frames.push({
        transform: 'translate('+(x+vx-size/2)+'px,'+(y+vy-size/2)+'px) rotate('+rot+'deg) scale('+Math.max(0.05,scale).toFixed(3)+')',
        opacity: Math.max(0, Math.min(1, opacity)).toFixed(3),
        offset: t
      });
    }
    return frames;
  }

  function spawnAt(x, y, force){
    var now = performance.now();
    if(!force && now - lastSpawn < minInterval) return;
    lastSpawn = now;

    var shape = pick(shapes);
    var color = pick(shape.colors);

    var el = document.createElement('div');
    el.className = 'ct-particle';
    el.textContent = shape.glyph;

    var size = shape.type === 'sparkle' ? rand(7,13) : rand(12,20);
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.filter = 'drop-shadow(0 0 '+(size*0.7)+'px '+color+')';

    var offX = rand(-3,3);
    var offY = rand(-3,3);
    document.body.appendChild(el);

    var frames = buildWaveKeyframes(x+offX, y+offY, size, shape.type);
    var dur = shape.type === 'sparkle' ? rand(650,950) : rand(1300,1900);

    var anim = el.animate(frames, { duration: dur, easing: 'linear' });
    anim.onfinish = function(){ el.remove(); };
  }

  var lastX = null, lastY = null;
  var lastMoveTime = performance.now();
  var idleTimer = null;

  function scheduleIdle(x, y){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(x !== null) spawnAt(x, y, true);
      scheduleIdle(x, y);
    }, 2200 + rand(0,900));
  }

  function handlePointer(x, y){
    var now = performance.now();
    if(lastX !== null){
      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var dt = Math.max(8, now - lastMoveTime);
      var speed = dist / dt; // px per ms

      // faster movement -> denser trail (more interpolated steps), capped for performance
      var baseSteps = Math.max(1, Math.floor(dist / 20));
      var speedBoost = speed > 1.2 ? 2 : (speed > 0.6 ? 1 : 0);
      var steps = Math.min(isSmallScreen ? 4 : 7, baseSteps + speedBoost);

      for(var i=1;i<=steps;i++){
        var t = i/steps;
        spawnAt(lastX + dx*t, lastY + dy*t);
      }
    } else {
      spawnAt(x,y,true);
    }
    lastX = x; lastY = y;
    lastMoveTime = now;
    scheduleIdle(x, y);
  }

  window.addEventListener('mousemove', function(e){
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchstart', function(e){
    if(e.touches && e.touches[0]){
      spawnAt(e.touches[0].clientX, e.touches[0].clientY, true);
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      scheduleIdle(lastX, lastY);
    }
  }, {passive:true});

  window.addEventListener('click', function(e){
    var count = isSmallScreen ? 5 : 8;
    for(var i=0;i<count;i++){
      (function(i){
        var angle = (i/count) * Math.PI * 2;
        var dist = rand(6,26);
        setTimeout(function(){
          spawnAt(e.clientX + Math.cos(angle)*dist, e.clientY + Math.sin(angle)*dist, true);
        }, i*22);
      })(i);
    }
  });
