<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Little Universe</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Georgia", "Times New Roman", serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    body.desktop {
      cursor: none;
    }

    #cursor-dot,
    #cursor-ring {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #cursor-dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 210, 160, 0.95);
      box-shadow: 0 0 10px rgba(255, 180, 100, 0.7);
    }

    #cursor-ring {
      width: 28px;
      height: 28px;
      border: 1.5px solid rgba(255, 200, 140, 0.4);
    }

    body.desktop.ready #cursor-dot,
    body.desktop.ready #cursor-ring {
      opacity: 1;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .line {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      max-width: 90vw;
      padding: 0 1.5rem;
    }

    .line.intro {
      font-size: clamp(1.25rem, 3.5vw, 1.8rem);
      font-style: italic;
      letter-spacing: 0.04em;
      color: #fff8e8;
      text-shadow:
        0 0 8px rgba(0, 0, 0, 1),
        0 0 20px rgba(0, 0, 0, 0.95),
        0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .line.story {
      font-size: clamp(1.15rem, 3.1vw, 1.55rem);
      font-style: italic;
      color: #fff6e0;
      text-shadow:
        0 0 8px rgba(0, 0, 0, 1),
        0 0 22px rgba(0, 0, 0, 0.95),
        0 2px 5px rgba(0, 0, 0, 0.9);
      line-height: 1.65;
    }

    .line.name {
      font-size: clamp(2.9rem, 10vw, 5.6rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #fff5e0;
      text-shadow:
        0 0 12px rgba(0, 0, 0, 1),
        0 0 28px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(255, 180, 100, 0.55),
        0 0 80px rgba(255, 140, 60, 0.3);
    }

    .line.love {
      font-size: clamp(1.7rem, 5.8vw, 3.3rem);
      font-style: italic;
      letter-spacing: 0.06em;
      color: #ffe9c8;
      text-shadow:
        0 0 12px rgba(0, 0, 0, 1),
        0 0 28px rgba(0, 0, 0, 0.95),
        0 0 40px rgba(255, 170, 100, 0.6);
    }

    #continue-btn,
    #final-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: transparent;
      border: 1px solid rgba(255, 210, 150, 0.5);
      color: rgba(255, 235, 200, 0.95);
      font-family: "Georgia", serif;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-style: italic;
      letter-spacing: 0.08em;
      padding: 0.9rem 1.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.35s, border-color 0.35s, transform 0.35s, box-shadow 0.35s;
      box-shadow: 0 0 28px rgba(255, 160, 70, 0.15);
    }

    #continue-btn {
      bottom: 12%;
    }

    #final-btn {
      bottom: 14%;
    }

    #continue-btn.visible,
    #final-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #continue-btn:hover,
    #final-btn:hover {
      background: rgba(255, 190, 110, 0.12);
      border-color: rgba(255, 220, 160, 0.8);
      box-shadow: 0 0 40px rgba(255, 170, 70, 0.35);
    }

    #corner-label {
      position: fixed;
      top: 1.4rem;
      left: 1.6rem;
      font-size: 0.78rem;
      font-style: italic;
      letter-spacing: 0.04em;
      color: rgba(255, 220, 180, 0.38);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    #hint {
      position: fixed;
      bottom: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-style: italic;
      color: rgba(255, 210, 160, 0.3);
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 1.4s;
    }

    #hint.show {
      opacity: 1;
    }

    #flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 230, 180, 0.7) 0%, rgba(255, 160, 80, 0.25) 35%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }

    #sound-btn {
      position: fixed;
      bottom: 1.4rem;
      right: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 210, 150, 0.28);
      background: transparent;
      color: rgba(255, 220, 180, 0.45);
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.6s, color 0.3s, border-color 0.3s;
    }

    #sound-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    #sound-btn:hover {
      color: rgba(255, 230, 190, 0.9);
      border-color: rgba(255, 210, 150, 0.55);
    }

    @media (max-width: 600px) {

      #continue-btn,
      #final-btn {
        bottom: 16%;
      }

      #corner-label {
        top: 1rem;
        left: 1rem;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <div class="line love" id="loveLine">i hope you like our little journey....potti</div>
    <button id="continue-btn" type="button">will it be forever →</button>
    <button id="final-btn" type="button">will it continue forever →</button>
  </div>
  <div id="corner-label">Our Little Universe</div>
  <div id="hint">Move slowly · Explore · Stay as long as you like</div>
  <div id="flash"></div>
  <button id="sound-btn" type="button" title="Toggle ambient sound" aria-label="Toggle sound">♪</button>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <audio id="ambient" loop preload="auto" playsinline>

  <script>
    (function () {
      'use strict';

      const GIRL_NAME = "Anusha";

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;

      function detectLowEndDevice() {
        let score = 0;
        const cores = navigator.hardwareConcurrency || 4;
        const mem = navigator.deviceMemory || 4;
        if (cores <= 4) score += 2;
        if (cores <= 2) score += 2;
        if (mem <= 4) score += 2;
        if (mem <= 2) score += 3;
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');
            if (dbg) {
              const renderer = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
              if (/intel|uhd|iris|mali|adreno|powervr|swiftshader|llvmpipe/.test(renderer)) score += 3;
            }
          }
        } catch (e) { }
        return score >= 4;
      }
      const isLowEndDevice = detectLowEndDevice();

      const CONFIG = {
        galaxy: {
          count: isLowEndDevice ? (isMobile ? 7500 : 13000) : (isMobile ? 16000 : 32000),
          armCount: 2,
          radius: 9.4,
          spiralTightness: 3.15,
          randomnessPower: 3.3,
          randomnessSpread: isMobile ? 0.15 : 0.18,
          diskThickness: 0.2,
          centerColor: 0xffc878,
          innerColor: 0xff7a28,
          outerColor: 0xb82fff,
          sizeCenter: isLowEndDevice ? 22 : 28,

        heroStars: { count: isLowEndDevice ? 18 : (isMobile ? 40 : 80) },
        stars: { count: isLowEndDevice ? (isMobile ? 1100 : 1800) : (isMobile ? 2500 : 5000), radius: 56 },
        dust: { count: isLowEndDevice ? 0 : (isMobile ? 400 : 1000), radius: 18 },
        camera: { startZ: 15.2, settleZ: 9.0, fov: 50 },
        rotationSpeed: 0.04,
        pixelRatioCap: isLowEndDevice ? 1.0 : (isMobile ? 1.5 : 1.7),
        mouseRepelRadius: 2.0,
        mouseRepelStrength: 0.48,

      const GALAXY_VERTEX = `
      uniform float uTime;
      uniform float uSize;
      uniform vec3 uMouseWorld;
      uniform float uMouseInfluence;
      uniform float uCollapse;
      uniform float uNamePulse;
      uniform float uBlast;

      attribute float aScale;
      attribute vec3 aColor;
      attribute float aPhase;

      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        vec3 pos = position;

        float t  = uTime * 0.3 + aPhase * 6.28318;
        float t2 = uTime * 0.16 + aPhase * 4.1;
        float t3 = uTime * 0.42 + aPhase * 2.7;

        float turbX = sin(t) * 0.014 + sin(t2 * 1.3) * 0.009 + sin(t3 * 0.7) * 0.005;
        float turbY = cos(t * 0.9) * 0.011 + sin(t2) * 0.007 + cos(t3 * 1.1) * 0.004;
        float turbZ = sin(t * 1.1) * 0.013 + cos(t2 * 0.8) * 0.008 + sin(t3) * 0.004;

        float angle = atan(pos.z, pos.x);
        float swirl = sin(uTime * 0.18 + aPhase * 3.0) * 0.009;
        float len = length(pos.xz);
        float cx = cos(angle + swirl) * len - pos.x;
        float cz = sin(angle + swirl) * len - pos.z;

        pos.x += turbX + cx * 0.5;
        pos.y += turbY;
        pos.z += turbZ + cz * 0.5;

        vec3 toMouse = pos - uMouseWorld;
        float dist = length(toMouse);
        float repel = smoothstep(2.0, 0.0, dist) * uMouseInfluence;
        pos += normalize(toMouse + vec3(0.001)) * repel * 0.48;

        float r = length(pos.xz);
        float pulse = sin(uNamePulse * 3.14159) * exp(-r * 0.48) * 0.25;
        pos *= (1.0 + pulse * uNamePulse);

        pos = mix(pos, pos * 0.012, uCollapse);

        if (uBlast > 0.001) {
          vec3 dir = normalize(pos + vec3(0.001));
          float burst = uBlast * (1.6 + aPhase * 2.0);
          pos += dir * burst * (0.55 + aPhase * 0.7);
        }

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        float sizeAtten = uSize * aScale * (260.0 / -mvPosition.z);
        gl_PointSize = max(sizeAtten * (1.0 + uBlast * 0.7), 1.1);

        vColor = aColor;
        float bright = 1.0 + repel * 1.4 + uBlast * 0.7;
        vAlpha = bright;
      }
    `;

      const GALAXY_FRAGMENT = `
      uniform float uExposure;
      uniform float uWarmth;
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);

        float core = smoothstep(0.16, 0.0, d);
        float halo = smoothstep(0.45, 0.0, d) * 0.38;
        float alpha = (core + halo) * vAlpha * uExposure;

        if (alpha < 0.015) discard;

        vec3 col = vColor * (1.0 + core * 0.35);
        // Gentle warmth shift over time (more gold/rose)
        col = mix(col, col * vec3(1.08, 0.95, 0.88), uWarmth * 0.55);
        gl_FragColor = vec4(col, alpha);
      }
    `;

      const AMBIENT_VERTEX = `
      uniform float uTime;
      attribute float aPhase;
      attribute float aSize;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        float twinkle = 0.55 + 0.45 * sin(uTime * 1.5 + aPhase * 6.28)
                              + 0.1 * sin(uTime * 2.8 + aPhase * 4.2);
        vAlpha = clamp(twinkle, 0.15, 1.0);
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * (240.0 / -mv.z);
      }
    `;

      uniform float uOpacity;
      varying float vAlpha;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float a = smoothstep(0.5, 0.0, d) * vAlpha * uOpacity;
        if (a < 0.02) discard;
        gl_FragColor = vec4(0.85, 0.8, 0.95, a);
      }
    `;

      const camera = new THREE.PerspectiveCamera(
        CONFIG.camera.fov,
        window.innerWidth / window.innerHeight,
        0.1, 200
      );
      camera.position.set(0, 0.5, CONFIG.camera.startZ);

      const renderer = new THREE.WebGLRenderer({
        antialias: !isLowEndDevice,
        alpha: false,
        powerPreference: isLowEndDevice ? 'low-power' : 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.pixelRatioCap));
      renderer.setClearColor(0x000000, 1);
      container.appendChild(renderer.domElement);

      function createGalaxy() {
        const g = CONFIG.galaxy;
        const positions = new Float32Array(g.count * 3);
        const colors = new Float32Array(g.count * 3);
        const scales = new Float32Array(g.count);
        const phases = new Float32Array(g.count);

        const cCenter = new THREE.Color(g.centerColor);
        const cInner = new THREE.Color(g.innerColor);
        const cOuter = new THREE.Color(g.outerColor);

        for (let i = 0; i < g.count; i++) {
          const i3 = i * 3;
          const arm = i % g.armCount;
          const armOffset = (arm / g.armCount) * Math.PI * 2;

          const rNorm = Math.pow(Math.random(), 0.6);
          const r = rNorm * g.radius;
          const spin = r * g.spiralTightness + armOffset;

          const rand = Math.pow(Math.random(), g.randomnessPower) * g.randomnessSpread * r;
          const randA = Math.random() * Math.PI * 2;
          const rx = Math.cos(randA) * rand;
          const rz = Math.sin(randA) * rand;

          positions[i3] = Math.cos(spin) * r + rx;
          positions[i3 + 1] = (Math.random() - 0.5) * g.diskThickness * (0.2 + rNorm);
          positions[i3 + 2] = Math.sin(spin) * r + rz;

          let col;
          if (rNorm < 0.2) {
            col = cCenter.clone().lerp(cInner, rNorm / 0.2);
          } else {
            col = cInner.clone().lerp(cOuter, (rNorm - 0.2) / 0.8);
          }
          const hsl = { h: 0, s: 0, l: 0 };
          col.getHSL(hsl);
          hsl.s = Math.min(1, hsl.s + (Math.random() - 0.5) * 0.025);
          col.setHSL(hsl.h, hsl.s, hsl.l);

          colors[i3] = col.r; colors[i3 + 1] = col.g; colors[i3 + 2] = col.b;
          scales[i] = THREE.MathUtils.lerp(g.sizeOuter, g.sizeCenter, 1.0 - rNorm) / 36;
          phases[i] = Math.random();
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
        geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uSize: { value: 1.0 },
            uMouseWorld: { value: new THREE.Vector3(999, 999, 999) },
            uMouseInfluence: { value: 0 },
            uCollapse: { value: 0 },
            uNamePulse: { value: 0 },
            uBlast: { value: 0 },
            uExposure: { value: 0 },
            uWarmth: { value: 0 }
          },
          vertexShader: GALAXY_VERTEX,
          fragmentShader: GALAXY_FRAGMENT,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geo, mat);
        points.rotation.x = -0.15;
        return points;
      }

      const galaxy = createGalaxy();
      scene.add(galaxy);

      function createHeroStars() {
        const count = CONFIG.heroStars.count;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const scales = new Float32Array(count);
        const phases = new Float32Array(count);
        const gold = new THREE.Color(0xffd090);
        const magenta = new THREE.Color(0xd060ff);

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const r = 2.0 + Math.random() * 6.8;
          const arm = Math.floor(Math.random() * 2);
          const spin = r * 3.0 + arm * Math.PI;
          positions[i3] = Math.cos(spin) * r + (Math.random() - 0.5) * 0.6;
          positions[i3 + 1] = (Math.random() - 0.5) * 0.28;
          positions[i3 + 2] = Math.sin(spin) * r + (Math.random() - 0.5) * 0.6;
          const col = gold.clone().lerp(magenta, Math.random() * 0.5);
          colors[i3] = col.r; colors[i3 + 1] = col.g; colors[i3 + 2] = col.b;
          scales[i] = 1.2 + Math.random() * 1.5;
          phases[i] = Math.random();
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
        geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uSize: { value: 1.4 },
            uMouseWorld: { value: new THREE.Vector3(999, 999, 999) },
            uMouseInfluence: { value: 0 },
            uCollapse: { value: 0 },
            uNamePulse: { value: 0 },
            uBlast: { value: 0 },
            uExposure: { value: 0 },
            uWarmth: { value: 0 }
          },
          vertexShader: GALAXY_VERTEX,
          fragmentShader: GALAXY_FRAGMENT,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        return new THREE.Points(geo, mat);
      }
      const heroStars = createHeroStars();
      scene.add(heroStars);

      function createAmbient(count, radius, sizeRange, opacity) {
        const positions = new Float32Array(count * 3);
        const phases = new Float32Array(count);
        const sizes = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const r = radius * (0.2 + Math.random() * 0.8);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          positions[i3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.45;
          positions[i3 + 2] = r * Math.cos(phi);
          phases[i] = Math.random();
          sizes[i] = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
        geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        const mat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uOpacity: { value: opacity } },
          vertexShader: AMBIENT_VERTEX,
          fragmentShader: AMBIENT_FRAGMENT,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        return new THREE.Points(geo, mat);
      }

      const bgStars = createAmbient(CONFIG.stars.count, CONFIG.stars.radius, [1.0, 2.8], 0.55);
      scene.add(bgStars);

      let dust = null;
      if (CONFIG.dust.count > 0) {
        dust = createAmbient(CONFIG.dust.count, CONFIG.dust.radius, [3, 8], 0.12);
        scene.add(dust);
      }

      function makeRadialTexture(inner, outer, size) {
        size = size || 128;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        g.addColorStop(0, inner);
        g.addColorStop(0.35, outer);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }

      const coreGroup = new THREE.Group();
      const layers = [
        { size: 0.22, inner: 'rgba(255,220,160,0.7)', outer: 'rgba(255,170,80,0.35)' },
        { size: 0.48, inner: 'rgba(255,180,100,0.35)', outer: 'rgba(255,120,60,0.12)' },
        { size: 0.9, inner: 'rgba(255,140,80,0.15)', outer: 'rgba(200,80,200,0)' },
        { size: 1.5, inner: 'rgba(180,100,220,0.06)', outer: 'rgba(100,60,200,0)' }
      ];
      layers.forEach(function (L) {
        const mat = new THREE.SpriteMaterial({
          map: makeRadialTexture(L.inner, L.outer),
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0
        });
        const spr = new THREE.Sprite(mat);
        spr.scale.set(L.size, L.size, 1);
        coreGroup.add(spr);
      });
      scene.add(coreGroup);

      const shootingStars = [];
      function spawnShootingStar() {
        if (isLowEndDevice && Math.random() > 0.4) return;
        const start = new THREE.Vector3(
          (Math.random() - 0.5) * 28,
          2.5 + Math.random() * 7,
          -12 - Math.random() * 18
        );
        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * 0.55,
          -0.35 - Math.random() * 0.45,
          0.75 + Math.random() * 0.55
        ).normalize();
        const len = 4.2 + Math.random() * 3.5; // longer trails

        // Multi-segment trail for soft gold → pink gradient feel
        const segs = 5;
        const positions = new Float32Array((segs + 1) * 3);
        for (let s = 0; s <= segs; s++) {
          const t = s / segs;
          positions[s * 3] = start.x + dir.x * len * t;
          positions[s * 3 + 1] = start.y + dir.y * len * t;
          positions[s * 3 + 2] = start.z + dir.z * len * t;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Gold-pink color
        const colors = [0xffe0a0, 0xffc080, 0xffa0b0, 0xff80c8, 0xe060ff];
        const col = colors[Math.floor(Math.random() * colors.length)];
        const mat = new THREE.LineBasicMaterial({
          color: col,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          linewidth: 1
        });
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        const obj = { line: line, mat: mat, geo: geo };
        shootingStars.push(obj);

        gsap.to(mat, {
          opacity: 0.85,
          duration: 0.22,
          ease: 'power2.out',
          onComplete: function () {
            gsap.to(mat, {
              opacity: 0,
              duration: 0.75,
              delay: 0.15,
              ease: 'power2.in',
              onComplete: function () {
                scene.remove(line);
                geo.dispose();
                mat.dispose();
                const idx = shootingStars.indexOf(obj);
                if (idx >= 0) shootingStars.splice(idx, 1);
              }
            });
          }
        });
        gsap.to(line.position, {
          x: dir.x * 18, y: dir.y * 12, z: dir.z * 14,
          duration: 1.15, ease: 'none'
        });
      }
      let nextShoot = 8 + Math.random() * 6;

      const mouse = new THREE.Vector2(999, 999);
      const mouseWorld = new THREE.Vector3(999, 999, 999);
      const raycaster = new THREE.Raycaster();
      const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const hit = new THREE.Vector3();
      let lastMoveTime = 0;
      let mouseInfluence = 0;

      function updateMouseWorld() {
        if (mouse.x > 2) { mouseWorld.set(999, 999, 999); return; }
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(plane, hit)) mouseWorld.copy(hit);
      }

      function onPointerMove(e) {
        const x = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
        const y = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
        if (x === undefined) return;
        mouse.x = (x / window.innerWidth) * 2 - 1;
        mouse.y = -(y / window.innerHeight) * 2 + 1;
        lastMoveTime = performance.now() * 0.001;
      }
      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });

      const isDesktop = !isMobile && window.matchMedia('(pointer: fine)').matches;
      if (isDesktop) {
        document.body.classList.add('desktop');
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        let rx = cx, ry = cy;
        window.addEventListener('pointermove', function (e) { cx = e.clientX; cy = e.clientY; });
        (function updateCursor() {
          rx += (cx - rx) * 0.18;
          ry += (cy - ry) * 0.18;
          dot.style.left = cx + 'px'; dot.style.top = cy + 'px';
          ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
          requestAnimationFrame(updateCursor);
        })();
      }

      let cameraSettled = false;
      let orbitAngle = 0;
      let orbitIntro = 0;

      function updateCamera(dt, elapsed) {
        if (!cameraSettled) {
          const progress = Math.min(1, elapsed / 14.5);
          const ease = 1 - Math.pow(1 - progress, 3);
          camera.position.z = THREE.MathUtils.lerp(CONFIG.camera.startZ, CONFIG.camera.settleZ, ease);
          camera.position.y = THREE.MathUtils.lerp(0.8, 0.28, ease);
          if (progress >= 1) cameraSettled = true;
        }
        if (!prefersReducedMotion && cameraSettled) {
          orbitIntro = Math.min(1, orbitIntro + dt * 0.09);
          orbitAngle += dt * 0.038 * orbitIntro;
          const radius = 0.45;
          camera.position.x = Math.sin(orbitAngle) * radius;
          camera.position.z = CONFIG.camera.settleZ + Math.cos(orbitAngle) * radius * 0.28;
          camera.position.y = 0.28 + Math.sin(orbitAngle * 0.6) * 0.09;
        }
        camera.lookAt(0, 0, 0);
      }

      const loveLine = document.getElementById('loveLine');
      const continueBtn = document.getElementById('continue-btn');
      const finalBtn = document.getElementById('final-btn');
      const cornerLabel = document.getElementById('corner-label');
      const hint = document.getElementById('hint');
      const flash = document.getElementById('flash');
      const soundBtn = document.getElementById('sound-btn');


      function fadeIn(el, delay, duration) {
        duration = duration || 1.9;
        return gsap.fromTo(el,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: duration, delay: delay, ease: 'power2.out' }
        );
      }
      function fadeOut(el, delay, duration) {
        duration = duration || 1.3;
        return gsap.to(el, { opacity: 0, y: -10, duration: duration, delay: delay, ease: 'power2.in' });
      }

      let timelineStarted = false;
      let interactive = false;

      function startCinematic() {
        if (timelineStarted) return;
        timelineStarted = true;

        const tl = gsap.timeline();

        // Galaxy emerges
        tl.to(galaxy.material.uniforms.uExposure, { value: 0.85, duration: 4.2, ease: 'power1.out' }, 0.3);
        tl.to(heroStars.material.uniforms.uExposure, { value: 0.98, duration: 4.2 }, 0.3);
        tl.to(coreGroup.children.map(function (c) { return c.material; }), {
          opacity: function (i) { return [0.45, 0.28, 0.16, 0.09][i]; },
          duration: 3.2,
          stagger: 0.1
        }, 0.7);

        // Continue button + interactive
        tl.add(function () {
          continueBtn.classList.add('visible');
          gsap.to(cornerLabel, { opacity: 1, duration: 2, delay: 0.2 });
          interactive = true;
          if (isDesktop) document.body.classList.add('ready');
          soundBtn.classList.add('show');
          if (galaxy.material.uniforms.uWarmth) {
            gsap.to(galaxy.material.uniforms.uWarmth, { value: 0.35, duration: 14, ease: 'none' });
            gsap.to(heroStars.material.uniforms.uWarmth, { value: 0.35, duration: 14, ease: 'none' });
          }
        }, 5.0);
      }

      continueBtn.addEventListener('click', function () {
        continueBtn.classList.remove('visible');

        gsap.to(galaxy.material.uniforms.uCollapse, { value: 1, duration: 1.8, ease: 'power3.in' });
        gsap.to(heroStars.material.uniforms.uCollapse, { value: 1, duration: 1.8, ease: 'power3.in' });
        gsap.to(coreGroup.scale, { x: 0.06, y: 0.06, z: 0.06, duration: 1.7, ease: 'power3.in' });

        gsap.to(flash, {
          opacity: 0.55,
          duration: 0.25,
          delay: 1.45,
          ease: 'power2.in',
          onComplete: function () {
            galaxy.material.uniforms.uCollapse.value = 0;
            heroStars.material.uniforms.uCollapse.value = 0;
            coreGroup.scale.set(1, 1, 1);

            gsap.to(galaxy.material.uniforms.uBlast, { value: 1.2, duration: 1.7, ease: 'power2.out' });
            gsap.to(heroStars.material.uniforms.uBlast, { value: 1.3, duration: 1.7, ease: 'power2.out' });

            gsap.to(galaxy.material.uniforms.uExposure, {
              value: 1.05, duration: 0.5, yoyo: true, repeat: 1, ease: 'power1.inOut'
            });
            gsap.to(heroStars.material.uniforms.uExposure, {
              value: 1.15, duration: 0.5, yoyo: true, repeat: 1
            });

            gsap.to(coreGroup.children.map(function (c) { return c.material; }), {
              opacity: function (i) { return [0.35, 0.22, 0.12, 0.06][i]; },
              duration: 0.6
            });

            gsap.to(flash, { opacity: 0, duration: 1.6, ease: 'power2.out' });

            gsap.to(galaxy.material.uniforms.uBlast, {
              value: 0, duration: 4.2, delay: 1.5, ease: 'power2.inOut'
            });
            gsap.to(heroStars.material.uniforms.uBlast, {
              value: 0, duration: 4.2, delay: 1.5, ease: 'power2.inOut'
            });

            gsap.delayedCall(2.2, function () {
              gsap.fromTo(loveLine,
                { opacity: 0, y: 18, scale: 0.94 },
                { opacity: 1, y: 0, scale: 1, duration: 3.0, ease: 'power2.out' }
              );
            });

            gsap.delayedCall(5.5, function () {
              finalBtn.classList.add('visible');
            });

            gsap.delayedCall(9.0, function () {
              hint.classList.add('show');
              setTimeout(function () { hint.classList.remove('show'); }, 6500);
            });
          }
        });
      });


      // Click-to-sparkle (only after ending)
      window.addEventListener('pointerdown', function (e) {
        if (!clickSparklesEnabled) return;
        // Don't trigger on buttons
        if (e.target.closest && (e.target.closest('button'))) return;
        const mx = (e.clientX / window.innerWidth) * 2 - 1;
        const my = -(e.clientY / window.innerHeight) * 2 + 1;
        const vec = new THREE.Vector3(mx, my, 0.5);
        vec.unproject(camera);
        const dir = vec.sub(camera.position).normalize();
        // Place burst roughly at galaxy plane
        const dist = 8.5;
        const pos = camera.position.clone().add(dir.multiplyScalar(dist));
        spawnClickBurst(pos.x, pos.y, pos.z);
      });

      finalBtn.addEventListener('click', function () {
        finalBtn.classList.remove('visible');
        gsap.to(loveLine, { opacity: 0, duration: 1.8 });
        gsap.to(galaxy.material.uniforms.uExposure, { value: 1.15, duration: 2.5 });
        gsap.to(heroStars.material.uniforms.uExposure, { value: 1.25, duration: 2.5 });
        gsap.to(coreGroup.children.map(function (c) { return c.material; }), {
          opacity: function (i) { return [0.5, 0.32, 0.18, 0.1][i]; },
          duration: 2.0
        });
        // Floating sparkles / hearts rising
        spawnFloatingSparkles(isLowEndDevice ? 12 : 22);
        // Enable click-to-sparkle
        clickSparklesEnabled = true;
        // Gentle warmth boost
        if (galaxy.material.uniforms.uWarmth) {
          gsap.to(galaxy.material.uniforms.uWarmth, { value: 0.85, duration: 4.0, ease: 'power1.out' });
          gsap.to(heroStars.material.uniforms.uWarmth, { value: 0.85, duration: 4.0, ease: 'power1.out' });
        }
      });

      const ambient = document.getElementById('ambient');
      let soundOn = false;

      function setSoundUI(on) {
        soundOn = on;
        soundBtn.style.color = on ? 'rgba(255,220,170,0.95)' : 'rgba(255,220,180,0.45)';
      }

      function tryPlayAudio() {
        if (!ambient) return;
        ambient.volume = 0.7;
        const p = ambient.play();
        if (p && p.then) {
          p.then(function () { setSoundUI(true); })
            .catch(function () { setSoundUI(false); });
        }
      }

      // Attempt autoplay as soon as page loads
      tryPlayAudio();

      // If browser blocked autoplay, start on first user interaction
      function unlockAudioOnce() {
        if (!soundOn) tryPlayAudio();
        window.removeEventListener('pointerdown', unlockAudioOnce);
        window.removeEventListener('touchstart', unlockAudioOnce);
        window.removeEventListener('keydown', unlockAudioOnce);
      }
      window.addEventListener('pointerdown', unlockAudioOnce, { once: true });
      window.addEventListener('touchstart', unlockAudioOnce, { once: true, passive: true });
      window.addEventListener('keydown', unlockAudioOnce, { once: true });

      soundBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (soundOn) {
          ambient.pause();
          setSoundUI(false);
        } else {
          tryPlayAudio();
        }
      });

      let frameTimes = [];
      let qualityChecked = false;
      function sampleQuality(dt) {
        if (qualityChecked) return;
        frameTimes.push(dt);
        if (frameTimes.length < 40) return;
        qualityChecked = true;
        const avg = frameTimes.reduce(function (a, b) { return a + b; }, 0) / frameTimes.length;
        if (avg > 0.033) {
          if (dust) {
            scene.remove(dust);
            dust.geometry.dispose();
            dust.material.dispose();
            dust = null;
          }
          renderer.setPixelRatio(Math.min(renderer.getPixelRatio(), 1.0));
        }
      }

      const clock = new THREE.Clock();
      let elapsed = 0;


      // ── Floating sparkles / hearts after "Yes, forever" ──
      const sparkleGroup = new THREE.Group();
      scene.add(sparkleGroup);
      let sparklesActive = false;
      let clickSparklesEnabled = false;

      function createSparkleTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, 'rgba(255,240,200,1)');
        g.addColorStop(0.25, 'rgba(255,200,140,0.7)');
        g.addColorStop(0.55, 'rgba(255,150,180,0.25)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 64, 64);
        // tiny cross for star feel
        ctx.strokeStyle = 'rgba(255,230,180,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(32, 12); ctx.lineTo(32, 52); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(12, 32); ctx.lineTo(52, 32); ctx.stroke();
        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }
      const sparkleTex = createSparkleTexture();

      function spawnFloatingSparkles(count) {
        count = count || 18;
        sparklesActive = true;
        for (let i = 0; i < count; i++) {
          const mat = new THREE.SpriteMaterial({
            map: sparkleTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0
          });
          const spr = new THREE.Sprite(mat);
          const ang = Math.random() * Math.PI * 2;
          const rad = 0.8 + Math.random() * 4.5;
          spr.position.set(
            Math.cos(ang) * rad,
            -1.5 + Math.random() * 1.2,
            Math.sin(ang) * rad
          );
          const s = 0.08 + Math.random() * 0.18;
          spr.scale.set(s, s, 1);
          sparkleGroup.add(spr);

          const rise = 2.5 + Math.random() * 3.5;
          const driftX = (Math.random() - 0.5) * 1.8;
          const driftZ = (Math.random() - 0.5) * 1.8;
          const dur = 3.5 + Math.random() * 2.5;

          gsap.to(mat, { opacity: 0.7 + Math.random() * 0.25, duration: 0.8, ease: 'power1.out' });
          gsap.to(spr.position, {
            y: spr.position.y + rise,
            x: spr.position.x + driftX,
            z: spr.position.z + driftZ,
            duration: dur,
            ease: 'power1.out'
          });
          gsap.to(mat, {
            opacity: 0,
            duration: 1.4,
            delay: dur - 1.4,
            ease: 'power1.in',
            onComplete: function () {
              sparkleGroup.remove(spr);
              mat.dispose();
            }
          });
          gsap.to(spr.scale, {
            x: s * 0.3, y: s * 0.3,
            duration: dur,
            ease: 'power1.in'
          });
        }
      }

      function spawnClickBurst(worldX, worldY, worldZ) {
        const count = isLowEndDevice ? 8 : 14;
        for (let i = 0; i < count; i++) {
          const mat = new THREE.SpriteMaterial({
            map: sparkleTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0
          });
          const spr = new THREE.Sprite(mat);
          spr.position.set(worldX, worldY, worldZ);
          const s = 0.06 + Math.random() * 0.14;
          spr.scale.set(s, s, 1);
          sparkleGroup.add(spr);

          const ang = Math.random() * Math.PI * 2;
          const elev = (Math.random() - 0.3) * Math.PI * 0.6;
          const dist = 0.6 + Math.random() * 1.8;
          const tx = worldX + Math.cos(ang) * Math.cos(elev) * dist;
          const ty = worldY + Math.sin(elev) * dist;
          const tz = worldZ + Math.sin(ang) * Math.cos(elev) * dist;

          gsap.to(mat, { opacity: 0.85, duration: 0.15, ease: 'power2.out' });
          gsap.to(spr.position, {
            x: tx, y: ty, z: tz,
            duration: 0.9 + Math.random() * 0.5,
            ease: 'power2.out'
          });
          gsap.to(mat, {
            opacity: 0,
            duration: 0.6,
            delay: 0.4,
            ease: 'power1.in',
            onComplete: function () {
              sparkleGroup.remove(spr);
              mat.dispose();
            }
          });
          gsap.to(spr.scale, {
            x: s * 0.2, y: s * 0.2,
            duration: 1.1,
            ease: 'power1.in'
          });
        }
      }


      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        elapsed = clock.elapsedTime;

        galaxy.material.uniforms.uTime.value = elapsed;
        heroStars.material.uniforms.uTime.value = elapsed;
        bgStars.material.uniforms.uTime.value = elapsed;
        if (dust) dust.material.uniforms.uTime.value = elapsed;

        const now = performance.now() * 0.001;
        const idle = now - lastMoveTime;
        const targetInfl = idle < CONFIG.idleFadeSeconds ? 1 : 0;
        mouseInfluence += (targetInfl - mouseInfluence) * Math.min(1, dt * 3.5);
        galaxy.material.uniforms.uMouseInfluence.value = mouseInfluence;
        heroStars.material.uniforms.uMouseInfluence.value = mouseInfluence;

        updateMouseWorld();
        galaxy.material.uniforms.uMouseWorld.value.copy(mouseWorld);
        heroStars.material.uniforms.uMouseWorld.value.copy(mouseWorld);

        galaxy.rotation.y += dt * CONFIG.rotationSpeed * 0.13;
        heroStars.rotation.y = galaxy.rotation.y;
        coreGroup.rotation.y = galaxy.rotation.y * 0.22;

        updateCamera(dt, elapsed);

        nextShoot -= dt;
        if (nextShoot <= 0 && interactive) {
          spawnShootingStar();
          nextShoot = (isLowEndDevice ? 9 : 5.5) + Math.random() * (isLowEndDevice ? 8 : 6);
        }

        sampleQuality(dt);
        renderer.render(scene, camera);
      }

      function handleResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.pixelRatioCap));
      }
      window.addEventListener('resize', handleResize);

      setTimeout(function () {
        startCinematic();
        animate();
      }, 300);
    })();
  </script>
</body>

</html>
