<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>I Love You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#fff3ec;
    --pink-2:#ffd9e6;
    --pink-3:#ff8fac;
    --rose:#e8547a;
    --deep:#5c2233;
    --gold:#e8b978;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;
    background:#fff3ec;
    font-family:'Playfair Display',serif;
    touch-action:none;
  }
  #stage{
    position:fixed;inset:0;
    overflow:hidden;
  }
  .scene{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity 1.4s ease;
  }
  .scene.active{opacity:1;pointer-events:auto;}

  /* ---------- shared radial glow backdrop ---------- */
  .glow-bg{
    position:absolute;inset:0;
    background:radial-gradient(circle at 50% 62%, var(--pink-3) 0%, var(--pink-2) 38%, var(--pink-1) 72%);
  }
  .glow-bg.soft{
    background:radial-gradient(circle at 50% 55%, #ffe3ec 0%, #fff3ec 60%, #fff8f3 100%);
  }

  /* ================= SCENE 1 — bow, arrow & balloon ================= */
  #scene-launch .top-label{
    position:absolute;top:8%;left:50%;transform:translateX(-50%);
    font-size:13px;letter-spacing:.22em;text-transform:lowercase;
    color:var(--deep);opacity:.55;font-style:italic;
  }
  #scene-launch .bottom-label{
    position:absolute;bottom:7%;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--deep);opacity:.45;
  }
  #slingWrap{
    position:relative;
    width:min(92vw,420px);
    height:min(88vh,640px);
  }
  #slingSvg{width:100%;height:100%;overflow:visible;}
  .arrow-drag{cursor:grab;}
  .arrow-drag:active{cursor:grabbing;}
  #balloonGroup{
    animation:balloonFloat 3.2s ease-in-out infinite;
    transform-origin:150px 120px;
  }
  @keyframes balloonFloat{
    0%,100%{transform:translate(0,0) rotate(-1.5deg);}
    50%{transform:translate(0,-9px) rotate(1.5deg);}
  }
  .flash{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  }
  .pop-piece{
    position:absolute;pointer-events:none;
  }

  /* ================= SCENE 2 — big words ================= */
  #scene-words h1{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(46px,13vw,110px);
    color:var(--rose);
    margin:0;
    letter-spacing:.03em;
    text-shadow:0 8px 30px rgba(232,84,122,.25);
    opacity:0;
    transform:translateY(18px) scale(.92);
    transition:opacity 1.4s cubic-bezier(.2,.8,.2,1), transform 1.4s cubic-bezier(.2,.8,.2,1);
  }
  #scene-words.active h1{opacity:1;transform:translateY(0) scale(1);}
  #scene-words p{
    font-family:'Dancing Script',cursive;
    font-size:clamp(18px,3.4vw,26px);
    color:var(--deep);
    opacity:0;
    margin:14px 0 0;
    transition:opacity 1.6s ease 1s;
  }
  #scene-words.active p{opacity:.75;}
  .petal{
    position:absolute;top:-30px;
    font-size:14px;
    color:var(--pink-3);
    opacity:.8;
    pointer-events:none;
  }

  /* ================= SCENE 3 — tree ================= */
  #scene-tree svg{width:min(70vw,300px);height:min(70vw,300px);}
  #scene-tree .tagline-script{
    font-family:'Dancing Script',cursive;
    font-size:clamp(30px,7vw,52px);
    color:var(--rose);
    margin-top:-4px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 1.2s ease, transform 1.2s ease;
  }
  #scene-tree.active .tagline-script{opacity:1;transform:translateY(0);transition-delay:1.6s;}
  #scene-tree .tagline-small{
    font-size:12px;letter-spacing:.14em;color:var(--deep);opacity:0;
    text-transform:lowercase;font-style:italic;
    transition:opacity 1.2s ease;
  }
  #scene-tree.active .tagline-small{opacity:.5;transition-delay:2.1s;}
  .falling-heart{
    position:absolute;top:-24px;
    pointer-events:none;
  }

  /* ================= SCENE 4 — balloon bouquet ================= */
  #balloonField{
    position:relative;
    width:min(88vw,380px);
    height:min(60vh,420px);
  }
  .balloon{
    position:absolute;
    width:22px;height:26px;
    border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    transform:translate(-50%,-50%);
    box-shadow:inset -3px -4px 6px rgba(0,0,0,.12), inset 3px 4px 6px rgba(255,255,255,.35);
  }
  .stem-line{
    position:absolute;left:50%;bottom:0;
    width:2px;
    background:linear-gradient(180deg,#7a4a3a,#4a2b20);
    transform:translateX(-50%);
    border-radius:2px;
  }
  #scene-bouquet .tagline-script{
    font-family:'Dancing Script',cursive;
    font-size:clamp(30px,7vw,52px);
    color:var(--rose);
    margin-top:6px;
    opacity:0;transform:translateY(10px);
    transition:opacity 1.2s ease 1.4s, transform 1.2s ease 1.4s;
  }
  #scene-bouquet.active .tagline-script{opacity:1;transform:translateY(0);}
  #scene-bouquet .tagline-small{
    font-size:12px;letter-spacing:.1em;color:var(--deep);opacity:0;
    text-transform:lowercase;font-style:italic;
    transition:opacity 1.2s ease 1.9s;
  }
  #scene-bouquet.active .tagline-small{opacity:.55;}

  .bouquet-continue{
    margin-top:22px;
    display:inline-flex;align-items:center;gap:8px;
    color:var(--deep);
    text-decoration:none;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:.02em;
    border:1px solid rgba(232,84,122,.35);
    padding:10px 20px;
    border-radius:30px;
    background:rgba(255,255,255,.4);
    backdrop-filter:blur(4px);
    opacity:0;
    transform:translateY(6px);
    transition:opacity 1.2s ease 2.6s, transform 1.2s ease 2.6s, background .25s ease;
  }
  #scene-bouquet.active .bouquet-continue{opacity:1;transform:translateY(0);}
  .bouquet-continue:hover{background:rgba(255,255,255,.7);}
  .bouquet-continue .arrow{transition:transform .25s ease;}
  .bouquet-continue:hover .arrow{transform:translateX(4px);}

  @keyframes bob{
    0%,100%{transform:translate(-50%,-50%) translateY(0);}
    50%{transform:translate(-50%,-50%) translateY(-6px);}
  }

  .sparkle{
    position:absolute;border-radius:50%;background:#fff;
    box-shadow:0 0 6px 1px rgba(255,255,255,.9);
    pointer-events:none;
  }

  .replay-btn{
    position:fixed;bottom:20px;right:20px;z-index:20;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(232,84,122,.3);
    color:var(--rose);
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:12px;
    padding:9px 16px;
    border-radius:24px;
    backdrop-filter:blur(6px);
    cursor:pointer;
    opacity:0;
    transition:opacity .8s ease;
  }
  .replay-btn.show{opacity:1;}

  .sound-toggle{
    position:fixed;bottom:20px;left:20px;z-index:20;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(232,84,122,.3);
    color:var(--rose);
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:12px;padding:9px 16px;border-radius:24px;
    backdrop-filter:blur(6px);cursor:pointer;
    transition:opacity .4s ease, transform .3s ease, background .2s ease;
  }
  .sound-toggle:hover{background:rgba(255,255,255,.8);transform:translateY(-2px);}
  .eqbars{display:inline-flex;align-items:flex-end;gap:2px;height:13px;}
  .eqbars .bar{width:3px;background:var(--rose);display:inline-block;border-radius:2px;animation:eq .9s ease-in-out infinite;}
  .eqbars .bar:nth-child(1){height:6px;animation-delay:0s;}
  .eqbars .bar:nth-child(2){height:10px;animation-delay:.15s;}
  .eqbars .bar:nth-child(3){height:13px;animation-delay:.3s;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
</style>
</head>
<body>
<style id="site-polish-style">
  html{scroll-behavior:smooth;}

  #spLoadVeil{
    position:fixed;inset:0;z-index:99997;
    background:inherit;
    pointer-events:none;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:1;
    transition:opacity .9s ease, backdrop-filter .9s ease;
  }
  #spLoadVeil.sp-gone{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);}

  /* NOTE: intentionally not touching opacity/filter of body's children here —
     several pages manage their own .scene visibility via opacity, and doing
     so here would force every scene visible at once. The veil above handles
     the whole "fade in from blur" effect on its own. */

  .sp-glow-hit{
    animation:spGlowPulse .55s ease;
  }
  @keyframes spGlowPulse{
    0%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
    40%{filter:drop-shadow(0 0 14px rgba(255,111,149,.9));}
    100%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
  }

  #spChapterLabel{
    position:fixed;
    top:16px;left:50%;transform:translateX(-50%);
    z-index:99991;
    font-family:'Playfair Display',Georgia,serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
    background:rgba(0,0,0,.22);
    padding:6px 14px;
    border-radius:20px;
    backdrop-filter:blur(3px);
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  #spChapterLabel.sp-show{opacity:.85;}
</style>

<div id="spLoadVeil"></div>
<div id="spChapterLabel"></div>

<script id="site-polish-script">
(function(){
  /* ---------- 1. Load fade-in (blur to sharp) ---------- */
  function revealVeil(){
    var veil = document.getElementById('spLoadVeil');
    if(!veil || veil.classList.contains('sp-gone')) return;
    veil.classList.add('sp-gone');
    setTimeout(function(){ if(veil.parentNode) veil.remove(); }, 1000);
  }
  window.addEventListener('load', function(){
    requestAnimationFrame(function(){ requestAnimationFrame(revealVeil); });
  });
  if(document.readyState === 'complete'){
    revealVeil();
  }

  /* ---------- 2. Hover / tap glow on interactive elements ---------- */
  var interactiveSelector = 'button, a, input, .btn-continue, .btn-next, [onclick], [role="button"]';

  function pulse(el){
    el.classList.remove('sp-glow-hit');
    void el.offsetWidth;
    el.classList.add('sp-glow-hit');
  }

  document.addEventListener('mouseover', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  });
  document.addEventListener('touchstart', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  }, {passive:true});

  /* ---------- 3. Smooth scroll ---------- */
  /* handled via CSS scroll-behavior:smooth above */

  /* ---------- 4. Chapter label (brief, then fades away) ---------- */
  var CHAPTERS = {
    'index.html': 'Chapter 1 · The Beginning',
    'passwordgate.html': 'Chapter 1 · The Beginning',
    'potl-welcome.html': 'Chapter 1 · The Beginning',
    'firsts.html': 'Chapter 2 · Our Firsts',
    'jigsaw.html': 'Chapter 2 · Our Firsts',
    'tangled_love.html': 'Chapter 2 · Our Firsts',
    'stars.html': 'Chapter 3 · Under the Stars',
    'catch.html': 'Chapter 3 · Under the Stars',
    'our_constellation_part1.html': 'Chapter 3 · Under the Stars',
    'our_constellation.html': 'Chapter 3 · Under the Stars',
    'our_memorie_8_.html': 'Chapter 3 · Under the Stars',
    'memorymatch.html': 'Chapter 3 · Under the Stars',
    'night_quotes.html': 'Chapter 4 · Just Us',
    'playlist.html': 'Chapter 4 · Just Us',
    'videos.html': 'Chapter 4 · Just Us',
    'proposal.html': 'Chapter 4 · Just Us',
    'flames_new_fonts.html': 'Chapter 4 · Just Us',
    'potl-securitycheck.html': 'Chapter 4 · Just Us',
    'heart.html': 'Chapter 5 · For You',
    'cards (2).html': 'Chapter 5 · For You',
    'i_love_you.html': 'Chapter 5 · For You',
    'For_Anusha_-_Complete_Journey (2).html': 'Chapter 6 · Forever',
    'swipe.html': 'Chapter 6 · Forever',
    'her-smile-gallery (1).html': 'Chapter 6 · Forever',
    'three_quotes.html': 'Chapter 6 · Forever',
    'ourmoments (2).html': 'Chapter 6 · Forever',
    'love_quotes.html': 'Chapter 6 · Forever',
    'hearts.html': 'Chapter 7 · The Promise',
    'contract.html': 'Chapter 7 · The Promise',
    'proposal_with_song.html': 'Chapter 7 · The Promise'
  };

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var label = CHAPTERS[here];

  if(here === 'polaroids.html'){
    var visits = parseInt(sessionStorage.getItem('spPolaroidsVisits') || '0', 10) + 1;
    sessionStorage.setItem('spPolaroidsVisits', visits);
    label = visits <= 1 ? 'Chapter 2 · Our Firsts' : 'Chapter 7 · The Promise';
  }

  if(label){
    var el = document.getElementById('spChapterLabel');
    el.textContent = label;
    setTimeout(function(){ el.classList.add('sp-show'); }, 1300);
    setTimeout(function(){ el.classList.remove('sp-show'); }, 4200);
  }
})();
</script>

<script>
(function(){
  const svg = document.getElementById('slingSvg');
  const arrowGroup = document.getElementById('arrowGroup');
  const bowStringTop = document.getElementById('bowStringTop');
  const bowStringBottom = document.getElementById('bowStringBottom');
  const balloonGroup = document.getElementById('balloonGroup');
  const flash = document.getElementById('flashOverlay');
  const nock = {x:88, y:435};
  const maxPull = 55;
  const balloonTarget = {x:150, y:110}; // balloon center, roughly (float animation moves it slightly)

  let dragging = false;
  let pos = {...nock};
  let launched = false;

  function svgPoint(evt){
    const pt = svg.createSVGPoint();
    const t = evt.touches ? evt.touches[0] : evt;
    pt.x = t.clientX; pt.y = t.clientY;
    const ctm = svg.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  function updateVisual(angleDeg){
    const rot = angleDeg !== undefined ? angleDeg : 0;
    arrowGroup.setAttribute('transform', `translate(${pos.x},${pos.y}) rotate(${rot})`);
    bowStringTop.setAttribute('x2', pos.x); bowStringTop.setAttribute('y2', pos.y);
    bowStringBottom.setAttribute('x2', pos.x); bowStringBottom.setAttribute('y2', pos.y);
  }

  function clampPull(p){
    // only allow pulling down/back (away from the balloon), constrained to a small arc near the bow
    const dx = p.x - nock.x;
    let dy = p.y - nock.y;
    if(dy < 0) dy = 0; // can't push forward past rest
    const dist = Math.hypot(dx,dy);
    if(dist > maxPull){
      const ratio = maxPull/dist;
      return {x: nock.x + dx*ratio, y: nock.y + dy*ratio};
    }
    return {x: nock.x + dx, y: nock.y + dy};
  }

  function onDown(e){
    if(launched) return;
    dragging = true;
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging || launched) return;
    e.preventDefault();
    pos = clampPull(svgPoint(e));
    updateVisual(0);
  }
  function onUp(e){
    if(!dragging || launched) return;
    dragging = false;
    const pullDist = Math.hypot(pos.x-nock.x, pos.y-nock.y);
    if(pullDist < 12){
      pos = {...nock};
      updateVisual(0);
      return;
    }
    launched = true;
    fireArrow(pullDist);
  }

  arrowGroup.addEventListener('mousedown', onDown);
  arrowGroup.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);

  function fireArrow(power){
    const startPos = {...pos};
    const totalSteps = 22;
    let t = 0;
    function step(){
      t += 1;
      const p = t/totalSteps;
      const ease = 1 - Math.pow(1-p, 2); // ease-out
      pos.x = startPos.x + (balloonTarget.x - startPos.x) * ease;
      pos.y = startPos.y + (balloonTarget.y - startPos.y) * ease;
      updateVisual(0);
      if(t < totalSteps){
        requestAnimationFrame(step);
      } else {
        popBalloon();
      }
    }
    requestAnimationFrame(step);
  }

  function popBalloon(){
    balloonGroup.style.transition = 'transform .12s ease-out, opacity .12s ease-out';
    balloonGroup.style.transform = 'scale(1.25)';
    arrowGroup.style.opacity = '0';
    spawnBurst();
    setTimeout(()=>{
      balloonGroup.style.opacity = '0';
      balloonGroup.style.transform = 'scale(0.2)';
      triggerFlashAndAdvance();
    }, 110);
  }

  function spawnBurst(){
    const bRect = balloonGroup.getBoundingClientRect();
    const cx = bRect.left + bRect.width/2;
    const cy = bRect.top + bRect.height/2;
    const colors = ['#ff8fac','#e8547a','#ffd166','#ff6f95','#ffffff'];
    for(let i=0;i<22;i++){
      const piece = document.createElement('div');
      piece.className = 'pop-piece';
      piece.style.left = cx+'px';
      piece.style.top = cy+'px';
      piece.style.fontSize = (10+Math.random()*8)+'px';
      piece.style.color = colors[i%colors.length];
      piece.textContent = ['♥','✦','·'][Math.floor(Math.random()*3)];
      document.body.appendChild(piece);
      const angle = Math.random()*Math.PI*2;
      const dist = 60+Math.random()*90;
      const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
      piece.animate([
        {transform:'translate(-50%,-50%) scale(0.6)', opacity:1},
        {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1)`, opacity:0}
      ], {duration:750+Math.random()*300, easing:'ease-out'});
      setTimeout(()=>piece.remove(), 1100);
    }
  }

  function triggerFlashAndAdvance(){
    flash.style.transition = 'opacity .5s ease';
    flash.style.opacity = '1';
    setTimeout(()=>{
      showScene('scene-words');
      spawnPetals();
      setTimeout(()=>{ flash.style.opacity = '0'; }, 300);
    }, 480);

    setTimeout(()=>{ showScene('scene-tree'); growTree(); }, 3600);
    setTimeout(()=>{ showScene('scene-bouquet'); buildBouquet(); }, 8200);
    setTimeout(()=>{ document.getElementById('replayBtn').classList.add('show'); }, 9600);
  }

  function showScene(id){
    document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------- petals for word scene ---------- */
  function spawnPetals(){
    const scene = document.getElementById('scene-words');
    for(let i=0;i<16;i++){
      setTimeout(()=>{
        const p = document.createElement('div');
        p.className = 'petal';
        p.textContent = ['♥','✦','❀'][Math.floor(Math.random()*3)];
        p.style.left = (Math.random()*100)+'%';
        p.style.fontSize = (10+Math.random()*10)+'px';
        scene.appendChild(p);
        const dur = 4000+Math.random()*3000;
        p.animate([
          {transform:'translateY(-30px) rotate(0deg)', opacity:0},
          {transform:'translateY(40vh) rotate(180deg)', opacity:.85, offset:.2},
          {transform:'translateY(100vh) rotate(360deg)', opacity:0}
        ], {duration:dur, easing:'ease-in'});
        setTimeout(()=>p.remove(), dur+100);
      }, i*260);
    }
  }

  /* ---------- tree growth ---------- */
  function growTree(){
    const path = document.getElementById('treePath');
    path.style.transition = 'stroke-dashoffset 2.2s ease';
    requestAnimationFrame(()=>{ path.style.strokeDashoffset = '0'; });

    const scene = document.getElementById('scene-tree');
    let count = 0;
    const fallInterval = setInterval(()=>{
      count++;
      const h = document.createElement('div');
      h.className = 'falling-heart';
      h.innerHTML = '♥';
      h.style.left = (30+Math.random()*40)+'%';
      h.style.color = ['#ff8fac','#e8547a','#ffd166'][Math.floor(Math.random()*3)];
      h.style.fontSize = (10+Math.random()*8)+'px';
      scene.appendChild(h);
      const dur = 3200+Math.random()*1600;
      const drift = (Math.random()*80-40);
      h.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:0},
        {transform:`translate(${drift*0.3}px, 40vh) rotate(120deg)`, opacity:.8, offset:.3},
        {transform:`translate(${drift}px, 90vh) rotate(300deg)`, opacity:0}
      ], {duration:dur, easing:'ease-in'});
      setTimeout(()=>h.remove(), dur+100);
      if(count > 40) clearInterval(fallInterval);
    }, 260);
  }

  /* ---------- balloon heart bouquet ---------- */
  function buildBouquet(){
    const field = document.getElementById('balloonField');
    field.innerHTML = '';
    const w = field.clientWidth, h = field.clientHeight;
    const cx = w/2, cy = h*0.42;
    const scale = Math.min(w,h)/34;
    const colors = ['#ff8fac','#ff6f95','#ffd166','#e8547a','#ffb3c6','#f4a3c1'];

    // stem
    const stem = document.createElement('div');
    stem.className = 'stem-line';
    stem.style.height = (h*0.42)+'px';
    stem.style.bottom = '0px';
    field.appendChild(stem);

    const N = 55;
    for(let i=0;i<N;i++){
      const angle = Math.random()*Math.PI*2;
      const r = Math.random();
      // parametric heart with random fill inside via radius shrink
      const t = Math.random()*Math.PI*2;
      const rr = 0.55 + Math.random()*0.5;
      const x = 16*Math.pow(Math.sin(t),3) * rr;
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * rr;

      const b = document.createElement('div');
      b.className = 'balloon';
      const size = 16 + Math.random()*14;
      b.style.width = size+'px';
      b.style.height = (size*1.15)+'px';
      b.style.left = (cx + x*scale)+'px';
      b.style.top = (cy + y*scale)+'px';
      b.style.background = `radial-gradient(circle at 35% 30%, #fff, ${colors[i%colors.length]} 55%, ${colors[(i+2)%colors.length]})`;
      b.style.animation = `bob ${2+Math.random()*1.6}s ease-in-out ${Math.random()*2}s infinite`;
      b.style.opacity = '0';
      b.style.transition = 'opacity .8s ease, transform .8s ease';
      field.appendChild(b);
      setTimeout(()=>{ b.style.opacity = '1'; }, 40*i);
    }

    // gentle ambient sparkle
    for(let i=0;i<18;i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      const size = 2+Math.random()*2;
      s.style.width = size+'px'; s.style.height = size+'px';
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*70)+'%';
      s.style.opacity = (0.3+Math.random()*0.5).toFixed(2);
      field.appendChild(s);
      s.animate([{opacity:.2},{opacity:.9},{opacity:.2}], {duration:1800+Math.random()*1400, iterations:Infinity});
    }
  }

      { type:'heart',   glyph:'♥', colors:['#ff6f45','#ff8f5a'] }
    ],
    'stars.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#a8d8ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#8fd6ff','#e0f4ff'] },
      { type:'petal',   glyph:'❀', colors:['#c9e8ff','#e6f4ff'] }
    ],
    'our_constellation_part1.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'our_constellation.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'tangled_love.html': [
      { type:'heart', glyph:'♥', colors:['#ff5f8f','#e8547a'] },
      { type:'petal', glyph:'✿', colors:['#ffc3dd','#ffb6d9'] }
    ],
    'contract.html': [
      { type:'sparkle', glyph:'✦', colors:['#e8b978','#d4a95f'] },
      { type:'heart',   glyph:'♥', colors:['#ff8fac'] }
    ]
  };

  var DEFAULT_THEME = [
    { type:'heart',  glyph:'♥', colors:['#ff6f95','#ff8fac','#e8547a','#ffb3c6'] },
    { type:'heart',  glyph:'❤', colors:['#ff5f8f','#ff9ecb'] },
    { type:'petal',  glyph:'✿', colors:['#ffc3dd','#ffd6e6','#f7a8c4'] },
    { type:'petal',  glyph:'❀', colors:['#ffb6d9','#ffe0ef'] },
    { type:'petal',  glyph:'✾', colors:['#ffd6a5','#ffe8c9'] },
    { type:'sparkle',glyph:'✦', colors:['#ffe14d','#ffc36b','#fff3b0'] },
    { type:'sparkle',glyph:'✧', colors:['#c9e8ff','#ffffff'] },
    { type:'sparkle',glyph:'·', colors:['#ffffff','#ffe9f2'] }
  ];

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var shapes = THEMES[here] || DEFAULT_THEME;

  var isSmallScreen = window.innerWidth < 400;
  var minInterval = isSmallScreen ? 75 : 50;

  var lastSpawn = 0;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildWaveKeyframes(x, y, size, kind){
    var totalDriftY = kind === 'sparkle' ? rand(-26,-10) : rand(50,95);
    var swayAmp = kind === 'sparkle' ? rand(4,10) : rand(18,34);
    var swayDir = Math.random() < 0.5 ? 1 : -1;
    var totalRot = rand(-50,50) * (kind === 'petal' ? 1.6 : 1);
    var steps = 6;
    var frames = [];

    for(var i=0;i<=steps;i++){
      var t = i/steps;
      var vy = totalDriftY * (t*t*(3-2*t));
      var vx = Math.sin(t*Math.PI*1.3) * swayAmp * swayDir * (kind === 'sparkle' ? 0.4 : 1);
      var rot = totalRot * t;
      var scale, opacity;
      if(kind === 'sparkle'){
        scale = t < 0.3 ? (0.4 + t*2.6) : (1.15 - (t-0.3)*0.6);
        opacity = t < 0.15 ? t/0.15 : (t > 0.7 ? Math.max(0,(1-t)/0.3) : 0.75 + Math.sin(t*22)*0.25);
      } else {
        scale = t < 0.25 ? (0.5 + t*2) : (1 - (t-0.25)*0.35);
        opacity = t < 0.12 ? t/0.12 : Math.max(0, 1 - Math.pow((t-0.12)/0.88, 1.4));
      }
      frames.push({
        transform: 'translate('+(x+vx-size/2)+'px,'+(y+vy-size/2)+'px) rotate('+rot+'deg) scale('+Math.max(0.05,scale).toFixed(3)+')',
        opacity: Math.max(0, Math.min(1, opacity)).toFixed(3),
        offset: t
      });
    }
    return frames;
  }

  function spawnAt(x, y, force){
    var now = performance.now();
    if(!force && now - lastSpawn < minInterval) return;
    lastSpawn = now;

    var shape = pick(shapes);
    var color = pick(shape.colors);

    var el = document.createElement('div');
    el.className = 'ct-particle';
    el.textContent = shape.glyph;

    var size = shape.type === 'sparkle' ? rand(7,13) : rand(12,20);
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.filter = 'drop-shadow(0 0 '+(size*0.7)+'px '+color+')';

    var offX = rand(-3,3);
    var offY = rand(-3,3);
    document.body.appendChild(el);

    var frames = buildWaveKeyframes(x+offX, y+offY, size, shape.type);
    var dur = shape.type === 'sparkle' ? rand(650,950) : rand(1300,1900);

    var anim = el.animate(frames, { duration: dur, easing: 'linear' });
    anim.onfinish = function(){ el.remove(); };
  }

  var lastX = null, lastY = null;
  var lastMoveTime = performance.now();
  var idleTimer = null;

  function scheduleIdle(x, y){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(x !== null) spawnAt(x, y, true);
      scheduleIdle(x, y);
    }, 2200 + rand(0,900));
  }

  function handlePointer(x, y){
    var now = performance.now();
    if(lastX !== null){
      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var dt = Math.max(8, now - lastMoveTime);
      var speed = dist / dt; // px per ms

      // faster movement -> denser trail (more interpolated steps), capped for performance
      var baseSteps = Math.max(1, Math.floor(dist / 20));
      var speedBoost = speed > 1.2 ? 2 : (speed > 0.6 ? 1 : 0);
      var steps = Math.min(isSmallScreen ? 4 : 7, baseSteps + speedBoost);

      for(var i=1;i<=steps;i++){
        var t = i/steps;
        spawnAt(lastX + dx*t, lastY + dy*t);
      }
    } else {
      spawnAt(x,y,true);
    }
    lastX = x; lastY = y;
    lastMoveTime = now;
    scheduleIdle(x, y);
  }

  window.addEventListener('mousemove', function(e){
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchstart', function(e){
    if(e.touches && e.touches[0]){
      spawnAt(e.touches[0].clientX, e.touches[0].clientY, true);
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      scheduleIdle(lastX, lastY);
    }
  }, {passive:true});

  window.addEventListener('click', function(e){
    var count = isSmallScreen ? 5 : 8;
    for(var i=0;i<count;i++){
      (function(i){
        var angle = (i/count) * Math.PI * 2;
        var dist = rand(6,26);
        setTimeout(function(){
          spawnAt(e.clientX + Math.cos(angle)*dist, e.clientY + Math.sin(angle)*dist, true);
        }, i*22);
      })(i);
    }
  });
})();
</script>
