<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>For You 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #050508;
  overflow: hidden;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* ========== BACKGROUND LAYERS ========== */
#bg-canvas {
  position: fixed; inset: 0; z-index: 0;
}

/* Colour wash — transitions per quote */
.colour-wash {
  position: fixed; inset: 0; z-index: 1;
  transition: background 2s ease, opacity 1.5s ease;
  opacity: 0.55;
}

/* ========== MAIN LAYOUT ========== */
.stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
}

/* ========== QUOTE CARD — glassmorphism ========== */
.quote-card {
  position: relative;
  width: min(520px, 94vw);
  min-height: 340px;
  padding: 72px 52px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 28px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 30px 80px rgba(0,0,0,0.6),
    0 0 60px var(--card-glow, rgba(255,182,193,0.06));
  text-align: center;
  transition: box-shadow 1.5s ease;
  overflow: hidden;
}

/* shimmer line across top of card */
.card-shimmer {
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  animation: shimmerSlide 3s ease-in-out infinite;
}
@keyframes shimmerSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ========== QUOTE TEXT SLOTS ========== */
.quote-slot {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 72px 52px;
  min-height: 340px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.05s;
}
.quote-slot.visible { opacity: 1; pointer-events: all; }

.sorry-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 12px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.quote-slot.visible .sorry-label {
  opacity: 1; transform: translateY(0);
  transition-delay: 0.3s;
}

.quote-word {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2.6rem, 11vw, 4.2rem);
  letter-spacing: 8px;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 0 40px var(--word-glow, rgba(255,255,255,0.5));
  opacity: 0;
  transform: translateY(22px) rotateX(12deg);
  filter: blur(8px);
  transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1),
              transform 0.8s cubic-bezier(0.16,1,0.3,1),
              filter 0.8s ease;
}
.quote-slot.visible .quote-word {
  opacity: 1; transform: translateY(0) rotateX(0); filter: blur(0);
  transition-delay: 0.15s;
}

/* special styling for final quote */
.quote-slot.final .quote-word {
  font-size: clamp(1.8rem, 7vw, 3rem);
  letter-spacing: 3px;
  line-height: 1.35;
}
.quote-slot.final .quote-word span {
  display: block;
  background: linear-gradient(135deg, #ffb6c1, #fff, #c084fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  font-style: italic; font-weight: 600;
  font-size: 1.4em;
  margin-top: 6px;
}

.quote-icon {
  margin-top: 18px;
  font-size: 2.4rem;
  opacity: 0; transform: scale(0.6);
  transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
.quote-slot.visible .quote-icon {
  opacity: 1; transform: scale(1);
  transition-delay: 0.5s;
}

/* ========== PROGRESS BAR ========== */
.progress-bar-wrap {
  width: min(520px, 94vw);
  margin-top: 22px;
  height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ffb6c1, #c084fc);
  border-radius: 2px;
  transition: width 0.1s linear;
}

/* ========== TAP TO BEGIN overlay ========== */
.tap-overlay {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(5,5,8,0.92);
  cursor: pointer;
  transition: opacity 0.8s ease;
}
.tap-overlay.hidden { opacity: 0; pointer-events: none; }

.tap-heart {
  font-size: 3.5rem;
  animation: tapHeartBeat 1.5s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(255,107,157,0.6));
  margin-bottom: 16px;
}
@keyframes tapHeartBeat {
  0%,100% { transform: scale(1); }
  14% { transform: scale(1.18); }
  28% { transform: scale(1); }
  42% { transform: scale(1.1); }
  70% { transform: scale(1); }
}
.tap-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.1rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
}

/* ========== HEART CLICK INTERACTION ========== */
.heart-btn {
  position: fixed;
  bottom: 44px; left: 50%; transform: translateX(-50%);
  z-index: 20;
  background: none; border: none; cursor: pointer;
  font-size: 2.4rem;
  filter: drop-shadow(0 0 10px rgba(255,107,157,0.4));
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s ease;
  user-select: none;
  opacity: 0;
  transition: opacity 1s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s ease;
}
.heart-btn.show { opacity: 1; }
.continue-btn-lq {
  position: fixed;
  bottom: 112px; left: 50%; transform: translateX(-50%);
  z-index: 20;
  font-family: inherit;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.75rem;
  padding: 12px 30px;
  border-radius: 50px;
  border: 1px solid rgba(255,182,193,0.55);
  background: rgba(255,182,193,0.12);
  color: #ffe0e6;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}
.continue-btn-lq.show { opacity: 1; pointer-events: auto; }
.continue-btn-lq:active { transform: translateX(-50%) scale(0.96); }
.heart-btn:active { transform: translateX(-50%) scale(1.4); filter: drop-shadow(0 0 20px rgba(255,107,157,0.8)); }

/* Floating heart particle */
.float-heart {
  position: fixed;
  pointer-events: none;
  z-index: 30;
  font-size: 1.4rem;
  animation: floatUp 1.8s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-160px) scale(0.5); }
}

/* ========== CANVAS PARTICLE LAYER ========== */
#fx-canvas {
  position: fixed; inset: 0; z-index: 3; pointer-events: none;
}
</style>
</head>
<body>

<!-- Tap to begin -->
<div class="tap-overlay" id="tapOverlay" onclick="begin()">
  <div class="tap-heart">💕</div>
  <div class="tap-text">tap to open something special</div>
</div>

<!-- Background canvas (stars/particles per quote) -->
<canvas id="bg-canvas"></canvas>
<!-- FX canvas (effect particles on top of card) -->
<canvas id="fx-canvas"></canvas>
<!-- Colour wash layer -->
<div class="colour-wash" id="colourWash"></div>

<!-- Main stage -->
<div class="stage">
  <div class="quote-card" id="quoteCard">
    <div class="card-shimmer"></div>

    <!-- SLOT 0: SORRY STARS -->
    <div class="quote-slot" id="slot0">
      <div class="sorry-label">a confession</div>
      <div class="quote-word" style="--word-glow: rgba(180,210,255,0.6)">SORRY STARS</div>
      <div class="quote-icon">⭐</div>
    </div>

    <!-- SLOT 1: SORRY SUN -->
    <div class="quote-slot" id="slot1">
      <div class="sorry-label">a confession</div>
      <div class="quote-word" style="--word-glow: rgba(255,220,120,0.6)">SORRY SUN</div>
      <div class="quote-icon">☀️</div>
    </div>

    <!-- SLOT 2: SORRY MOON -->
    <div class="quote-slot" id="slot2">
      <div class="sorry-label">a confession</div>
      <div class="quote-word" style="--word-glow: rgba(200,180,255,0.6)">SORRY MOON</div>
      <div class="quote-icon">🌙</div>
    </div>

    <!-- SLOT 3: FINAL -->
    <div class="quote-slot final" id="slot3">
      <div class="sorry-label">because...</div>
      <div class="quote-word" style="--word-glow: rgba(255,182,193,0.8)">
        Her eyes are<br><span>more beautiful</span>
      </div>
      <div class="quote-icon">💕</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
</div>

<!-- Heart interaction button -->
<button class="heart-btn" id="heartBtn" onclick="burstHeart(event)">🤍</button>
<button class="continue-btn-lq" id="continueBtnLQ" onclick="window.location.href='hearts.html'">Continue →</button>

<script>
/* ===================================================
   TIMING MAP  — total song: 27.4s
   Slot 0 (STARS):  0.0s – 6.5s    (6.5s)
   Slot 1 (SUN):    6.5s – 13.0s   (6.5s)
   Slot 2 (MOON):   13.0s – 19.0s  (6.0s)
   Slot 3 (FINAL):  19.0s – 27.4s  (holds until end)
=================================================== */

const SONG_DURATION = 27.4;
const SLOTS = [
  { id: 'slot0', start: 0,    end: 6.5,  theme: 'stars' },
  { id: 'slot1', start: 6.5,  end: 13.0, theme: 'sun'   },
  { id: 'slot2', start: 13.0, end: 19.0, theme: 'moon'  },
  { id: 'slot3', start: 19.0, end: 27.4, theme: 'final' },
];

const THEMES = {
  stars: {
    wash: 'radial-gradient(ellipse at 50% 30%, #0a0a2a 0%, #050508 70%)',
    glow: 'rgba(150,180,255,0.12)',
    particleFn: spawnStars,
  },
  sun: {
    wash: 'radial-gradient(ellipse at 50% 60%, #2a1500 0%, #050508 70%)',
    glow: 'rgba(255,210,100,0.12)',
    particleFn: spawnSunRays,
  },
  moon: {
    wash: 'radial-gradient(ellipse at 50% 20%, #0d0a2a 0%, #050508 70%)',
    glow: 'rgba(180,160,255,0.12)',
    particleFn: spawnMoon,
  },
  final: {
    wash: 'radial-gradient(ellipse at 50% 50%, #1a0010 0%, #050508 70%)',
    glow: 'rgba(255,100,150,0.18)',
    particleFn: spawnHearts,
  },
};

/* ===================================================
   CANVAS SETUP
=================================================== */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');

function resizeCanvases() {
  bgCanvas.width = fxCanvas.width = window.innerWidth;
  bgCanvas.height = fxCanvas.height = window.innerHeight;
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

/* ===================================================
   BG PARTICLE SYSTEM
=================================================== */
let bgParticles = [];
let currentTheme = null;
let spawnTimer = null;

// --- STARS ---
function spawnStars() {
  for (let i = 0; i < 3; i++) {
    bgParticles.push({
      type: 'star',
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      r: Math.random() * 1.5 + 0.4,
      alpha: Math.random() * 0.7 + 0.2,
      twinkleSpeed: Math.random() * 0.04 + 0.01,
      twinklePhase: Math.random() * Math.PI * 2,
      life: 1,
    });
  }
}

// --- SUN RAYS ---
function spawnSunRays() {
  const cx = bgCanvas.width / 2;
  const cy = bgCanvas.height * 0.75;
  bgParticles.push({
    type: 'ray',
    cx, cy,
    angle: Math.random() * Math.PI * 2,
    length: Math.random() * 200 + 80,
    alpha: 0,
    maxAlpha: Math.random() * 0.08 + 0.03,
    speed: Math.random() * 0.3 + 0.1,
    life: 1,
  });
  // also a warm floating mote
  bgParticles.push({
    type: 'mote',
    x: Math.random() * bgCanvas.width,
    y: bgCanvas.height + 10,
    vy: -(Math.random() * 0.6 + 0.3),
    vx: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 2.5 + 1,
    color: `rgba(255, ${180 + Math.floor(Math.random()*60)}, 80,`,
    alpha: 0, maxAlpha: Math.random() * 0.5 + 0.2,
    life: 1,
  });
}

// --- MOON ---
function spawnMoon() {
  // silver sparkles drifting down
  bgParticles.push({
    type: 'moonglint',
    x: Math.random() * bgCanvas.width,
    y: -10,
    vy: Math.random() * 0.5 + 0.2,
    vx: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.8 + 0.5,
    alpha: Math.random() * 0.6 + 0.2,
    life: 1,
    wobble: Math.random() * Math.PI * 2,
  });
}

// --- FINAL: HEARTS ---
function spawnHearts() {
  bgParticles.push({
    type: 'bgheart',
    x: Math.random() * bgCanvas.width,
    y: bgCanvas.height + 20,
    size: Math.random() * 16 + 8,
    speed: Math.random() * 0.7 + 0.3,
    alpha: Math.random() * 0.22 + 0.06,
    wobble: Math.random() * Math.PI * 2,
    ws: Math.random() * 0.02 + 0.008,
    drift: (Math.random() - 0.5) * 0.5,
    hue: 330 + Math.random() * 30,
  });
}

function drawHeartPath(c, cx, cy, s) {
  c.beginPath();
  c.moveTo(cx, cy + s * 0.3);
  c.bezierCurveTo(cx, cy, cx - s*0.5, cy, cx - s*0.5, cy - s*0.3);
  c.bezierCurveTo(cx - s*0.5, cy - s*0.7, cx, cy - s*0.7, cx, cy - s*0.3);
  c.bezierCurveTo(cx, cy - s*0.7, cx + s*0.5, cy - s*0.7, cx + s*0.5, cy - s*0.3);
  c.bezierCurveTo(cx + s*0.5, cy, cx, cy, cx, cy + s*0.3);
  c.closePath();
}

function animateBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

  bgParticles.forEach(p => {
    bgCtx.save();
    if (p.type === 'star') {
      p.twinklePhase += p.twinkleSpeed;
      const a = p.alpha * (0.6 + Math.sin(p.twinklePhase) * 0.4);
      bgCtx.globalAlpha = a;
      bgCtx.fillStyle = '#c8d8ff';
      bgCtx.shadowColor = '#aac0ff';
      bgCtx.shadowBlur = 6;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      bgCtx.fill();
    } else if (p.type === 'ray') {
      if (p.alpha < p.maxAlpha) p.alpha += 0.002;
      else p.alpha -= 0.001;
      if (p.alpha <= 0) p.life = 0;
      p.angle += p.speed * 0.005;
      bgCtx.globalAlpha = p.alpha;
      bgCtx.strokeStyle = `rgba(255,200,80,0.8)`;
      bgCtx.lineWidth = 1.5;
      bgCtx.shadowColor = 'rgba(255,200,80,0.6)';
      bgCtx.shadowBlur = 10;
      bgCtx.beginPath();
      bgCtx.moveTo(p.cx, p.cy);
      bgCtx.lineTo(p.cx + Math.cos(p.angle) * p.length, p.cy + Math.sin(p.angle) * p.length);
      bgCtx.stroke();
    } else if (p.type === 'mote') {
      p.y += p.vy; p.x += p.vx;
      if (p.alpha < p.maxAlpha) p.alpha += 0.015;
      if (p.y < bgCanvas.height * 0.1) p.alpha -= 0.015;
      if (p.alpha <= 0) p.life = 0;
      bgCtx.globalAlpha = Math.max(0, p.alpha);
      bgCtx.fillStyle = p.color + p.alpha + ')';
      bgCtx.shadowColor = 'rgba(255,200,80,0.5)';
      bgCtx.shadowBlur = 8;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      bgCtx.fill();
    } else if (p.type === 'moonglint') {
      p.y += p.vy; p.x += p.vx;
      p.wobble += 0.03;
      p.x += Math.sin(p.wobble) * 0.3;
      if (p.y > bgCanvas.height + 10) p.life = 0;
      bgCtx.globalAlpha = p.alpha;
      bgCtx.fillStyle = '#e8e0ff';
      bgCtx.shadowColor = '#c8b8ff';
      bgCtx.shadowBlur = 8;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      bgCtx.fill();
    } else if (p.type === 'bgheart') {
      p.wobble += p.ws; p.y -= p.speed; p.x += Math.sin(p.wobble) * p.drift;
      if (p.y < -30) p.life = 0;
      bgCtx.globalAlpha = p.alpha;
      bgCtx.fillStyle = `hsl(${p.hue}, 85%, 75%)`;
      bgCtx.translate(p.x, p.y);
      bgCtx.rotate(Math.sin(p.wobble) * 0.12);
      drawHeartPath(bgCtx, 0, 0, p.size);
      bgCtx.fill();
    }
    bgCtx.restore();
  });

  bgParticles = bgParticles.filter(p => p.life > 0);
  requestAnimationFrame(animateBg);
}
animateBg();

/* ===================================================
   THEME SWITCHER
=================================================== */
let currentSlotIndex = -1;

function switchTheme(theme) {
  const t = THEMES[theme];
  if (!t) return;
  document.getElementById('colourWash').style.background = t.wash;
  document.getElementById('quoteCard').style.setProperty('--card-glow', t.glow);
  clearInterval(spawnTimer);
  bgParticles = [];
  const spawnRate = theme === 'stars' ? 200 :
                    theme === 'sun' ? 120 :
                    theme === 'moon' ? 150 : 600;
  spawnTimer = setInterval(t.particleFn, spawnRate);
}

function showSlot(index) {
  if (index === currentSlotIndex) return;
  currentSlotIndex = index;

  // Hide all slots
  document.querySelectorAll('.quote-slot').forEach(s => s.classList.remove('visible'));

  // Show current
  const slot = SLOTS[index];
  setTimeout(() => {
    document.getElementById(slot.id).classList.add('visible');
  }, 100);

  switchTheme(slot.theme);

  // Heart button appears when final quote shows
  if (index === 3) {
    setTimeout(() => {
      document.getElementById('heartBtn').classList.add('show');
    }, 800);
    setTimeout(() => {
      document.getElementById('continueBtnLQ').classList.add('show');
    }, 1600);
  }
}

/* ===================================================
   AUDIO + PROGRESS SYNC
=================================================== */
const audio = document.getElementById('loveSong');
let started = false;
let animFrame = null;

function tick() {
  const t = audio.currentTime;
  const pct = Math.min(100, (t / SONG_DURATION) * 100);
  document.getElementById('progressFill').style.width = pct + '%';

  // Which slot should be active?
  for (let i = SLOTS.length - 1; i >= 0; i--) {
    if (t >= SLOTS[i].start) {
      showSlot(i);
      break;
    }
  }

  if (!audio.ended && !audio.paused) {
    animFrame = requestAnimationFrame(tick);
  }
}

/* ===================================================
   TAP TO BEGIN
=================================================== */
function begin() {
  if (started) return;
  started = true;
  document.getElementById('tapOverlay').classList.add('hidden');

  audio.play().then(() => {
    showSlot(0);
    tick();
  }).catch(() => {
    // fallback — start anyway
    showSlot(0);
    setInterval(() => {
      const t = audio.currentTime;
      for (let i = SLOTS.length - 1; i >= 0; i--) {
        if (t >= SLOTS[i].start) { showSlot(i); break; }
      }
      document.getElementById('progressFill').style.width = Math.min(100, (t / SONG_DURATION) * 100) + '%';
    }, 300);
  });
}

audio.addEventListener('ended', () => {
  cancelAnimationFrame(animFrame);
  // Keep final slot visible, add looping hearts
});

/* ===================================================
   HEART BURST INTERACTION
=================================================== */
let heartLoved = false;
function burstHeart(e) {
  const btn = document.getElementById('heartBtn');
  if (!heartLoved) {
    heartLoved = true;
    btn.textContent = '❤️';
    btn.style.filter = 'drop-shadow(0 0 18px rgba(255,50,80,0.8))';
  }

  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = ['💕','💖','💗','❤️'][Math.floor(Math.random()*4)];
      const rect = btn.getBoundingClientRect();
      h.style.left = (rect.left + (Math.random() - 0.5) * 60) + 'px';
      h.style.top = (rect.top - 10) + 'px';
      h.style.fontSize = (Math.random() * 12 + 14) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1900);
    }, i * 60);
  }
}

// Allow retap to replay
document.addEventListener('keydown', e => { if (e.key === ' ') begin(); });
</script>
