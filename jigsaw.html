<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Fit Together 🧩</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;background:radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%);color:white;font-family:'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;}
  #sf{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;background:white;border-radius:50%;animation:tw ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:0.1;}50%{opacity:0.8;}}

  .scene{z-index:10;text-align:center;max-width:440px;width:100%;}
  .tag{display:inline-block;background:rgba(255,182,193,0.12);border:1px solid rgba(255,182,193,0.25);color:#ffb6c1;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:14px;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(28px,7vw,40px);margin-bottom:6px;}
  .sub{font-size:13px;opacity:0.4;margin-bottom:30px;}

  /* Puzzle board */
  .puzzle-wrap{position:relative;margin:0 auto 24px;}
  canvas{border-radius:16px;display:block;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}

  .hint{font-size:12px;opacity:0.3;margin-bottom:20px;letter-spacing:1px;}

  .success-msg{opacity:0;pointer-events:none;transition:opacity 0.8s;margin-top:4px;}
  .success-msg.active{opacity:1;pointer-events:all;}
  .btn-next{background:linear-gradient(135deg,#ff4d85,#ff8fa8);color:white;border:none;padding:18px 44px;border-radius:30px;font-size:18px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 12px 30px rgba(255,77,133,0.4);transition:transform 0.2s;}
  .btn-next:hover{transform:scale(1.05);}

  .back-to-path { position: fixed; top: 18px; left: 18px; z-index: 999; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: rgba(255,255,255,0.65); text-decoration: none; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; padding: 9px 16px 9px 12px; border-radius: 30px; transition: all 0.2s; letter-spacing: 0.3px; }
  .back-to-path:hover { background: rgba(255,255,255,0.14); color: #fff; transform: translateX(-2px); }
  .back-to-path svg { width: 14px; height: 14px; flex-shrink:0; }
  @media (max-width: 480px) { .back-to-path { top: 12px; left: 12px; font-size: 11px; padding: 7px 13px 7px 10px; } }
</style>
</head>
<body>
<a href="lock.html" class="back-to-path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Path</a>

<div id="sf"></div>
<div class="scene">
  <div class="tag">🧩 Final Puzzle</div>
  <h1>We Fit Together</h1>
  <p class="sub">Drag the pieces — put us together one last time</p>
  <div class="puzzle-wrap"><canvas id="puzzle"></canvas></div>
  <div class="hint" id="hintText">drag pieces to the correct position</div>
  <div class="success-msg" id="successMsg">
    <div style="font-size:50px;margin-bottom:14px;">🎊</div>
    <p style="font-family:'Playfair Display',serif;font-size:20px;color:#ffb6c1;margin-bottom:8px;">A perfect picture.</p>
    <p style="opacity:0.5;font-size:14px;margin-bottom:24px;">You always knew where you belonged. With me. ❤️</p>
    <button class="btn-next" onclick="sessionStorage.setItem('polaroidsNext','tangled_love.html'); window.location.href='polaroids.html'">See Our Memories →</button>
  </div>
</div>

<script>
  const sf=document.getElementById('sf');
  for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+0.5;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;sf.appendChild(s);}

  const cvs=document.getElementById('puzzle');
  const ctx=cvs.getContext('2d');
  const SIZE=Math.min(window.innerWidth-40,320);
  cvs.width=SIZE; cvs.height=SIZE;
  const COLS=3, ROWS=3;
  const PW=SIZE/COLS, PH=SIZE/ROWS;

  // Draw the "image" — a heart made of colors
  function drawSource(c){
    const sc=document.createElement('canvas');sc.width=SIZE;sc.height=SIZE;
    const sx=sc.getContext('2d');
    // Background gradient
    const g=sx.createRadialGradient(SIZE/2,SIZE/2,0,SIZE/2,SIZE/2,SIZE/2);
    g.addColorStop(0,'#2a0845');g.addColorStop(1,'#0a0010');
    sx.fillStyle=g;sx.fillRect(0,0,SIZE,SIZE);
    // Big heart
    sx.save();sx.translate(SIZE/2,SIZE/2);
    const hs=SIZE*0.35;
    sx.beginPath();
    for(let t=0;t<Math.PI*2;t+=0.01){
      const x=hs*(16*Math.pow(Math.sin(t),3))/16;
      const y=-hs*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16;
      t===0?sx.moveTo(x,y):sx.lineTo(x,y);
    }
    const hg=sx.createRadialGradient(0,0,0,0,0,hs);
    hg.addColorStop(0,'#ff8fa8');hg.addColorStop(1,'#ff4d85');
    sx.fillStyle=hg;sx.fill();
    // Text inside heart
    sx.fillStyle='white';sx.font=`bold ${SIZE*0.06}px Nunito`;sx.textAlign='center';
    sx.fillText('I Love You',0,SIZE*0.04);
    sx.fillText('Anusha',0,SIZE*0.13);
    sx.restore();
    // Stars
    for(let i=0;i<30;i++){sx.beginPath();sx.arc(Math.random()*SIZE,Math.random()*SIZE,Math.random()*1.5+0.5,0,Math.PI*2);sx.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.5)+')';sx.fill();}
    return sc;
  }

  const source=drawSource();

  // Create pieces
  const pieces=[];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      pieces.push({
        id:r*COLS+c,
        targetX:c*PW, targetY:r*PH,
        x: 30+Math.random()*(SIZE-PW-60),
        y: 30+Math.random()*(SIZE-PH-60),
        col:c, row:r,
        placed:false
      });
    }
  }
  // Shuffle — make sure they don't start in place
  pieces.forEach(p=>{ if(Math.abs(p.x-p.targetX)<20&&Math.abs(p.y-p.targetY)<20) p.x+=50; });

  let dragging=null, offX=0, offY=0;

  function draw(){
    ctx.clearRect(0,0,SIZE,SIZE);
    // Draw placed pieces first (bottom layer)
    pieces.filter(p=>p.placed).forEach(drawPiece);
    // Guide grid
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*PH);ctx.lineTo(SIZE,r*PH);ctx.stroke();}
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*PW,0);ctx.lineTo(c*PW,SIZE);ctx.stroke();}
    // Unplaced pieces
    pieces.filter(p=>!p.placed&&p!==dragging).forEach(drawPiece);
    if(dragging) drawPiece(dragging);
    requestAnimationFrame(draw);
  }

  function drawPiece(p){
    ctx.save();
    ctx.beginPath();
    ctx.rect(p.x,p.y,PW,PH);
    ctx.clip();
    ctx.drawImage(source,p.col*PW,p.row*PH,PW,PH,p.x,p.y,PW,PH);
    if(!p.placed){
      ctx.strokeStyle='rgba(255,77,133,0.5)';ctx.lineWidth=2;
      ctx.strokeRect(p.x,p.y,PW,PH);
    }
    if(p===dragging){ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(p.x,p.y,PW,PH);}
    ctx.restore();
  }

  function getPos(e){const r=cvs.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(SIZE/r.width),y:(src.clientY-r.top)*(SIZE/r.height)};}

  function startDrag(e){
    if(e.cancelable)e.preventDefault();
    const {x,y}=getPos(e);
    // pick topmost unplaced piece
    for(let i=pieces.length-1;i>=0;i--){
      const p=pieces[i];
      if(!p.placed&&x>=p.x&&x<=p.x+PW&&y>=p.y&&y<=p.y+PH){
        dragging=p;offX=x-p.x;offY=y-p.y;
        pieces.splice(i,1);pieces.push(p);
        break;
      }
    }
  }

  function moveDrag(e){
    if(!dragging)return;if(e.cancelable)e.preventDefault();
    const {x,y}=getPos(e);
    dragging.x=Math.max(0,Math.min(SIZE-PW,x-offX));
    dragging.y=Math.max(0,Math.min(SIZE-PH,y-offY));
  }

  function endDrag(){
    if(!dragging)return;
    // Snap if close
    if(Math.abs(dragging.x-dragging.targetX)<30&&Math.abs(dragging.y-dragging.targetY)<30){
      dragging.x=dragging.targetX; dragging.y=dragging.targetY; dragging.placed=true;
      checkWin();
    }
    dragging=null;
  }

  function checkWin(){
    if(pieces.every(p=>p.placed)){
      document.getElementById('hintText').style.opacity='0';
      setTimeout(()=>document.getElementById('successMsg').classList.add('active'),600);
    }
  }

  cvs.addEventListener('mousedown',startDrag);
  window.addEventListener('mousemove',moveDrag);
  window.addEventListener('mouseup',endDrag);
  cvs.addEventListener('touchstart',startDrag,{passive:false});
  window.addEventListener('touchmove',moveDrag,{passive:false});
  window.addEventListener('touchend',endDrag);

  draw();
</script>
