<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? 💍</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    color: white;
    font-family: 'Nunito', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
  }

  #starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.1;} 50%{opacity:0.9;} }

  .proposal-card {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 32px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 40px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    z-index: 10;
    position: relative;
  }

  /* Scratch area */
  .scratch-container {
    position: relative;
    width: 100%;
    height: 210px;
    margin: 0 auto 28px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .hidden-proposal {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2a0845, #6441A5);
    padding: 20px;
  }

  .hidden-proposal .ring-emoji {
    font-size: 52px;
    margin-bottom: 12px;
    animation: ringFloat 3s ease-in-out infinite;
  }
  @keyframes ringFloat {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-8px) rotate(5deg); }
  }

  .hidden-proposal h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    margin-bottom: 8px;
    color: #fff;
  }

  .hidden-proposal p {
    font-size: 15px;
    opacity: 0.8;
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: #ffb6c1;
  }

  canvas {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: crosshair;
    transition: opacity 0.9s ease;
    touch-action: none;
  }

  .fade-out { opacity: 0; pointer-events: none !important; }

  /* Scratch hint */
  .scratch-hint {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.3;
    margin-bottom: 20px;
    transition: opacity 0.5s;
  }

  /* Progress bar under scratch */
  .scratch-progress {
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .scratch-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff4d85, #ff8fa8);
    border-radius: 10px;
    transition: width 0.2s;
  }

  /* Answer buttons */
  .answer-btns {
    display: flex;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    margin-bottom: 0;
  }

  .btn {
    padding: 16px 34px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: none;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff4d85, #ff8fa8);
    color: white;
    box-shadow: 0 12px 30px rgba(255,77,133,0.4);
  }
  .btn-yes:hover { transform: scale(1.06) translateY(-3px); box-shadow: 0 18px 40px rgba(255,77,133,0.55); }

  .btn-no {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Final message */
  .final-msg { display: none; }
  .final-msg.active {
    display: block;
    animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popIn {
    0%   { transform: scale(0.7); opacity: 0; }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  .final-msg .ring-big { font-size: 72px; display: block; margin-bottom: 16px; animation: ringFloat 3s ease-in-out infinite; }

  .final-msg h2 {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: #ffb6c1;
    margin-bottom: 10px;
  }

  .final-msg .handwritten {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    opacity: 0.8;
    line-height: 1.5;
    margin-bottom: 24px;
    color: #ffe4ec;
  }

  /* Confetti */
  .fw-piece {
    position: fixed;
    top: -60px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 200;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(540deg) scale(0.5); }
  }
</style>
</head>

<div class="proposal-card">
  <div id="mainContent">
    <div class="scratch-hint" id="scratchHint">✦ scratch away the frost ✦</div>

    <div class="scratch-container" id="scratchCont">
      <div class="hidden-proposal">
        <div class="ring-emoji">💍</div>
        <h1>Will you be mine?</h1>
        <p>Anusha... I love you. ❤️</p>
      </div>
      <canvas id="scratchPad" width="440" height="210"></canvas>
    </div>

    <div class="scratch-progress"><div class="scratch-bar" id="scratchBar"></div></div>

    <div class="answer-btns" id="actionBtns">
      <button class="btn btn-yes" onclick="sayYes()">Yes! ❤️</button>
      <button class="btn btn-no" id="noBtn" onmouseover="runAway()" ontouchstart="runAway()">Maybe... 😅</button>
    </div>
  </div>

  <div class="final-msg" id="finalMsg">
    <span class="ring-big">💍</span>
    <h2>She Said Yes! 🎉</h2>
    <div class="handwritten">
      You just made me the happiest person<br>in the entire universe. I love you. 💖
    </div>
  </div>
</div>

<script>
  // Starfield
  const sf = document.getElementById('starfield');
  for(let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2+0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
    sf.appendChild(s);
  }

  const cvs = document.getElementById('scratchPad');
  const ctx = cvs.getContext('2d');
  let isDrag = false, revealed = false;

  // Paint the scratch layer
  let g = ctx.createLinearGradient(0,0,440,210);
  g.addColorStop(0, '#6c3a9b');
  g.addColorStop(0.5, '#a855d4');
  g.addColorStop(1, '#6c3a9b');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,440,210);

  // Frost texture dots
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for(let i=0;i<200;i++) {
    ctx.beginPath();
    ctx.arc(Math.random()*440, Math.random()*210, Math.random()*3+1, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 15px Nunito';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '3px';
  ctx.fillText('✦  wipe away the frost  ✦', 220, 115);
  ctx.font = '13px Nunito';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('something is hidden beneath...', 220, 140);

  ctx.globalCompositeOperation = 'destination-out';

  function getPos(e) {
    const r = cvs.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - r.left) * (440 / r.width),
      y: (src.clientY - r.top)  * (210 / r.height)
    };
  }

  function scratch(e) {
    if(!isDrag || revealed) return;
    if(e.cancelable) e.preventDefault();
    const p = getPos(e);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 28, 0, Math.PI*2);
    ctx.fill();
    checkReveal();
  }

  cvs.addEventListener('mousedown',  e => { isDrag=true; scratch(e); });
  cvs.addEventListener('touchstart', e => { isDrag=true; scratch(e); }, { passive: false });
  window.addEventListener('mousemove',  scratch);
  window.addEventListener('touchmove',  scratch, { passive: false });
  window.addEventListener('mouseup',  () => isDrag=false);
  window.addEventListener('touchend', () => isDrag=false);

  function checkReveal() {
    const d = ctx.getImageData(0,0,440,210).data;
    let transparent = 0;
    for(let i=3; i<d.length; i+=4) if(d[i] < 128) transparent++;
    const pct = (transparent / (d.length/4)) * 100;
    document.getElementById('scratchBar').style.width = Math.min(pct * 2.5, 100) + '%';

    if(pct > 42 && !revealed) {
      revealed = true;
      cvs.classList.add('fade-out');
      document.getElementById('scratchHint').style.opacity = '0';
      const btns = document.getElementById('actionBtns');
      btns.style.opacity = '1';
      btns.style.pointerEvents = 'all';
    }
  }

  // No button runaway
  let noCount = 0;
  const noMessages = ['Wait— Yes! ❤️', 'Okay fine, YES 😂', 'You know it\'s yes 💕', 'YESSSS 💖'];

  function runAway() {
    const btn = document.getElementById('noBtn');
    const maxX = 140, maxY = 100;
    btn.style.transform = `translate(${(Math.random()-0.5)*maxX*2}px, ${(Math.random()-0.5)*maxY*2}px)`;
    if(noCount < noMessages.length) {
      btn.textContent = noMessages[noCount++];
    }
  }

  function sayYes() {
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('finalMsg').classList.add('active');
    launchConfetti();
  }

  function launchConfetti() {
    const pieces = ['💖','🎊','✨','💕','🌸','💍','🎉','💗','⭐','🌟'];
    for(let i=0; i<100; i++) {
      const p = document.createElement('span');
      p.className = 'fw-piece';
      p.textContent = pieces[Math.floor(Math.random()*pieces.length)];
      p.style.left = Math.random()*100 + '%';
      p.style.animationDuration = (1.5 + Math.random()*3) + 's';
      p.style.animationDelay    = (Math.random()*2) + 's';
      p.style.fontSize = (14 + Math.random()*22) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }
  }
</script>
<script>
  // Play the song (kept separate from existing scratch-card logic above)
  const bgMusic = document.getElementById('bgMusic');
  function tryPlayMusic() {
    bgMusic.play().catch(()=>{});
  }
  window.addEventListener('load', tryPlayMusic);
  document.addEventListener('pointerdown', tryPlayMusic, { once: true });
  document.addEventListener('touchstart', tryPlayMusic, { once: true });
</script>
</body>
</html>
