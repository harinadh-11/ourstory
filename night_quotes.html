<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💫</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Cormorant Garamond', serif;
}

/* ===== NIGHT SKY CANVAS ===== */
#sky { position:fixed; inset:0; z-index:0; }

/* ===== SCENE SILHOUETTE ===== */
.scene {
  position:fixed; inset:0; z-index:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end;
  padding-bottom:0;
}

/* Grass field at bottom */
.field {
  width:100%; height:38%;
  background: linear-gradient(to top,
    #0a1a06 0%, #0d1f08 30%, #0f2208 55%,
    #0a180a 75%, transparent 100%);
  position:relative;
  flex-shrink:0;
}

/* Two silhouettes sitting in grass */
.silhouettes {
  position:absolute;
  bottom:28%; left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:flex-end;
  gap:18px;
  opacity:0;
  transition:opacity 2s ease;
}
.silhouettes.show { opacity:1; }

/* Girl silhouette — glowing white */
.sil-girl {
  width:55px; height:85px;
  position:relative;
}
.sil-girl svg { width:100%; height:100%; }

/* Boy silhouette — dark */
.sil-boy {
  width:60px; height:90px;
  position:relative;
}
.sil-boy svg { width:100%; height:100%; }

/* ===== CONTINUE BUTTON ===== */
.continue-btn-nq{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  z-index:21;
  font-family:'Cormorant Garamond', serif;letter-spacing:0.1em;text-transform:uppercase;
  font-size:0.75rem;padding:12px 30px;border-radius:50px;
  border:1px solid rgba(200,210,255,0.5);
  background:rgba(200,210,255,0.1);
  color:#eaf0ff;cursor:pointer;
  opacity:0;pointer-events:none;
  transition:opacity 1s ease;
}
.continue-btn-nq.show{opacity:1;pointer-events:auto;}
.continue-btn-nq:active{transform:translateX(-50%) scale(0.96);}

/* ===== QUOTES ===== */
.quote-layer {
  position:fixed; inset:0; z-index:10;
  display:flex; align-items:flex-start;
  justify-content:flex-start;
  padding:22% 8% 0 8%;
  pointer-events:none;
}

.quote-item {
  position:absolute;
  top:18%; left:6%; right:6%;
  text-align:left;
  opacity:0;
  transform:translateY(10px);
  transition:opacity 0.9s ease, transform 0.9s ease;
  pointer-events:none;
}
.quote-item.show {
  opacity:1;
  transform:translateY(0);
}
.quote-item.hide {
  opacity:0;
  transform:translateY(-10px);
}

.quote-text {
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:300;
  font-size:clamp(1.1rem, 4.5vw, 1.6rem);
  color:rgba(255,255,255,0.92);
  line-height:1.5;
  letter-spacing:0.5px;
  text-shadow:
    0 0 20px rgba(255,255,255,0.3),
    0 2px 8px rgba(0,0,0,0.8);
}

/* Special final quote */
.quote-item.final .quote-text {
  font-size:clamp(1.15rem, 4.8vw, 1.65rem);
  color:#fff;
  text-shadow:
    0 0 30px rgba(255,200,220,0.5),
    0 2px 10px rgba(0,0,0,0.9);
}

/* ===== TAP TO START ===== */
.tap-screen {
  position:fixed; inset:0; z-index:100;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer;
  transition:opacity 1.2s ease;
}
.tap-screen.hide {
  opacity:0; pointer-events:none;
}
.tap-icon {
  font-size:3rem;
  margin-bottom:18px;
  animation:tapPulse 2s ease-in-out infinite;
  filter:drop-shadow(0 0 16px rgba(255,150,180,0.6));
}
@keyframes tapPulse {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.15);}
}
.tap-label {
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:1rem;
  color:rgba(255,255,255,0.4);
  letter-spacing:3px;
}

/* ===== MOON GLOW OVERLAY ===== */
.moon-glow {
  position:fixed;
  top:-60px; right:-40px;
  width:220px; height:220px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,240,200,0.12) 0%,
    rgba(255,220,160,0.07) 35%,
    transparent 70%);
  z-index:2;
  pointer-events:none;
  animation:moonGlow 8s ease-in-out infinite alternate;
}
@keyframes moonGlow {
  0%{opacity:0.7; transform:scale(1);}
  100%{opacity:1; transform:scale(1.12);}
}
</style>
</head>

      <div class="sil-girl">
        <svg viewBox="0 0 55 85" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>

          <!-- Body sitting -->
          <ellipse cx="27" cy="72" rx="18" ry="10" fill="rgba(220,230,255,0.9)" filter="url(#glow)"/>
          <!-- Torso -->
          <rect x="17" y="42" width="20" height="32" rx="6" fill="rgba(230,240,255,0.88)" filter="url(#glow)"/>
          <!-- Head -->
          <circle cx="27" cy="32" r="13" fill="rgba(240,245,255,0.95)" filter="url(#glow)"/>
          <!-- Ponytail -->
          <path d="M32 38 Q42 48 38 62" stroke="rgba(220,230,255,0.8)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
          <!-- Glow halo around head -->
          <circle cx="27" cy="32" r="18" fill="rgba(255,255,255,0.06)"/>
          <circle cx="27" cy="32" r="22" fill="rgba(255,255,255,0.03)"/>
        </svg>
      </div>
      <!-- Boy: dark silhouette -->
      <div class="sil-boy">
        <svg viewBox="0 0 60 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Body sitting -->
          <ellipse cx="30" cy="78" rx="20" ry="10" fill="#1a2a14"/>
          <!-- Torso -->
          <rect x="16" y="44" width="28" height="36" rx="6" fill="#1a2a14"/>
          <!-- Head -->
          <circle cx="30" cy="34" r="14" fill="#1c2e16"/>
          <!-- Hoodie/cap suggestion -->
          <path d="M16 44 Q30 25 44 44" fill="#141e10"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- Quotes -->
<div class="quote-layer">
  <div class="quote-item" id="q0">
    <div class="quote-text">Do you regret loving me??</div>
  </div>
  <div class="quote-item" id="q1">
    <div class="quote-text">No never..</div>
  </div>
  <div class="quote-item" id="q2">
    <div class="quote-text">Even after everything??</div>
  </div>
  <div class="quote-item" id="q3">
    <div class="quote-text">Even if love broke me<br>I will choose you in every lifetime</div>
  </div>
  <div class="quote-item final" id="q4">
    <div class="quote-text">Because loving you was<br>the best thing I ever did</div>
  </div>
</div>

<button class="continue-btn-nq" id="continueBtnNQ" onclick="window.location.href='playlist.html'">Continue →</button>

<script>
/* =========================================
   NIGHT SKY — stars, moon, meteors
========================================= */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* Stars */
const STAR_COUNT = 200;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x: Math.random(),
  y: Math.random() * 0.7, // only top 70% — the sky
  r: Math.random() * 1.4 + 0.3,
  baseAlpha: Math.random() * 0.7 + 0.2,
  phase: Math.random() * Math.PI * 2,
  speed: Math.random() * 0.025 + 0.005,
  drift: (Math.random() - 0.5) * 0.00008,
}));

/* Moon */
const moon = {
  x: 0.82, y: 0.09,
  r: 28,
  phase: 0,
};

/* Meteors */
let meteors = [];
function spawnMeteor() {
  meteors.push({
    x: Math.random() * 0.7 + 0.1,
    y: Math.random() * 0.2,
    length: Math.random() * 120 + 80,
    speed: Math.random() * 0.004 + 0.003,
    alpha: 1,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
    progress: 0,
    tail: [],
  });
}

let songStarted = false;
let animTick = 0;
let lastMeteor = 0;

function drawSky() {
  const W = canvas.width, H = canvas.height;

  /* Sky gradient — deep night */
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.72);
  skyGrad.addColorStop(0,    '#010508');
  skyGrad.addColorStop(0.3,  '#050d12');
  skyGrad.addColorStop(0.65, '#081412');
  skyGrad.addColorStop(1,    '#0a1808');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  /* Silhouette of distant treeline */
  ctx.save();
  ctx.fillStyle = '#030b06';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.62);
  // rough tree-line shape
  for (let x = 0; x <= W; x += W / 60) {
    const treeH = (Math.sin(x * 0.08) * 0.5 + Math.sin(x * 0.023) * 0.3 + Math.sin(x*0.005)*0.2) * H * 0.06;
    ctx.lineTo(x, H * 0.62 - Math.abs(treeH));
  }
  ctx.lineTo(W, H * 0.62);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* Stars */
  animTick++;
  stars.forEach(s => {
    s.phase += s.speed;
    s.x += s.drift;
    if (s.x < 0) s.x = 1; if (s.x > 1) s.x = 0;
    const alpha = Math.max(0, s.baseAlpha + Math.sin(s.phase) * 0.35);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#e8eeff';
    ctx.shadowColor = '#c8d8ff';
    ctx.shadowBlur = s.r * 2.5;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  /* Moon */
  moon.phase += 0.005;
  const mx = moon.x * W, my = moon.y * H;
  // outer glow rings
  [60, 45, 35].forEach((gr, i) => {
    const ga = ctx.createRadialGradient(mx, my, 0, mx, my, moon.r + gr);
    ga.addColorStop(0, `rgba(255,240,195,${0.06 - i*0.015})`);
    ga.addColorStop(1, 'transparent');
    ctx.fillStyle = ga;
    ctx.beginPath();
    ctx.arc(mx, my, moon.r + gr, 0, Math.PI * 2);
    ctx.fill();
  });
  // moon disc
  const moonGrad = ctx.createRadialGradient(mx - moon.r*0.25, my - moon.r*0.2, 0, mx, my, moon.r);
  moonGrad.addColorStop(0, '#fff8e8');
  moonGrad.addColorStop(0.5, '#ffe9b8');
  moonGrad.addColorStop(1, '#e8d090');
  ctx.save();
  ctx.shadowColor = 'rgba(255,235,170,0.4)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = moonGrad;
  ctx.beginPath();
  ctx.arc(mx, my, moon.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // moon craters
  [[mx-7, my-4, 5],[mx+6, my+5, 4],[mx-2, my+8, 3]].forEach(([cx,cy,cr]) => {
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#c8a860';
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  /* Meteors */
  if (songStarted && animTick - lastMeteor > 280 + Math.random() * 200) {
    spawnMeteor();
    lastMeteor = animTick;
  }
  meteors = meteors.filter(m => m.progress < 1);
  meteors.forEach(m => {
    m.progress += m.speed;
    const startX = m.x * W;
    const startY = m.y * H;
    const dx = Math.cos(m.angle) * m.length;
    const dy = Math.sin(m.angle) * m.length;
    const curX = startX + dx * m.progress;
    const curY = startY + dy * m.progress;

    ctx.save();
    // Glow head
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 10;
    // Tail gradient
    const grad = ctx.createLinearGradient(
      curX - dx * 0.3, curY - dy * 0.3,
      curX, curY
    );
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${m.alpha * (1 - m.progress)})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(curX - dx * 0.35, curY - dy * 0.35);
    ctx.lineTo(curX, curY);
    ctx.stroke();
    // Bright head dot
    ctx.globalAlpha = m.alpha * (1 - m.progress * 0.8);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(curX, curY, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  requestAnimationFrame(drawSky);
}
drawSky();

/* =========================================
   QUOTE TIMING — synced to 16.6s song
   q0: 3.0s – 6.5s  "Do you regret..."
   q1: 6.5s – 9.0s  "No never.."
   q2: 9.0s – 11.5s "Even after..."
   q3: 11.5s – 13.5s "Even if love broke me..."
   q4: 13.5s – 16.6s "Because loving you..."
========================================= */
const SONG_DURATION = 16.6;
const QUOTE_TIMES = [
  { id:'q0', in:3.0,  out:6.5  },
  { id:'q1', in:6.5,  out:9.0  },
  { id:'q2', in:9.0,  out:11.5 },
  { id:'q3', in:11.5, out:13.5 },
  { id:'q4', in:13.5, out:99   },
];
const audio = document.getElementById('song');
let activeQuote = null;
let rafId = null;

function updateQuotes() {
  const t = audio.currentTime;
  QUOTE_TIMES.forEach(q => {
    const el = document.getElementById(q.id);
    const shouldShow = t >= q.in && t < q.out;
    if (shouldShow && activeQuote !== q.id) {
      if (activeQuote) {
        const prev = document.getElementById(activeQuote);
        prev.classList.remove('show');
        prev.classList.add('hide');
        setTimeout(() => prev.classList.remove('hide'), 900);
      }
      activeQuote = q.id;
      el.classList.add('show');
    } else if (!shouldShow && el.classList.contains('show')) {
      el.classList.remove('show');
    }
  });
  if (t >= 15.0 && !document.getElementById('continueBtnNQ').classList.contains('show')) {
    document.getElementById('continueBtnNQ').classList.add('show');
  }

  if (!audio.ended) rafId = requestAnimationFrame(updateQuotes);
}

/* =========================================
   BEGIN — tap to start
========================================= */
function begin() {
  const tap = document.getElementById('tapScreen');
  tap.classList.add('hide');
  setTimeout(() => { tap.style.display='none'; }, 1300);

  // Show silhouettes
  setTimeout(() => {
    document.getElementById('silhouettes').classList.add('show');
  }, 800);

  // Play audio
  audio.play().then(() => {
    songStarted = true;
    updateQuotes();
  }).catch(() => {
    songStarted = true;
    updateQuotes();
    // fallback poll
    setInterval(() => {
      const t = audio.currentTime;
      QUOTE_TIMES.forEach(q => {
        const el = document.getElementById(q.id);
        if (t >= q.in && t < q.out) el.classList.add('show');
        else el.classList.remove('show');
      });
    }, 200);
  });
}
</script>
</body>
