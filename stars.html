<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Constellation ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    color: white;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    user-select: none;
    overflow: hidden;
    padding: 20px;
  }

  #starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bgstar { position: absolute; background: white; border-radius: 50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.08;} 50%{opacity:0.6;} }

  .header { text-align: center; z-index: 10; margin-bottom: 22px; transition: opacity 0.5s; }
  .hint-tag { display:inline-block; background:rgba(255,182,193,0.12); border:1px solid rgba(255,182,193,0.25); color:#ffb6c1; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:5px 14px; border-radius:20px; margin-bottom:12px; }
  .header h1 { font-family: 'Playfair Display', serif; color: #ffb6c1; font-size: 30px; margin-bottom: 6px; }
  .header p { font-size: 13px; opacity: 0.45; }

  .canvas-container {
    position: relative;
    width: min(340px, 88vw);
    height: min(340px, 88vw);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    z-index: 10;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }

  .progress-track {
    display: flex;
    gap: 6px;
    margin-top: 18px;
    z-index: 10;
  }
  .ptick { width: 22px; height: 4px; background: rgba(255,255,255,0.12); border-radius: 4px; transition: background 0.3s; }
  .ptick.done { background: #ff4d85; }

  .success-msg {
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.6s;
    margin-top: 24px;
    z-index: 10;
  }
  .success-msg.active { opacity: 1; pointer-events: all; }
  .success-msg h2 { font-family: 'Playfair Display', serif; color: #ffb6c1; font-size: 24px; margin-bottom: 8px; }
  .success-msg p { opacity: 0.5; font-size: 14px; margin-bottom: 18px; }

  .btn-next {
    background: linear-gradient(135deg, #ff4d85, #ff8fa8);
    color: white;
    border: none;
    padding: 16px 38px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(255,77,133,0.4);
    transition: transform 0.2s;
  }
  .btn-next:hover { transform: scale(1.05) translateY(-2px); }
</style>
</head>
<body>
<style id="site-polish-style">
  html{scroll-behavior:smooth;}

  #spLoadVeil{
    position:fixed;inset:0;z-index:99997;
    background:inherit;
    pointer-events:none;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:1;
    transition:opacity .9s ease, backdrop-filter .9s ease;
  }
  #spLoadVeil.sp-gone{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);}

  /* NOTE: intentionally not touching opacity/filter of body's children here —
     several pages manage their own .scene visibility via opacity, and doing
     so here would force every scene visible at once. The veil above handles
     the whole "fade in from blur" effect on its own. */

  .sp-glow-hit{
    animation:spGlowPulse .55s ease;
  }
  @keyframes spGlowPulse{
    0%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
    40%{filter:drop-shadow(0 0 14px rgba(255,111,149,.9));}
    100%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
  }

  #spChapterLabel{
    position:fixed;
    top:16px;left:50%;transform:translateX(-50%);
    z-index:99991;
    font-family:'Playfair Display',Georgia,serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
    background:rgba(0,0,0,.22);
    padding:6px 14px;
    border-radius:20px;
    backdrop-filter:blur(3px);
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  #spChapterLabel.sp-show{opacity:.85;}
</style>

<div id="spLoadVeil"></div>
<div id="spChapterLabel"></div>

<script id="site-polish-script">
(function(){
  /* ---------- 1. Load fade-in (blur to sharp) ---------- */
  function revealVeil(){
    var veil = document.getElementById('spLoadVeil');
    if(!veil || veil.classList.contains('sp-gone')) return;
    veil.classList.add('sp-gone');
    setTimeout(function(){ if(veil.parentNode) veil.remove(); }, 1000);
  }
  window.addEventListener('load', function(){
    requestAnimationFrame(function(){ requestAnimationFrame(revealVeil); });
  });
  if(document.readyState === 'complete'){
    revealVeil();
  }

  /* ---------- 2. Hover / tap glow on interactive elements ---------- */
  var interactiveSelector = 'button, a, input, .btn-continue, .btn-next, [onclick], [role="button"]';

  function pulse(el){
    el.classList.remove('sp-glow-hit');
    void el.offsetWidth;
    el.classList.add('sp-glow-hit');
  }

  document.addEventListener('mouseover', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  });
  document.addEventListener('touchstart', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  }, {passive:true});

  /* ---------- 3. Smooth scroll ---------- */
  /* handled via CSS scroll-behavior:smooth above */

  /* ---------- 4. Chapter label (brief, then fades away) ---------- */
  var CHAPTERS = {
    'index.html': 'Chapter 1 · The Beginning',
    'passwordgate.html': 'Chapter 1 · The Beginning',
    'potl-welcome.html': 'Chapter 1 · The Beginning',
    'firsts.html': 'Chapter 2 · Our Firsts',
    'jigsaw.html': 'Chapter 2 · Our Firsts',
    'tangled_love.html': 'Chapter 2 · Our Firsts',
    'stars.html': 'Chapter 3 · Under the Stars',
    'catch.html': 'Chapter 3 · Under the Stars',
    'our_constellation_part1.html': 'Chapter 3 · Under the Stars',
    'our_constellation.html': 'Chapter 3 · Under the Stars',
    'our_memorie_8_.html': 'Chapter 3 · Under the Stars',
    'memorymatch.html': 'Chapter 3 · Under the Stars',
    'night_quotes.html': 'Chapter 4 · Just Us',
    'playlist.html': 'Chapter 4 · Just Us',
    'videos.html': 'Chapter 4 · Just Us',
    'proposal.html': 'Chapter 4 · Just Us',
    'flames_new_fonts.html': 'Chapter 4 · Just Us',
    'potl-securitycheck.html': 'Chapter 4 · Just Us',
    'heart.html': 'Chapter 5 · For You',
    'cards (2).html': 'Chapter 5 · For You',
    'i_love_you.html': 'Chapter 5 · For You',
    'For_Anusha_-_Complete_Journey (2).html': 'Chapter 6 · Forever',
    'swipe.html': 'Chapter 6 · Forever',
    'her-smile-gallery (1).html': 'Chapter 6 · Forever',
    'three_quotes.html': 'Chapter 6 · Forever',
    'ourmoments (2).html': 'Chapter 6 · Forever',
    'love_quotes.html': 'Chapter 6 · Forever',
    'hearts.html': 'Chapter 7 · The Promise',
    'contract.html': 'Chapter 7 · The Promise',
    'proposal_with_song.html': 'Chapter 7 · The Promise'
  };

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var label = CHAPTERS[here];

  if(here === 'polaroids.html'){
    var visits = parseInt(sessionStorage.getItem('spPolaroidsVisits') || '0', 10) + 1;
    sessionStorage.setItem('spPolaroidsVisits', visits);
    label = visits <= 1 ? 'Chapter 2 · Our Firsts' : 'Chapter 7 · The Promise';
  }

  if(label){
    var el = document.getElementById('spChapterLabel');
    el.textContent = label;
    setTimeout(function(){ el.classList.add('sp-show'); }, 1300);
    setTimeout(function(){ el.classList.remove('sp-show'); }, 4200);
  }
})();
</script>

<div class="header" id="headerText">

<div class="canvas-container"><canvas id="starCanvas" width="340" height="340"></canvas></div>
<div class="progress-track" id="progressTrack"></div>

<div class="success-msg" id="successMsg">
  <h2>It was always you. ❤️</h2>
  <p>Every path led back to this moment.</p>
  <button class="btn-next" onclick="goToCatch()">See Our Future →</button>
</div>

<script>
  // Background ambient stars
  const sf = document.getElementById('starfield');
  for(let i=0;i<70;i++){
    const s=document.createElement('div'); s.className='bgstar';
    const sz=Math.random()*2+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
    sf.appendChild(s);
  }

  const cvs = document.getElementById('starCanvas');
  const ctx = cvs.getContext('2d');
  const W = 340, H = 340;

  // Heart-shaped constellation points
  const pts = [
    {x:170, y:100}, {x:230, y:60}, {x:280, y:100}, {x:290, y:160},
    {x:170, y:280}, {x:50, y:160}, {x:60, y:100}, {x:110, y:60}, {x:170, y:100}
  ];

  let tgt = 0;
  let conn = [];
  let pulseR = 0, pGrow = true;

  // Build progress ticks
  const track = document.getElementById('progressTrack');
  pts.forEach((_, i) => {
    if(i === pts.length - 1) return; // last point repeats first
    const t = document.createElement('div');
    t.className = 'ptick';
    t.id = 'tick-' + i;
    track.appendChild(t);
  });

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background sparkle dust
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for(let i=0;i<25;i++) {
      ctx.beginPath();
      ctx.arc((i*37)%W, (i*53)%H, 1, 0, Math.PI*2);
      ctx.fill();
    }

    // Connected lines
    if(conn.length > 0) {
      ctx.beginPath();
      ctx.moveTo(conn[0].x, conn[0].y);
      for(let i=1; i<conn.length; i++) ctx.lineTo(conn[i].x, conn[i].y);
      const grad = ctx.createLinearGradient(0,0,W,H);
      grad.addColorStop(0, 'rgba(255,182,193,0.8)');
      grad.addColorStop(1, 'rgba(255,77,133,0.8)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(255,77,133,0.5)';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Points
    pts.forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI*2);

      if(i < tgt) {
        ctx.fillStyle = '#ffd4dd';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ff8fa8';
        ctx.fill();
      } else if(i === tgt) {
        ctx.fillStyle = '#ffb6c1';
        ctx.shadowBlur = pulseR;
        ctx.shadowColor = '#ff4d85';
        ctx.fill();
        pGrow ? pulseR += 0.6 : pulseR -= 0.6;
        if(pulseR > 22) pGrow = false;
        if(pulseR < 6) pGrow = true;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.shadowBlur = 0;
        ctx.fill();
      }
    });

    ctx.shadowBlur = 0;
    if(tgt < pts.length) requestAnimationFrame(draw);
  }

  function tap(e) {
    if(tgt >= pts.length) return;
    if(e.cancelable) e.preventDefault();
    const r = cvs.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    const x = (src.clientX - r.left) * (W / r.width);
    const y = (src.clientY - r.top)  * (H / r.height);

    if(Math.hypot(pts[tgt].x - x, pts[tgt].y - y) < 32) {
      conn.push(pts[tgt]);

      const tick = document.getElementById('tick-' + Math.min(tgt, pts.length-2));
      if(tick) tick.classList.add('done');

      tgt++;

      if(tgt === pts.length) {
        // Fill the completed heart shape
        setTimeout(() => {
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath();
          const fillGrad = ctx.createRadialGradient(170,170,10,170,170,160);
          fillGrad.addColorStop(0, 'rgba(255,77,133,0.25)');
          fillGrad.addColorStop(1, 'rgba(255,77,133,0.02)');
          ctx.fillStyle = fillGrad;
          ctx.fill();

          document.getElementById('headerText').style.opacity = '0';
          setTimeout(() => document.getElementById('successMsg').classList.add('active'), 500);
        }, 200);
      }
    }
  }

  cvs.addEventListener('mousedown', tap);
  cvs.addEventListener('touchstart', tap, { passive: false });
  draw();
</script>

<script>
  (function(){
    const v = document.getElementById('heartsMusic');
    function tryPlay(){ v.play().catch(()=>{}); }
    window.addEventListener('load', tryPlay);
    function resumeOnce(){
      if (v.paused) v.play().catch(()=>{});
      document.removeEventListener('click', resumeOnce);
      document.removeEventListener('touchstart', resumeOnce);
    }
    document.addEventListener('click', resumeOnce);
    document.addEventListener('touchstart', resumeOnce);
  })();

  function goToCatch(){
    const v = document.getElementById('heartsMusic');
    const startVol = v.volume;
    const steps = 16, durationMs = 700;
    let i = 0;
    const fade = setInterval(() => {
      i++;
      v.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) {
        clearInterval(fade);
        v.pause();
        window.location.href = 'catch.html';
      }
    }, durationMs / steps);
  }
</script>

      {duration:900,easing:'ease-out'});

})();

    ],
    'our_constellation.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'tangled_love.html': [
      { type:'heart', glyph:'♥', colors:['#ff5f8f','#e8547a'] },
      { type:'petal', glyph:'✿', colors:['#ffc3dd','#ffb6d9'] }
    ],
    'contract.html': [
      { type:'sparkle', glyph:'✦', colors:['#e8b978','#d4a95f'] },
      { type:'heart',   glyph:'♥', colors:['#ff8fac'] }
    ]
  };

  var DEFAULT_THEME = [
    { type:'heart',  glyph:'♥', colors:['#ff6f95','#ff8fac','#e8547a','#ffb3c6'] },
    { type:'heart',  glyph:'❤', colors:['#ff5f8f','#ff9ecb'] },
    { type:'petal',  glyph:'✿', colors:['#ffc3dd','#ffd6e6','#f7a8c4'] },
    { type:'petal',  glyph:'❀', colors:['#ffb6d9','#ffe0ef'] },
    { type:'petal',  glyph:'✾', colors:['#ffd6a5','#ffe8c9'] },
    { type:'sparkle',glyph:'✦', colors:['#ffe14d','#ffc36b','#fff3b0'] },
    { type:'sparkle',glyph:'✧', colors:['#c9e8ff','#ffffff'] },
    { type:'sparkle',glyph:'·', colors:['#ffffff','#ffe9f2'] }
  ];

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var shapes = THEMES[here] || DEFAULT_THEME;

  var isSmallScreen = window.innerWidth < 400;
  var minInterval = isSmallScreen ? 75 : 50;

  var lastSpawn = 0;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildWaveKeyframes(x, y, size, kind){
    var totalDriftY = kind === 'sparkle' ? rand(-26,-10) : rand(50,95);
    var swayAmp = kind === 'sparkle' ? rand(4,10) : rand(18,34);
    var swayDir = Math.random() < 0.5 ? 1 : -1;
    var totalRot = rand(-50,50) * (kind === 'petal' ? 1.6 : 1);
    var steps = 6;
    var frames = [];

    for(var i=0;i<=steps;i++){
      var t = i/steps;
      var vy = totalDriftY * (t*t*(3-2*t));
      var vx = Math.sin(t*Math.PI*1.3) * swayAmp * swayDir * (kind === 'sparkle' ? 0.4 : 1);
      var rot = totalRot * t;
      var scale, opacity;
      if(kind === 'sparkle'){
        scale = t < 0.3 ? (0.4 + t*2.6) : (1.15 - (t-0.3)*0.6);
        opacity = t < 0.15 ? t/0.15 : (t > 0.7 ? Math.max(0,(1-t)/0.3) : 0.75 + Math.sin(t*22)*0.25);
      } else {
        scale = t < 0.25 ? (0.5 + t*2) : (1 - (t-0.25)*0.35);
        opacity = t < 0.12 ? t/0.12 : Math.max(0, 1 - Math.pow((t-0.12)/0.88, 1.4));
      }
      frames.push({
        transform: 'translate('+(x+vx-size/2)+'px,'+(y+vy-size/2)+'px) rotate('+rot+'deg) scale('+Math.max(0.05,scale).toFixed(3)+')',
        opacity: Math.max(0, Math.min(1, opacity)).toFixed(3),
        offset: t
      });
    }
    return frames;
  }

  function spawnAt(x, y, force){
    var now = performance.now();
    if(!force && now - lastSpawn < minInterval) return;
    lastSpawn = now;

    var shape = pick(shapes);
    var color = pick(shape.colors);

    var el = document.createElement('div');
    el.className = 'ct-particle';
    el.textContent = shape.glyph;

    var size = shape.type === 'sparkle' ? rand(7,13) : rand(12,20);
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.filter = 'drop-shadow(0 0 '+(size*0.7)+'px '+color+')';

    var offX = rand(-3,3);
    var offY = rand(-3,3);
    document.body.appendChild(el);

    var frames = buildWaveKeyframes(x+offX, y+offY, size, shape.type);
    var dur = shape.type === 'sparkle' ? rand(650,950) : rand(1300,1900);

    var anim = el.animate(frames, { duration: dur, easing: 'linear' });
    anim.onfinish = function(){ el.remove(); };
  }

  var lastX = null, lastY = null;
  var lastMoveTime = performance.now();
  var idleTimer = null;

  function scheduleIdle(x, y){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(x !== null) spawnAt(x, y, true);
      scheduleIdle(x, y);
    }, 2200 + rand(0,900));
  }

  function handlePointer(x, y){
    var now = performance.now();
    if(lastX !== null){
      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var dt = Math.max(8, now - lastMoveTime);
      var speed = dist / dt; // px per ms

      // faster movement -> denser trail (more interpolated steps), capped for performance
      var baseSteps = Math.max(1, Math.floor(dist / 20));
      var speedBoost = speed > 1.2 ? 2 : (speed > 0.6 ? 1 : 0);
      var steps = Math.min(isSmallScreen ? 4 : 7, baseSteps + speedBoost);

      for(var i=1;i<=steps;i++){
        var t = i/steps;
        spawnAt(lastX + dx*t, lastY + dy*t);
      }
    } else {
      spawnAt(x,y,true);
    }
    lastX = x; lastY = y;
    lastMoveTime = now;
    scheduleIdle(x, y);
  }

  window.addEventListener('mousemove', function(e){
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchstart', function(e){
    if(e.touches && e.touches[0]){
      spawnAt(e.touches[0].clientX, e.touches[0].clientY, true);
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      scheduleIdle(lastX, lastY);
    }
  }, {passive:true});

  window.addEventListener('click', function(e){
    var count = isSmallScreen ? 5 : 8;
    for(var i=0;i<count;i++){
      (function(i){
        var angle = (i/count) * Math.PI * 2;
        var dist = rand(6,26);
        setTimeout(function(){
          spawnAt(e.clientX + Math.cos(angle)*dist, e.clientY + Math.sin(angle)*dist, true);
        }, i*22);
      })(i);
    }
  });
})();
</script>

</body>
