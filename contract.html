<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms & Conditions 📝</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  body { 
    margin: 0; 
    min-height: 100vh; 
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); 
    color: white; 
    font-family: 'Nunito', sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    padding: 20px;
    box-sizing: border-box;
  }

  /* Twinkling Background Stars */
  .stars-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .stars-bg::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0));
    background-repeat: repeat; background-size: 200px 200px;
    opacity: 0.5; animation: twinkle 4s infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

  /* The Document Container */
  .contract-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 25px;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    z-index: 10;
    position: relative;
  }

  .header {
    text-align: center;
    border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
    padding-bottom: 20px;
    margin-bottom: 30px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    color: #ffb6c1;
    margin: 0 0 10px 0;
    font-size: 28px;
  }

  .header p {
    font-size: 14px;
    opacity: 0.7;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Checkbox List */
  .rule-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px;
  }

  .rule-item {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    cursor: pointer;
    background: rgba(0, 0, 0, 0.2);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }

  .rule-item:hover {
    background: rgba(255, 77, 133, 0.1);
    border-color: rgba(255, 77, 133, 0.3);
  }

  .rule-item.checked {
    background: rgba(77, 255, 136, 0.1);
    border-color: rgba(77, 255, 136, 0.3);
  }

  /* Custom Checkbox */
  .checkbox-wrapper {
    position: relative;
    min-width: 24px;
    height: 24px;
    margin-top: 2px;
  }

  .checkbox-wrapper input {
    opacity: 0;
    position: absolute;
    cursor: pointer;
    height: 0;
    width: 0;
  }

  .checkmark {
    position: absolute;
    top: 0;
    left: 0;
    height: 24px;
    width: 24px;
    background-color: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 6px;
    transition: all 0.2s;
  }

  .rule-item:hover input ~ .checkmark {
    border-color: #ffb6c1;
  }

  .rule-item input:checked ~ .checkmark {
    background-color: #4dff88;
    border-color: #4dff88;
    box-shadow: 0 0 10px rgba(77, 255, 136, 0.5);
  }

  .checkmark:after {
    content: "";
    position: absolute;
    display: none;
    left: 8px;
    top: 4px;
    width: 5px;
    height: 10px;
    border: solid #000;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
  }

  .rule-item input:checked ~ .checkmark:after {
    display: block;
  }

  .rule-text {
    font-size: 16px;
    line-height: 1.4;
    user-select: none;
  }

  /* Footer & Button */
  .footer {
    text-align: center;
  }

  .btn-submit {
    background: linear-gradient(135deg, #555, #777);
    color: rgba(255,255,255,0.5);
    border: none;
    padding: 16px 40px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: not-allowed;
    transition: all 0.4s ease;
    font-family: 'Nunito', sans-serif;
    width: 100%;
  }

  .btn-submit.unlocked {
    background: linear-gradient(135deg, #ff4d85, #ff8fa8);
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(255, 77, 133, 0.4);
  }

  .btn-submit.unlocked:hover {
    transform: scale(1.03);
  }

  .error-toast {
    color: #ff4d4d;
    font-size: 14px;
    margin-top: 15px;
    opacity: 0;
    transition: opacity 0.3s;
    font-weight: bold;
  }

  .error-toast.show {
    opacity: 1;
  }
</style>
</head>

<div class="contract-card">
  <div class="header">
    <h1>Terms & Conditions</h1>
    <p>Mandatory Agreement for Our Future</p>
  </div>

  <div class="rule-list" id="ruleList">
    <!-- Checkbox 1 -->
    <label class="rule-item">
      <div class="checkbox-wrapper">
        <input type="checkbox" class="req-box" onclick="checkUnlock()">
        <span class="checkmark"></span>
      </div>
      <span class="rule-text">pottiiiii agrees to always share her Thums Up and Biryani with me, even if I told her I wasn't hungry when we ordered. 🍗🥤</span>
    </label>

    <!-- Checkbox 2 -->
    <label class="rule-item">
      <div class="checkbox-wrapper">
        <input type="checkbox" class="req-box" onclick="checkUnlock()">
        <span class="checkmark"></span>
      </div>
      <span class="rule-text">pottiiiii promises to never, under any circumstances, watch the next episode of our show without me. 📺</span>
    </label>

    <!-- Checkbox 3 -->
    <label class="rule-item">
      <div class="checkbox-wrapper">
        <input type="checkbox" class="req-box" onclick="checkUnlock()">
        <span class="checkmark"></span>
      </div>
      <span class="rule-text">pottiiiii accepts that her cold feet must be warmed by me in bed during the winter. ❄️</span>
    </label>

    <!-- Checkbox 4 -->
    <label class="rule-item">
      <div class="checkbox-wrapper">
        <input type="checkbox" class="req-box" onclick="checkUnlock()">
        <span class="checkmark"></span>
      </div>
      <span class="rule-text">pottiiiii is fully prepared to laugh at my terrible jokes for the rest of her natural life. 😂</span>
    </label>
  </div>

  <div class="footer">
    <!-- Links to Page 12: Guilty Sliders -->
    <button class="btn-submit" id="submitBtn" onclick="attemptSubmit()">Sign & Accept Contract</button>
    <div class="error-toast" id="errorToast">You must agree to all terms to proceed! ⚖️</div>
  </div>
</div>

<script>
  // Ensure background music plays even if autoplay is initially blocked
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.6;
  bgm.play().catch(() => {
    const resumeAudio = () => {
      bgm.play();
      document.removeEventListener('click', resumeAudio);
      document.removeEventListener('touchstart', resumeAudio);
    };
    document.addEventListener('click', resumeAudio);
    document.addEventListener('touchstart', resumeAudio);
  });

  const checkboxes = document.querySelectorAll('.req-box');
  const submitBtn = document.getElementById('submitBtn');
  const errorToast = document.getElementById('errorToast');
  const ruleItems = document.querySelectorAll('.rule-item');

  function checkUnlock() {
    let allChecked = true;
    
    // Check visual styling for each item
    checkboxes.forEach((box, index) => {
      if (box.checked) {
        ruleItems[index].classList.add('checked');
      } else {
        ruleItems[index].classList.remove('checked');
        allChecked = false;
      }
    });

    // Unlock button if everything is checked
    if (allChecked) {
      submitBtn.classList.add('unlocked');
      submitBtn.innerText = "pottiiiii Agrees to Everything 💖";
      errorToast.classList.remove('show');
    } else {
      submitBtn.classList.remove('unlocked');
      submitBtn.innerText = "Sign & Accept Contract";
    }
  }

  function attemptSubmit() {
    let allChecked = true;
    checkboxes.forEach(box => {
      if (!box.checked) allChecked = false;
    });

    if (allChecked) {
      // SUCCESS! Move to the next page.
      window.location.href = 'polaroids.html';
    } else {
      // FAILED! Show error message and shake the button.
      errorToast.classList.add('show');
      submitBtn.style.animation = "shake 0.4s";
      setTimeout(() => {
        submitBtn.style.animation = "";
      }, 400);
    }
  }

  // Inject shake animation for the error state
  const style = document.createElement('style');
  style.innerHTML = `@keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }`;
  document.head.appendChild(style);
</script>
</body>
