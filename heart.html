<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
  :root{
    --bg:#04040a;
    --text:#eef1f6;
    --muted:#8891a3;
    --rose:#ff6f9c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:radial-gradient(ellipse at 50% 15%, #100a1a 0%, #050308 55%, #010102 100%);
    color:var(--text);
    font-family:'Georgia','Times New Roman',serif;
    overflow-x:hidden;
  }

  canvas#skyCanvas{
    position:fixed;inset:0;z-index:0;pointer-events:none;
  }

  .wrap{
    position:relative;z-index:1;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:44px 18px 60px;
  }

  header{
    text-align:center;
    margin-bottom:4px;
  }
  .eyebrow{
    letter-spacing:.35em;
    font-family:'Courier New',monospace;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:14px;
    opacity:0;
    animation:fadeIn 1.6s ease forwards;
    animation-delay:.3s;
  }
  h1{
    font-weight:400;
    font-style:italic;
    font-size:clamp(26px,6vw,42px);
    margin:0;
    color:#fff;
    letter-spacing:.01em;
    opacity:0;
    animation:fadeIn 1.8s ease forwards;
    animation-delay:.6s;
  }
  h1 em{
    font-style:normal;
    color:var(--rose);
    text-shadow:0 0 22px rgba(255,111,156,.55), 0 0 46px rgba(255,111,156,.25);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .stage{
    position:relative;
    width:min(94vw,600px);
    height:min(94vw,600px);
    margin-top:18px;
  }
  canvas#heartCanvas{
    width:100%;height:100%;display:block;position:relative;z-index:2;
  }
  .glow-ring{
    position:absolute;inset:6%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,80,130,.14) 0%, transparent 68%);
    filter:blur(10px);
    pointer-events:none;
    animation:pulseRing 2.2s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{opacity:.45;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.05);}
  }

  .caption{
    margin-top:8px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.03em;
    font-style:italic;
    opacity:0;
    transition:opacity 1.6s ease;
    max-width:360px;
  }
  .caption.show{opacity:1;}
  .caption strong{color:#fff;font-style:normal;font-weight:600;}

  .continue-link{
    margin-top:26px;
    display:inline-flex;align-items:center;gap:8px;
    color:#fff;
    text-decoration:none;
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,.25);
    padding:11px 22px;
    border-radius:30px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity 1.6s ease, transform 1.6s ease, background .25s ease, border-color .25s ease;
    background:rgba(255,255,255,.04);
  }
  .continue-link.show{opacity:.9;transform:translateY(0);}
  .continue-link:hover{background:rgba(255,111,156,.15);border-color:rgba(255,111,156,.5);}
  .continue-link .arrow{transition:transform .25s ease;}
  .continue-link:hover .arrow{transform:translateX(4px);}

  .sound-toggle{
    position:fixed;
    bottom:22px;right:22px;
    z-index:10;
    display:flex;align-items:center;gap:8px;
    background:rgba(15,10,20,.75);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    padding:10px 16px;
    border-radius:30px;
    font-family:'Courier New',monospace;
    font-size:11.5px;
    letter-spacing:.03em;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:opacity .4s ease, transform .3s ease, background .2s ease;
  }
  .sound-toggle:hover{background:rgba(35,22,32,.85);transform:translateY(-2px);}
  .eqbars{display:inline-flex;align-items:flex-end;gap:2px;height:14px;}
  .eqbars .bar{width:3px;background:var(--rose);display:inline-block;border-radius:2px;animation:eq 0.9s ease-in-out infinite;}
  .eqbars .bar:nth-child(1){height:6px;animation-delay:0s;}
  .eqbars .bar:nth-child(2){height:10px;animation-delay:.15s;}
  .eqbars .bar:nth-child(3){height:14px;animation-delay:.3s;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
</style>
</head>

<style id="site-polish-style">
  html{scroll-behavior:smooth;}

  #spLoadVeil{
    position:fixed;inset:0;z-index:99997;
    background:inherit;
    pointer-events:none;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:1;
    transition:opacity .9s ease, backdrop-filter .9s ease;
  }
  #spLoadVeil.sp-gone{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);}

  /* NOTE: intentionally not touching opacity/filter of body's children here —
     several pages manage their own .scene visibility via opacity, and doing
     so here would force every scene visible at once. The veil above handles
     the whole "fade in from blur" effect on its own. */

  .sp-glow-hit{
    animation:spGlowPulse .55s ease;
  }
  @keyframes spGlowPulse{
    0%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
    40%{filter:drop-shadow(0 0 14px rgba(255,111,149,.9));}
    100%{filter:drop-shadow(0 0 0px rgba(255,111,149,0));}
  }

  #spChapterLabel{
    position:fixed;
    top:16px;left:50%;transform:translateX(-50%);
    z-index:99991;
    font-family:'Playfair Display',Georgia,serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
    background:rgba(0,0,0,.22);
    padding:6px 14px;
    border-radius:20px;
    backdrop-filter:blur(3px);
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  #spChapterLabel.sp-show{opacity:.85;}
</style>

<div id="spLoadVeil"></div>
<div id="spChapterLabel"></div>

<script id="site-polish-script">
(function(){
  /* ---------- 1. Load fade-in (blur to sharp) ---------- */
  function revealVeil(){
    var veil = document.getElementById('spLoadVeil');
    if(!veil || veil.classList.contains('sp-gone')) return;
    veil.classList.add('sp-gone');
    setTimeout(function(){ if(veil.parentNode) veil.remove(); }, 1000);
  }
  window.addEventListener('load', function(){
    requestAnimationFrame(function(){ requestAnimationFrame(revealVeil); });
  });
  if(document.readyState === 'complete'){
    revealVeil();
  }

  /* ---------- 2. Hover / tap glow on interactive elements ---------- */
  var interactiveSelector = 'button, a, input, .btn-continue, .btn-next, [onclick], [role="button"]';

  function pulse(el){
    el.classList.remove('sp-glow-hit');
    void el.offsetWidth;
    el.classList.add('sp-glow-hit');
  }

  document.addEventListener('mouseover', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  });
  document.addEventListener('touchstart', function(e){
    var t = e.target.closest ? e.target.closest(interactiveSelector) : null;
    if(t) pulse(t);
  }, {passive:true});

  /* ---------- 3. Smooth scroll ---------- */
  /* handled via CSS scroll-behavior:smooth above */

  /* ---------- 4. Chapter label (brief, then fades away) ---------- */
  var CHAPTERS = {
    'index.html': 'Chapter 1 · The Beginning',
    'passwordgate.html': 'Chapter 1 · The Beginning',
    'potl-welcome.html': 'Chapter 1 · The Beginning',
    'firsts.html': 'Chapter 2 · Our Firsts',
    'jigsaw.html': 'Chapter 2 · Our Firsts',
    'tangled_love.html': 'Chapter 2 · Our Firsts',
    'stars.html': 'Chapter 3 · Under the Stars',
    'catch.html': 'Chapter 3 · Under the Stars',
    'our_constellation_part1.html': 'Chapter 3 · Under the Stars',
    'our_constellation.html': 'Chapter 3 · Under the Stars',
    'our_memorie_8_.html': 'Chapter 3 · Under the Stars',
    'memorymatch.html': 'Chapter 3 · Under the Stars',
    'night_quotes.html': 'Chapter 4 · Just Us',
    'playlist.html': 'Chapter 4 · Just Us',
    'videos.html': 'Chapter 4 · Just Us',
    'proposal.html': 'Chapter 4 · Just Us',
    'flames_new_fonts.html': 'Chapter 4 · Just Us',
    'potl-securitycheck.html': 'Chapter 4 · Just Us',
    'heart.html': 'Chapter 5 · For You',
    'cards (2).html': 'Chapter 5 · For You',
    'i_love_you.html': 'Chapter 5 · For You',
    'For_Anusha_-_Complete_Journey (2).html': 'Chapter 6 · Forever',
    'swipe.html': 'Chapter 6 · Forever',
    'her-smile-gallery (1).html': 'Chapter 6 · Forever',
    'three_quotes.html': 'Chapter 6 · Forever',
    'ourmoments (2).html': 'Chapter 6 · Forever',
    'love_quotes.html': 'Chapter 6 · Forever',
    'hearts.html': 'Chapter 7 · The Promise',
    'contract.html': 'Chapter 7 · The Promise',
    'proposal_with_song.html': 'Chapter 7 · The Promise'
  };

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var label = CHAPTERS[here];

  if(here === 'polaroids.html'){
    var visits = parseInt(sessionStorage.getItem('spPolaroidsVisits') || '0', 10) + 1;
    sessionStorage.setItem('spPolaroidsVisits', visits);
    label = visits <= 1 ? 'Chapter 2 · Our Firsts' : 'Chapter 7 · The Promise';
  }

  if(label){
    var el = document.getElementById('spChapterLabel');
    el.textContent = label;
    setTimeout(function(){ el.classList.add('sp-show'); }, 1300);
    setTimeout(function(){ el.classList.remove('sp-show'); }, 4200);
  }
})();
</script>

<script>
(function(){
  /* ---------------- Falling stars background ---------------- */
  const sky = document.getElementById('skyCanvas');
  const sctx = sky.getContext('2d');
  let sw, sh, dpr = Math.min(window.devicePixelRatio||1, 2);

  function resizeSky(){
    sw = window.innerWidth; sh = window.innerHeight;
    sky.width = sw*dpr; sky.height = sh*dpr;
    sky.style.width = sw+'px'; sky.style.height = sh+'px';
    sctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeSky);
  resizeSky();

  const ambientStars = [];
  for(let i=0;i<90;i++){
    ambientStars.push({
      x: Math.random()*sw, y: Math.random()*sh,
      r: Math.random()*1.4+0.3,
      phase: Math.random()*Math.PI*2,
      speed: 0.4+Math.random()*0.8
    });
  }

  const fallingStars = [];
  function spawnFalling(){
    fallingStars.push({
      x: Math.random()*sw,
      y: -20,
      len: 60+Math.random()*90,
      speed: 3.5+Math.random()*3.5,
      angle: Math.PI/3.4 + (Math.random()*0.15-0.075),
      life: 1,
      width: 1+Math.random()*1.2
    });
  }
  setInterval(()=>{ if(Math.random()<0.55) spawnFalling(); }, 900);

  function drawSky(){
    sctx.clearRect(0,0,sw,sh);
    const t = performance.now()/1000;

    // ambient twinkle
    ambientStars.forEach(s=>{
      const a = 0.35 + 0.5*Math.abs(Math.sin(t*s.speed + s.phase));
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      sctx.fillStyle = `rgba(255,255,255,${a})`;
      sctx.fill();
    });

    // falling stars
    for(let i=fallingStars.length-1;i>=0;i--){
      const f = fallingStars[i];
      f.x += Math.cos(f.angle)*f.speed;
      f.y += Math.sin(f.angle)*f.speed;
      f.life -= 0.012;
      if(f.life<=0 || f.y>sh+40 || f.x>sw+40){ fallingStars.splice(i,1); continue; }
      const tailX = f.x - Math.cos(f.angle)*f.len;
      const tailY = f.y - Math.sin(f.angle)*f.len;
      const grad = sctx.createLinearGradient(f.x,f.y,tailX,tailY);
      grad.addColorStop(0, `rgba(255,255,255,${f.life})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      sctx.strokeStyle = grad;
      sctx.lineWidth = f.width;
      sctx.beginPath();
      sctx.moveTo(f.x, f.y);
      sctx.lineTo(tailX, tailY);
      sctx.stroke();
    }

    requestAnimationFrame(drawSky);
  }
  drawSky();

  /* ---------------- Heart curve animation ---------------- */
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  const hdpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeHeart(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * hdpr;
    canvas.height = rect.height * hdpr;
    ctx.setTransform(hdpr,0,0,hdpr,0,0);
  }

  const palette = ['#ff5f8f','#ff9ecb','#ffd6e6','#ffffff','#ffc2d9','#ff86ae','#f7cfe1','#ffe9f2'];
  const N = 160;
  const points = [];
  for(let i=0;i<N;i++){
    const angle = i * (Math.PI*2)/N;
    const x = 16*Math.pow(Math.sin(angle),3);
    const y = 13*Math.cos(angle) - 5*Math.cos(2*angle) - 2*Math.cos(3*angle) - Math.cos(4*angle);
    points.push({
      x, y: -y,
      color: palette[i % palette.length],
      twinkle: Math.random()*Math.PI*2,
      size: 2.4 + Math.random()*2.2
    });
  }

  let drawnCount = 0;
  let complete = false;
  let heartbeat = 0;

  function project(p, w, h, beatScale){
    const scale = (Math.min(w,h) / 40) * beatScale;
    return { x: w/2 + p.x*scale, y: h/2 + p.y*scale - h*0.05 };
  }

  function drawSoftStar(cx, cy, size, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    // 4-point sparkle
    ctx.beginPath();
    for(let k=0;k<4;k++){
      const a = (Math.PI/2)*k + Math.PI/4;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a)*size, cy + Math.sin(a)*size);
      ctx.lineTo(cx + Math.cos(a+0.4)*size*0.3, cy + Math.sin(a+0.4)*size*0.3);
    }
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, size*0.32, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawHeart(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);

    heartbeat += 0.045;
    const beatScale = complete ? 1 + Math.sin(heartbeat)*0.018 : 1;

    const center = project({x:0,y:0}, w, h, beatScale);
    const limit = drawnCount;

    // soft filled glow of the heart shape once mostly drawn
    if(limit > N*0.6){
      ctx.save();
      ctx.beginPath();
      const first = project(points[0], w, h, beatScale);
      ctx.moveTo(first.x, first.y);
      for(let i=1;i<Math.min(limit,N);i++){
        const pos = project(points[i], w, h, beatScale);
        ctx.lineTo(pos.x, pos.y);
      }
      ctx.closePath();
      const grad = ctx.createRadialGradient(center.x, center.y, 4, center.x, center.y, Math.min(w,h)*0.42);
      grad.addColorStop(0, 'rgba(255,111,156,0.20)');
      grad.addColorStop(1, 'rgba(255,111,156,0)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }

    for(let i=0;i<limit;i++){
      const p = points[i];
      const pos = project(p, w, h, beatScale);
      ctx.save();
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = 0.42;
      ctx.lineWidth = 1;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.restore();

      const isRecent = i > drawnCount - 5;
      const twinkleAlpha = 0.55 + 0.45*Math.sin(p.twinkle + performance.now()/420);
      drawSoftStar(pos.x, pos.y, p.size, p.color, isRecent ? 1 : twinkleAlpha);
    }

    requestAnimationFrame(drawHeart);
  }

  function grow(){
    if(drawnCount < N){
      drawnCount++;
      if(drawnCount >= N && !complete){
        complete = true;
        document.getElementById('caption').classList.add('show');
        setTimeout(()=>{ document.getElementById('continueLink').classList.add('show'); }, 1800);
      }
      setTimeout(grow, 22);
    }
  }

  window.addEventListener('resize', resizeHeart);
  resizeHeart();
  requestAnimationFrame(drawHeart);
  setTimeout(grow, 500);

  /* ---------------- Audio (embedded, autoplay) ---------------- */
  const audio = document.getElementById('bgAudio');
  const toggle = document.getElementById('soundToggle');
  const label = document.getElementById('soundLabel');

  audio.load();

  function setPlayingUI(isPlaying){
    label.textContent = isPlaying ? 'sound on' : 'tap for sound';
    eq.style.opacity = isPlaying ? '1' : '.35';
  }

  function tryAutoplay(){
    const p = audio.play();
    if(p !== undefined){
      p.then(()=>setPlayingUI(true)).catch(()=>{
        setPlayingUI(false);
        const resume = () => {
          audio.play().then(()=>setPlayingUI(true)).catch(()=>{});
          window.removeEventListener('click', resume);
          window.removeEventListener('touchstart', resume);
        };
        window.addEventListener('click', resume, {once:true});
        window.addEventListener('touchstart', resume, {once:true});
      });
    }
  }
  tryAutoplay();

  toggle.addEventListener('click', function(){
    if(audio.paused){
      audio.play().then(()=>setPlayingUI(true)).catch(()=>{});
    } else {
      audio.pause();
      setPlayingUI(false);
    }
  });
})();

<style id="cursor-trail-style">
  .ct-particle{
    position:fixed;
    top:0;left:0;
    pointer-events:none;
    z-index:99995;
    will-change:transform, opacity, filter;
    user-select:none;
  }
</style>

<script id="cursor-trail-script">
(function(){
  if(window.__ctInit) return;
  window.__ctInit = true;

  var THEMES = {
    'flames_new_fonts.html': [
      { type:'sparkle', glyph:'✦', colors:['#ffc36b','#ffe14d','#ff9a4d'] },
      { type:'sparkle', glyph:'✧', colors:['#ff7a3d','#ffb347'] },
      { type:'heart',   glyph:'♥', colors:['#ff6f45','#ff8f5a'] }
    ],
    'stars.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#a8d8ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#8fd6ff','#e0f4ff'] },
      { type:'petal',   glyph:'❀', colors:['#c9e8ff','#e6f4ff'] }
    ],
    'our_constellation_part1.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'our_constellation.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'tangled_love.html': [
      { type:'heart', glyph:'♥', colors:['#ff5f8f','#e8547a'] },
      { type:'petal', glyph:'✿', colors:['#ffc3dd','#ffb6d9'] }
    ],
    'contract.html': [
      { type:'sparkle', glyph:'✦', colors:['#e8b978','#d4a95f'] },
      { type:'heart',   glyph:'♥', colors:['#ff8fac'] }
    ]
  };

  var DEFAULT_THEME = [
    { type:'heart',  glyph:'♥', colors:['#ff6f95','#ff8fac','#e8547a','#ffb3c6'] },
    { type:'heart',  glyph:'❤', colors:['#ff5f8f','#ff9ecb'] },
    { type:'petal',  glyph:'✿', colors:['#ffc3dd','#ffd6e6','#f7a8c4'] },
    { type:'petal',  glyph:'❀', colors:['#ffb6d9','#ffe0ef'] },
    { type:'petal',  glyph:'✾', colors:['#ffd6a5','#ffe8c9'] },
    { type:'sparkle',glyph:'✦', colors:['#ffe14d','#ffc36b','#fff3b0'] },
    { type:'sparkle',glyph:'✧', colors:['#c9e8ff','#ffffff'] },
    { type:'sparkle',glyph:'·', colors:['#ffffff','#ffe9f2'] }
  ];

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var shapes = THEMES[here] || DEFAULT_THEME;

  var isSmallScreen = window.innerWidth < 400;
  var minInterval = isSmallScreen ? 75 : 50;

  var lastSpawn = 0;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildWaveKeyframes(x, y, size, kind){
    var totalDriftY = kind === 'sparkle' ? rand(-26,-10) : rand(50,95);
    var swayAmp = kind === 'sparkle' ? rand(4,10) : rand(18,34);
    var swayDir = Math.random() < 0.5 ? 1 : -1;
    var totalRot = rand(-50,50) * (kind === 'petal' ? 1.6 : 1);
    var steps = 6;
    var frames = [];

    for(var i=0;i<=steps;i++){
      var t = i/steps;
      var vy = totalDriftY * (t*t*(3-2*t));
      var vx = Math.sin(t*Math.PI*1.3) * swayAmp * swayDir * (kind === 'sparkle' ? 0.4 : 1);
      var rot = totalRot * t;
      var scale, opacity;
      if(kind === 'sparkle'){
        scale = t < 0.3 ? (0.4 + t*2.6) : (1.15 - (t-0.3)*0.6);
        opacity = t < 0.15 ? t/0.15 : (t > 0.7 ? Math.max(0,(1-t)/0.3) : 0.75 + Math.sin(t*22)*0.25);
      } else {
        scale = t < 0.25 ? (0.5 + t*2) : (1 - (t-0.25)*0.35);
        opacity = t < 0.12 ? t/0.12 : Math.max(0, 1 - Math.pow((t-0.12)/0.88, 1.4));
      }
      frames.push({
        transform: 'translate('+(x+vx-size/2)+'px,'+(y+vy-size/2)+'px) rotate('+rot+'deg) scale('+Math.max(0.05,scale).toFixed(3)+')',
        opacity: Math.max(0, Math.min(1, opacity)).toFixed(3),
        offset: t
      });
    }
    return frames;
  }

  function spawnAt(x, y, force){
    var now = performance.now();
    if(!force && now - lastSpawn < minInterval) return;
    lastSpawn = now;

    var shape = pick(shapes);
    var color = pick(shape.colors);

    var el = document.createElement('div');
    el.className = 'ct-particle';
    el.textContent = shape.glyph;

    var size = shape.type === 'sparkle' ? rand(7,13) : rand(12,20);
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.filter = 'drop-shadow(0 0 '+(size*0.7)+'px '+color+')';

    var offX = rand(-3,3);
    var offY = rand(-3,3);
    document.body.appendChild(el);

    var frames = buildWaveKeyframes(x+offX, y+offY, size, shape.type);
    var dur = shape.type === 'sparkle' ? rand(650,950) : rand(1300,1900);

    var anim = el.animate(frames, { duration: dur, easing: 'linear' });
    anim.onfinish = function(){ el.remove(); };
  }

  var lastX = null, lastY = null;
  var lastMoveTime = performance.now();
  var idleTimer = null;

  function scheduleIdle(x, y){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(x !== null) spawnAt(x, y, true);
      scheduleIdle(x, y);
    }, 2200 + rand(0,900));
  }

  function handlePointer(x, y){
    var now = performance.now();
    if(lastX !== null){
      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var dt = Math.max(8, now - lastMoveTime);
      var speed = dist / dt; // px per ms

      // faster movement -> denser trail (more interpolated steps), capped for performance
      var baseSteps = Math.max(1, Math.floor(dist / 20));
      var speedBoost = speed > 1.2 ? 2 : (speed > 0.6 ? 1 : 0);
      var steps = Math.min(isSmallScreen ? 4 : 7, baseSteps + speedBoost);

      for(var i=1;i<=steps;i++){
        var t = i/steps;
        spawnAt(lastX + dx*t, lastY + dy*t);
      }
    } else {
      spawnAt(x,y,true);
    }
    lastX = x; lastY = y;
    lastMoveTime = now;
    scheduleIdle(x, y);
  }

  window.addEventListener('mousemove', function(e){
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchstart', function(e){
    if(e.touches && e.touches[0]){
      spawnAt(e.touches[0].clientX, e.touches[0].clientY, true);
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      scheduleIdle(lastX, lastY);
    }
  }, {passive:true});

  window.addEventListener('click', function(e){
    var count = isSmallScreen ? 5 : 8;
    for(var i=0;i<count;i++){
      (function(i){
        var angle = (i/count) * Math.PI * 2;
        var dist = rand(6,26);
        setTimeout(function(){
          spawnAt(e.clientX + Math.cos(angle)*dist, e.clientY + Math.sin(angle)*dist, true);
        }, i*22);
      })(i);
    }
  });
})();
</script>
