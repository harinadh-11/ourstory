<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Special... 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 30% 70%, #1b2735 0%, #090a0f 100%);
    color: white;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
  }

  /* Starfield */
  #starfield {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* Shooting stars */
  .shooting {
    position: absolute;
    height: 2px;
    background: linear-gradient(to right, rgba(255,255,255,0), white);
    border-radius: 2px;
    animation: shoot linear forwards;
    pointer-events: none;
  }
  @keyframes shoot {
    from { transform: translateX(0) translateY(0); opacity: 1; }
    to   { transform: translateX(300px) translateY(150px); opacity: 0; }
  }

  /* Floating emoji */
  .float-emoji {
    position: fixed;
    pointer-events: none;
    animation: floatE linear infinite;
    opacity: 0;
    z-index: 1;
  }
  @keyframes floatE {
    0%  { transform: translateY(100vh) rotate(0); opacity: 0; }
    8%  { opacity: 0.5; }
    92% { opacity: 0.2; }
    100%{ transform: translateY(-15vh) rotate(20deg); opacity: 0; }
  }

  /* Main card */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 480px;
    width: 100%;
    animation: cardIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Letter envelope */
  .envelope {
    width: 90px;
    height: 70px;
    margin: 0 auto 30px;
    position: relative;
    cursor: pointer;
    animation: envFloat 4s ease-in-out infinite;
  }

  @keyframes envFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%       { transform: translateY(-8px) rotate(2deg); }
  }

  .env-body {
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, #c0392b, #e74c3c);
    border-radius: 6px;
    position: relative;
    box-shadow: 0 8px 30px rgba(231,76,60,0.4);
  }

  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45px;
    background: linear-gradient(145deg, #e74c3c, #c0392b);
    clip-path: polygon(0 0, 50% 55%, 100% 0);
    border-radius: 6px 6px 0 0;
    transition: transform 0.5s ease;
    transform-origin: top center;
  }

  .envelope:hover .env-flap { transform: rotateX(180deg); }

  .env-heart {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    z-index: 2;
    padding-top: 10px;
  }

  /* Badge */
  .badge {
    display: inline-block;
    background: rgba(255,182,193,0.12);
    border: 1px solid rgba(255,182,193,0.25);
    color: #ffb6c1;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
    animation: fadeIn 1s 0.4s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .to-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.35;
    margin-bottom: 14px;
    animation: fadeIn 1s 0.5s both;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(38px, 9vw, 56px);
    line-height: 1.1;
    margin-bottom: 8px;
    animation: fadeIn 1s 0.6s both;
  }

  h1 em {
    font-style: italic;
    color: #ff8fa8;
  }

  .tagline {
    font-size: 15px;
    opacity: 0.45;
    margin-bottom: 36px;
    line-height: 1.6;
    animation: fadeIn 1s 0.7s both;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Enter button */
  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #ff4d85, #ff8fa8);
    color: white;
    border: none;
    padding: 20px 48px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    box-shadow: 0 16px 40px rgba(255,77,133,0.35), 0 0 0 0 rgba(255,77,133,0.4);
    transition: transform 0.2s, box-shadow 0.3s;
    animation: fadeIn 1s 0.9s both, pulse 3s 2s ease-in-out infinite;
    letter-spacing: 0.3px;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 16px 40px rgba(255,77,133,0.35), 0 0 0 0 rgba(255,77,133,0.3); }
    50%       { box-shadow: 0 16px 40px rgba(255,77,133,0.45), 0 0 0 18px rgba(255,77,133,0); }
  }

  .enter-btn:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 24px 50px rgba(255,77,133,0.5); }
  .enter-btn:active { transform: scale(0.97); }

  .btn-arrow {
    font-size: 22px;
    animation: arrowSlide 1.5s ease-in-out infinite;
  }

  @keyframes arrowSlide {
    0%, 100% { transform: translateX(0); }
    50%       { transform: translateX(5px); }
  }

  /* Small hint below */
  .hint {
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.22;
    letter-spacing: 1px;
    animation: fadeIn 1s 1.2s both;
  }

  /* Corner decorations */
  .corner-deco {
    position: fixed;
    font-size: 14px;
    opacity: 0.08;
    z-index: 1;
  }
  .tl { top: 30px; left: 30px; }
  .tr { top: 30px; right: 30px; transform: scaleX(-1); }
  .bl { bottom: 30px; left: 30px; }
  .br { bottom: 30px; right: 30px; transform: scaleX(-1); }

  .back-to-path { position: fixed; top: 18px; left: 18px; z-index: 999; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: rgba(255,255,255,0.65); text-decoration: none; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; padding: 9px 16px 9px 12px; border-radius: 30px; transition: all 0.2s; letter-spacing: 0.3px; }
  .back-to-path:hover { background: rgba(255,255,255,0.14); color: #fff; transform: translateX(-2px); }
  .back-to-path svg { width: 14px; height: 14px; flex-shrink:0; }
  @media (max-width: 480px) { .back-to-path { top: 12px; left: 12px; font-size: 11px; padding: 7px 13px 7px 10px; } }
</style>
</head>
<body>
<a href="firsts.html" class="back-to-path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Path</a>


<!-- Starfield -->
<div id="starfield"></div>

<!-- Corner decorations -->
<div class="corner-deco tl">✦ ✦ ✦</div>
<div class="corner-deco tr">✦ ✦ ✦</div>
<div class="corner-deco bl">✦ ✦ ✦</div>
<div class="corner-deco br">✦ ✦ ✦</div>

<div class="card">
  <div class="envelope" onclick="document.querySelector('.enter-btn').click()">
    <div class="env-body">
      <div class="env-flap"></div>
      <div class="env-heart">💌</div>
    </div>
  </div>

  <div class="to-label">A message for</div>
  <h1><em>Anusha</em></h1>
  <p class="tagline">Someone put a lot of love into this.<br>You deserve every single second of it.</p>

  <button class="enter-btn" onclick="goToFirsts()">
    Open the letter
    <span class="btn-arrow">→</span>
  </button>

  <div class="hint">tap to begin your journey ✨</div>
</div>

<script>
  // Starfield
  const sf = document.getElementById('starfield');
  for(let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*5}s;
    `;
    sf.appendChild(s);
  }

  // Shooting stars
  function shoot() {
    const s = document.createElement('div');
    s.className = 'shooting';
    s.style.cssText = `
      top:${Math.random()*50}%;
      left:${Math.random()*60}%;
      width:${60+Math.random()*80}px;
      animation-duration:${0.5+Math.random()*0.5}s;
    `;
    sf.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
  setInterval(shoot, 3000 + Math.random()*2000);

  // Floating emoji
  const fe = ['💗','✨','🌸','💫','💕','❤️','🌟'];
  for(let i = 0; i < 8; i++) {
    const e = document.createElement('div');
    e.className = 'float-emoji';
    e.textContent = fe[i % fe.length];
    e.style.cssText = `
      left:${Math.random()*100}%;
      font-size:${12+Math.random()*16}px;
      animation-duration:${10+Math.random()*10}s;
      animation-delay:${Math.random()*10}s;
    `;
    document.body.appendChild(e);
  }
</script>

<video id="bgMusic" src="surysa.mp4" style="display:none" playsinline preload="auto"></video>

<script>
  (function(){
    const v = document.getElementById('bgMusic');
    function tryPlay(){ v.play().catch(()=>{}); }
    // Attempt autoplay once the page has loaded
    window.addEventListener('load', tryPlay);
    // Fallback: if autoplay was blocked, resume on the very first user tap anywhere
    function resumeOnce(){
      if (v.paused) v.play().catch(()=>{});
      document.removeEventListener('click', resumeOnce);
      document.removeEventListener('touchstart', resumeOnce);
    }
    document.addEventListener('click', resumeOnce);
    document.addEventListener('touchstart', resumeOnce);
  })();

  function goToFirsts(){
    const v = document.getElementById('bgMusic');
    // Make sure it's playing before we leave, and hand off the current time
    v.play().catch(()=>{});
    sessionStorage.setItem('surysaTime', String(v.currentTime || 0));
    sessionStorage.setItem('surysaPlaying', v.paused ? '0' : '1');
    window.location.href = 'firsts.html';
  }
</script>
</body>
</html>
