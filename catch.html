<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch My Heart 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; height: 100vh; background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); color: white; font-family: 'Nunito', sans-serif; overflow: hidden; user-select: none; }
  .header { position: absolute; top: 30px; width: 100%; text-align: center; z-index: 10; }
  .header h1 { font-family: 'Playfair Display', serif; color: #ffb6c1; margin: 0 0 10px 0; font-size: 32px; }
  .score-board { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 10px 25px; border-radius: 20px; display: inline-block; font-size: 20px; font-weight: bold; }
  .heart { position: absolute; bottom: -100px; font-size: 50px; cursor: pointer; z-index: 5; animation: floatUp linear forwards; }
  @keyframes floatUp { 0% { transform: translateY(0) rotate(-10deg); } 100% { transform: translateY(-120vh) rotate(-10deg); } }
  .pop-word { position: absolute; font-size: 24px; font-weight: bold; color: #4dff88; z-index: 6; animation: popFade 0.8s forwards; pointer-events: none; }
  @keyframes popFade { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.2) translateY(-40px); opacity: 0; } }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 20; opacity: 0; pointer-events: none; transition: 0.5s; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .success-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; padding: 40px 30px; text-align: center; max-width: 400px; width: 90%; }
  .btn-next { background: linear-gradient(135deg, #ff4d85, #ff8fa8); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 25px; }
  .sound-toggle { position: absolute; top: 30px; right: 25px; z-index: 15; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>

<button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
<div class="header"><h1>Catch My Heart</h1><div class="score-board">Caught: <span id="score">0</span> / 10</div></div>
<div id="game-container"></div>
<div class="modal-overlay" id="successModal">
  <div class="success-card">
    <div style="font-size: 60px; margin-bottom: 15px;">🥰</div>
    <h2 style="font-family: 'Playfair Display'; color: #ffb6c1;">You caught them all!</h2>
    <p>You already caught my heart anyway...</p>
    <button class="btn-next" onclick="window.location.href='our_constellation_part1.html'">Next Challenge →</button>
  </div>
</div>
<script>
  let score = 0; let interval;
  const words = ["Beautiful!", "Mine!", "Perfect!", "Forever!", "Soulmate!"];
  function spawn() {
    let h = document.createElement('div'); h.className = 'heart'; h.innerText = "💖";
    h.style.left = Math.floor(Math.random() * 80) + 10 + 'vw';
    h.style.animationDuration = (Math.random() * 2 + 3) + 's';
    h.onmousedown = h.ontouchstart = (e) => {
      e.preventDefault(); h.remove(); score++; document.getElementById('score').innerText = score;
      let w = document.createElement('div'); w.className = 'pop-word'; w.innerText = words[Math.floor(Math.random()*words.length)];
      w.style.left = (e.clientX||e.touches[0].clientX)-30+'px'; w.style.top = (e.clientY||e.touches[0].clientY)-30+'px';
      document.body.appendChild(w); setTimeout(()=>w.remove(), 800);
      if(score >= 10) { clearInterval(interval); setTimeout(()=>document.getElementById('successModal').classList.add('active'), 500); }
    };
    document.getElementById('game-container').appendChild(h);
  }
  interval = setInterval(spawn, 700);

  // ---- Background song: auto-play on load, with fallback for browsers that block it ----
  const bgSong = document.getElementById('bgSong');
  const soundToggle = document.getElementById('soundToggle');
  bgSong.volume = 0.8;

  function tryPlay() {
    const p = bgSong.play();
    if (p !== undefined) {
      p.then(() => { soundToggle.innerText = '🔊'; })
       .catch(() => {
          // Autoplay was blocked by the browser — start on first tap/click anywhere
          soundToggle.innerText = '🔇';
          const startOnInteract = () => {
            bgSong.play().then(() => { soundToggle.innerText = '🔊'; });
            document.removeEventListener('click', startOnInteract);
            document.removeEventListener('touchstart', startOnInteract);
          };
          document.addEventListener('click', startOnInteract, { once: true });
          document.addEventListener('touchstart', startOnInteract, { once: true });
       });
    }
  }
  window.addEventListener('DOMContentLoaded', tryPlay);
  tryPlay();

  function toggleSound() {
    if (bgSong.paused) {
      bgSong.play(); soundToggle.innerText = '🔊';
    } else {
      bgSong.pause(); soundToggle.innerText = '🔇';
    }
  }
</script>
