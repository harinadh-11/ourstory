
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Great+Vibes&family=IM+Fell+English:ital@0;1&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
#fr{min-height:640px;background:#03000a;border-radius:22px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:44px;}
canvas#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}
.symlayer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}

.crown{z-index:5;margin-top:28px;text-align:center;padding:0 16px;}
.crown-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;letter-spacing:6px;
  background:linear-gradient(135deg,#ff3fa0,#ff7c3a,#ffe066,#d946ef,#ff3fa0);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:hueShift 5s ease infinite;
  line-height:1.15;
}
@keyframes hueShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.crown-sub{
  font-family:'IM Fell English',serif;font-style:italic;
  font-size:0.9rem;color:rgba(255,180,210,0.45);
  letter-spacing:1.5px;margin-top:8px;
}
.dot-row{z-index:5;display:flex;gap:9px;margin-top:12px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;animation:dotPop 2.2s ease-in-out infinite;}
.dot:nth-child(1){background:#ff3fa0;animation-delay:0s;}
.dot:nth-child(2){background:#ff7c3a;animation-delay:.35s;}
.dot:nth-child(3){background:#ffe066;animation-delay:.7s;}
.dot:nth-child(4){background:#a78bfa;animation-delay:1.05s;}
.dot:nth-child(5){background:#38bdf8;animation-delay:1.4s;}
@keyframes dotPop{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(1.7);opacity:1;}}

.card{
  z-index:5;margin-top:22px;width:min(430px,92%);
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,90,180,0.15);
  border-radius:22px;padding:26px 26px 22px;
  backdrop-filter:blur(22px);
}
.flabel{
  font-family:'Philosopher',serif;font-weight:700;
  font-size:0.88rem;color:rgba(255,160,210,0.65);
  letter-spacing:1.8px;text-transform:uppercase;
  margin-bottom:7px;display:flex;align-items:center;gap:6px;
}
.flabel em{font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;font-size:0.85rem;letter-spacing:0.5px;text-transform:none;opacity:.7;}
.inp{
  width:100%;padding:12px 20px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,90,160,0.18);border-radius:50px;
  color:#ffe8f6;
  font-family:'Great Vibes',cursive;font-size:1.45rem;
  outline:none;letter-spacing:0.5px;
  transition:border-color .35s,box-shadow .35s,background .3s;
}
.inp:focus{border-color:rgba(255,60,150,0.6);background:rgba(255,50,140,0.06);box-shadow:0 0 0 3px rgba(255,50,140,0.09);}
.inp::placeholder{color:rgba(255,200,230,0.2);font-size:1.3rem;}
.div{display:flex;align-items:center;gap:10px;margin:12px 0;}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,90,180,0.22),transparent);}
.div-sym{font-family:'Cinzel Decorative',serif;font-size:0.7rem;color:rgba(255,90,180,0.45);letter-spacing:2px;}
.go{
  width:100%;margin-top:18px;padding:15px;border:none;border-radius:50px;
  background:linear-gradient(135deg,#9b1560,#d4196e,#ff5722,#ff9800);
  background-size:200% 200%;animation:hueShift 5s ease infinite;
  color:#fff;font-family:'Cinzel Decorative',serif;font-size:1rem;font-weight:700;
  letter-spacing:3px;cursor:pointer;
  box-shadow:0 8px 28px rgba(180,20,100,0.4);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
}
.go:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 38px rgba(210,30,110,.55);}
.go:active{transform:scale(.97);}

.result-area{
  z-index:5;width:min(430px,92%);margin-top:20px;
  opacity:0;transform:translateY(20px) scale(.97);
  transition:opacity .8s ease,transform .8s cubic-bezier(.34,1.2,.64,1);
  pointer-events:none;
}
.result-area.show{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
.count-line{
  text-align:center;margin-bottom:14px;
  font-family:'IM Fell English',serif;font-style:italic;
  font-size:0.82rem;color:rgba(255,170,210,0.45);letter-spacing:.8px;
}
.flames-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.fc{
  width:46px;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel Decorative',serif;font-size:.85rem;font-weight:700;
  border:1px solid rgba(255,255,255,0.07);color:rgba(255,160,180,.3);
  background:rgba(255,255,255,0.025);
  transition:all .5s cubic-bezier(.34,1.56,.64,1);
  letter-spacing:0;
}
.fc.lit{color:#fff;transform:scale(1.12) translateY(-3px);box-shadow:0 0 22px var(--gc,#ff3fa0),0 0 6px var(--gc,#ff3fa0);border-color:var(--gc,#ff3fa0);background:rgba(255,255,255,.05);}
.fc.gone{color:rgba(100,30,55,.3);background:rgba(50,0,20,.18);border-color:rgba(90,15,40,.18);transform:scale(.87);text-decoration:line-through;text-decoration-color:rgba(160,40,70,.25);}
.fc.winner{animation:wPop .65s cubic-bezier(.34,1.56,.64,1) forwards,wGlow 2.2s ease-in-out .65s infinite;}
@keyframes wPop{0%{transform:scale(1);}55%{transform:scale(1.6);}100%{transform:scale(1.3) translateY(-4px);}}
@keyframes wGlow{0%,100%{box-shadow:0 0 22px var(--gc,#ff3fa0),0 0 6px var(--gc,#ff3fa0);}50%{box-shadow:0 0 44px var(--gc,#ff3fa0),0 0 18px var(--gc,#ff3fa0);}}

.rcard{
  border-radius:20px;padding:26px 22px 22px;text-align:center;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.1);
}
.rcard::before{content:'';position:absolute;inset:0;background:var(--cbg,linear-gradient(135deg,#120020,#2a0040));opacity:.88;z-index:0;}
.rshine{position:absolute;top:-70px;left:-70px;width:220px;height:220px;border-radius:50%;background:var(--cshine,rgba(255,60,160,.12));filter:blur(44px);z-index:0;animation:shineD 7s ease-in-out infinite;}
@keyframes shineD{0%,100%{transform:translate(0,0);}50%{transform:translate(70px,45px);}}
.rcard>*{position:relative;z-index:1;}
.ricon{font-size:2.8rem;display:block;margin-bottom:8px;animation:iconIn .8s cubic-bezier(.34,1.56,.64,1);}
@keyframes iconIn{0%{transform:rotate(-25deg) scale(.3);opacity:0;}100%{transform:rotate(0) scale(1);opacity:1;}}
.rword{
  font-family:'Great Vibes',cursive;font-size:3.6rem;line-height:1;letter-spacing:1px;
  background:linear-gradient(135deg,var(--gc,#ff3fa0),#fff,var(--gc,#ff3fa0));
  background-size:200% 200%;animation:hueShift 3s ease infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.rpct{
  font-family:'Philosopher',serif;font-size:0.8rem;
  color:rgba(255,200,230,.55);letter-spacing:1.5px;margin-top:5px;
}
.rpoem{
  font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;
  font-size:1.05rem;line-height:1.8;margin-top:14px;
  color:rgba(255,230,245,.65);
}
.rhearts{font-family:'Philosopher',serif;font-size:1rem;letter-spacing:3px;margin-top:10px;opacity:.75;}
.meter-wrap{margin-top:16px;}
.mlabel{font-family:'Philosopher',serif;font-size:0.75rem;color:rgba(255,170,210,.45);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}
.mtrack{height:5px;background:rgba(255,255,255,.05);border-radius:50px;overflow:hidden;}
.mfill{height:100%;border-radius:50px;width:0%;transition:width 1.5s cubic-bezier(.25,1,.5,1);}
.reset{display:block;text-align:center;margin-top:16px;border:none;background:none;cursor:pointer;font-family:'IM Fell English',serif;font-style:italic;font-size:.95rem;color:rgba(255,140,190,.35);transition:color .3s;}
.reset:hover{color:rgba(255,140,190,.85);}
.fsym{position:absolute;pointer-events:none;font-family:'Great Vibes',cursive;animation:floatSym var(--dur,4s) ease-in var(--dl,0s) forwards;opacity:0;z-index:2;font-size:var(--fs,1.1rem);}
@keyframes floatSym{0%{opacity:0;transform:translateY(0) rotate(var(--r0,-12deg)) scale(.4);}14%{opacity:.85;}82%{opacity:.3;}100%{opacity:0;transform:translateY(-280px) rotate(var(--r1,16deg)) scale(1.15);}}

.who-row{display:flex;gap:10px;margin-bottom:14px;}
.who-btn{
  flex:1;padding:11px 12px;border-radius:50px;text-align:center;
  border:1px solid rgba(255,90,160,0.18);background:rgba(255,255,255,0.03);
  color:rgba(255,220,235,0.75);font-family:'Philosopher',serif;font-weight:700;
  font-size:0.92rem;letter-spacing:0.5px;cursor:pointer;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.who-btn:hover{border-color:rgba(255,60,150,0.5);background:rgba(255,50,140,0.08);transform:translateY(-1px);}
.who-btn.active{
  background:linear-gradient(135deg,#9b1560,#d4196e,#ff5722);
  border-color:transparent;color:#fff;transform:translateY(-1px) scale(1.02);
  box-shadow:0 8px 22px rgba(180,20,100,.4);
}
</style>

<script>
const DATA={
  F:{word:'Friends',icon:'🌸',gc:'#a78bfa',cbg:'linear-gradient(135deg,#0c0022,#18083a)',cshine:'rgba(167,139,250,.2)',mfill:'linear-gradient(90deg,#a78bfa,#7c3aed)',pct:68,ml:'friendship warmth',poem:'Side by side through sun and rain,\nyour laughter is a sweet refrain.\nNot every bond needs a lover\'s name —\ntwo hearts like yours burn a gentler flame.',hearts:'♡  ♡  ♡',syms:['✿','♡','✦','❋','◇']},

  E:{word:'Enemies',icon:'⚡',gc:'#38bdf8',cbg:'linear-gradient(135deg,#00101a,#001f2d)',cshine:'rgba(56,189,248,.15)',mfill:'linear-gradient(90deg,#38bdf8,#0284c7)',pct:30,ml:'tension charge',poem:'Even in opposition, sparks speak loud —\nperhaps love simply wears a fiercer shroud.\nContraries attract more than they repel;\nthe fiercest rivals know each other well.',hearts:'⚡  ♡  ⚡',syms:['⚡','✦','◇','△','⚡']},
  S:{word:'Soulmates',icon:'✨',gc:'#c084fc',cbg:'linear-gradient(135deg,#0e0018,#1f0032)',cshine:'rgba(192,132,252,.22)',mfill:'linear-gradient(90deg,#c084fc,#9333ea)',pct:99,ml:'soul connection',poem:'Written in cosmos before the first dawn,\nyour names were entwined before time moved on.\nTwo ancient lights that searched the dark —\nyou found each other. That is the art.',hearts:'♥  ✦  ♥  ✦  ♥',syms:['✨','♥','✦','★','✿']}
};
const FL=['F','L','A','M','E','S'];
const FLCOL=['#ff3fa0','#fb923c','#ffd166','#c084fc','#38bdf8','#a78bfa'];

function countRem(a,b){
  const A=[...a.toLowerCase().replace(/\s/g,'')],B=[...b.toLowerCase().replace(/\s/g,'')];
  const uA=new Array(A.length).fill(false),uB=new Array(B.length).fill(false);
  for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)if(!uA[i]&&!uB[j]&&A[i]===B[j]){uA[i]=uB[j]=true;break;}
  return uA.filter(v=>!v).length+uB.filter(v=>!v).length;
}
function doFlames(n){
  let arr=[0,1,2,3,4,5],idx=0,el=[];
  while(arr.length>1){idx=(idx+n-1)%arr.length;el.push(arr[idx]);arr.splice(idx,1);if(idx>=arr.length)idx=0;}
  return{winner:arr[0],el};
}
function calculate(){
  const n1=document.getElementById('n1').value.trim(),n2=document.getElementById('n2').value.trim();
  if(!n1||!n2)return;
  let rem=countRem(n1,n2);if(rem===0)rem=FL.length;
  const{winner,el}=doFlames(rem),key=FL[winner],d=DATA[key];
  document.getElementById('cpill').textContent=`${n1}  ·  ${n2}  ·  ${rem} letters remain`;
  buildCells(el,winner,d.gc);
  const rc=document.getElementById('rc');
  rc.style.setProperty('--cbg',d.cbg);rc.style.setProperty('--gc',d.gc);
  document.getElementById('rs').style.background=d.cshine;
  document.getElementById('ri').textContent=d.icon;
  const rw=document.getElementById('rw');
  rw.textContent=d.word;rw.style.setProperty('--gc',d.gc);
  document.getElementById('rp').textContent=`${d.pct}% compatibility · ${d.ml}`;
  document.getElementById('rpo').innerHTML=d.poem.replace(/\n/g,'<br>');
  document.getElementById('rh').textContent=d.hearts;
  document.getElementById('ml').textContent=d.ml;
  const mf=document.getElementById('mf');
  mf.style.width='0%';mf.style.background=d.mfill;
  mf.style.boxShadow=`0 0 10px ${d.gc}`;
  document.getElementById('ra').classList.add('show');
  spawnSyms(d.syms,d.gc);
  setTimeout(()=>mf.style.width=d.pct+'%',900);
}
function buildCells(el,winner,gc){
  const g=document.getElementById('fg');g.innerHTML='';
  FL.forEach((ch,i)=>{
    const c=document.createElement('div');c.className='fc';c.id='flc'+i;c.textContent=ch;
    c.style.setProperty('--gc',FLCOL[i]);g.appendChild(c);
    setTimeout(()=>c.classList.add('lit'),80+i*100);
  });
  el.forEach((idx,s)=>setTimeout(()=>{
    const e=document.getElementById('flc'+idx);
    if(e){e.classList.remove('lit');e.classList.add('gone');}
  },700+s*390));
  setTimeout(()=>{
    const e=document.getElementById('flc'+winner);
    if(e){e.classList.remove('gone');e.classList.add('lit','winner');e.style.setProperty('--gc',gc);}
  },700+el.length*390+200);
}
function spawnSyms(syms,gc){
  const sl=document.getElementById('sl');sl.innerHTML='';
  for(let i=0;i<32;i++){
    const s=document.createElement('div');s.className='fsym';
    s.textContent=syms[Math.floor(Math.random()*syms.length)];
    s.style.cssText=`left:${4+Math.random()*92}%;bottom:${8+Math.random()*35}%;--fs:${.7+Math.random()*1.3}rem;--dur:${3+Math.random()*5}s;--dl:${Math.random()*2.5}s;--r0:${-22+Math.random()*44}deg;--r1:${-22+Math.random()*44}deg;color:${gc};`;
    sl.appendChild(s);
  }
}
function resetAll(){
  document.getElementById('ra').classList.remove('show');
  document.getElementById('n1').value='';document.getElementById('n2').value='';
  document.getElementById('sl').innerHTML='';
  setTimeout(()=>document.getElementById('n1').focus(),200);
}
document.getElementById('goBtn').addEventListener('click',calculate);
document.getElementById('n1').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('n2').focus();});
document.getElementById('n2').addEventListener('keydown',e=>{if(e.key==='Enter')calculate();});

/* ===== AURORA BG ===== */
const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
const fxC=document.getElementById('fx'),fxX=fxC.getContext('2d');
let W=0,H=0;
function rsz(){const r=document.getElementById('fr');W=bgC.width=fxC.width=r.offsetWidth;H=bgC.height=fxC.height=r.offsetHeight;}
setTimeout(rsz,60);window.addEventListener('resize',rsz);
const aCol=[[255,63,160],[255,124,58],[200,80,255],[50,185,255],[255,205,80],[168,139,250]];
const blobs=aCol.map(()=>({x:Math.random(),y:.15+Math.random()*.7,vx:(Math.random()-.5)*.00025,vy:(Math.random()-.5)*.00018,ph:Math.random()*Math.PI*2,spd:.0004+Math.random()*.0004}));
function drawBg(t){
  if(!W||!H)return;
  bgX.clearRect(0,0,W,H);bgX.fillStyle='#03000a';bgX.fillRect(0,0,W,H);
  blobs.forEach((b,i)=>{
    b.ph+=b.spd;b.x+=b.vx+Math.sin(b.ph)*.00018;b.y+=b.vy+Math.cos(b.ph*1.3)*.0001;
    if(b.x<0)b.x=1;if(b.x>1)b.x=0;if(b.y<.04)b.vy=Math.abs(b.vy);if(b.y>.96)b.vy=-Math.abs(b.vy);
    const cx=b.x*W,cy=b.y*H,r=.28*Math.max(W,H);
    const g=bgX.createRadialGradient(cx,cy,0,cx,cy,r);
    const[rv,gv,bv]=aCol[i];
    g.addColorStop(0,`rgba(${rv},${gv},${bv},.12)`);g.addColorStop(.6,`rgba(${rv},${gv},${bv},.04)`);g.addColorStop(1,'rgba(0,0,0,0)');
    bgX.fillStyle=g;bgX.fillRect(0,0,W,H);
  });
}
const stars=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),r:.3+Math.random()*.9,ph:Math.random()*Math.PI*2,spd:.006+Math.random()*.01,a:.05+Math.random()*.35}));
const sparks=[];
function mkSpark(){
  if(Math.random()>.32)return;
  const cols=['#ff3fa0','#fb923c','#ffd166','#c084fc','#38bdf8','#a78bfa'];
  sparks.push({x:.05+Math.random()*.9,y:.65+Math.random()*.3,vx:(Math.random()-.5)*1.1,vy:-(0.5+Math.random()*1.7),life:1,decay:.011+Math.random()*.012,sz:1.5+Math.random()*3.5,col:cols[Math.floor(Math.random()*cols.length)]});
}
function drawFx(){
  if(!W||!H)return;fxX.clearRect(0,0,W,H);
  stars.forEach(s=>{s.ph+=s.spd;const a=s.a*(0.5+0.5*Math.sin(s.ph));fxX.globalAlpha=a;fxX.fillStyle='#fff';fxX.beginPath();fxX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);fxX.fill();});
  mkSpark();
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.x+=p.vx/W*9;p.y+=p.vy/H*9;p.vy+=.035/H*9;p.life-=p.decay;
    if(p.life<=0){sparks.splice(i,1);continue;}
    const g=fxX.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,p.sz*p.life*3.2);
    g.addColorStop(0,p.col);g.addColorStop(1,'rgba(0,0,0,0)');
    fxX.globalAlpha=p.life*.55;fxX.fillStyle=g;fxX.beginPath();fxX.arc(p.x*W,p.y*H,p.sz*p.life*3.2,0,Math.PI*2);fxX.fill();
    fxX.globalAlpha=p.life*.8;fxX.fillStyle=p.col;fxX.beginPath();fxX.arc(p.x*W,p.y*H,p.sz*p.life,0,Math.PI*2);fxX.fill();
  }
  fxX.globalAlpha=1;
}
function loop(){drawBg();drawFx();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

const st=document.createElement('style');
st.textContent=`.rcard::before{content:'';position:absolute;inset:0;background:var(--cbg,linear-gradient(135deg,#120020,#2a0040));opacity:.88;z-index:0;}.rword{--gc:#ff3fa0;}`;
document.head.appendChild(st);

function typeInto(el,text,speed,onDone){
  el.value='';
  let i=0;
  (function step(){
    if(i<=text.length){
      el.value=text.slice(0,i);
      i++;
      setTimeout(step,speed);
    }else if(onDone){onDone();}
  })();
}

  btn.addEventListener('click',()=>{
    document.querySelectorAll('.who-btn').forEach(b=>b.classList.remove('active'));

    const who=btn.dataset.who;
    const you=who,them=(who==='Anusha')?'Harinadh Naik':'Anusha';
    const n1=document.getElementById('n1'),n2=document.getElementById('n2');
    n1.value='';n2.value='';

<script id="cursor-trail-script">
(function(){
  if(window.__ctInit) return;
  window.__ctInit = true;

  var THEMES = {
    'flames_new_fonts.html': [
      { type:'sparkle', glyph:'✦', colors:['#ffc36b','#ffe14d','#ff9a4d'] },
      { type:'sparkle', glyph:'✧', colors:['#ff7a3d','#ffb347'] },
      { type:'heart',   glyph:'♥', colors:['#ff6f45','#ff8f5a'] }
    ],
    'stars.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#a8d8ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#8fd6ff','#e0f4ff'] },
      { type:'petal',   glyph:'❀', colors:['#c9e8ff','#e6f4ff'] }
    ],
    'our_constellation_part1.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'our_constellation.html': [
      { type:'sparkle', glyph:'✦', colors:['#cfe8ff','#c084ff','#ffffff'] },
      { type:'sparkle', glyph:'✧', colors:['#a78bfa','#e0d4ff'] }
    ],
    'tangled_love.html': [
      { type:'heart', glyph:'♥', colors:['#ff5f8f','#e8547a'] },
      { type:'petal', glyph:'✿', colors:['#ffc3dd','#ffb6d9'] }
    ],
    'contract.html': [
      { type:'sparkle', glyph:'✦', colors:['#e8b978','#d4a95f'] },
      { type:'heart',   glyph:'♥', colors:['#ff8fac'] }
    ]
  };

  var DEFAULT_THEME = [
    { type:'heart',  glyph:'♥', colors:['#ff6f95','#ff8fac','#e8547a','#ffb3c6'] },
    { type:'heart',  glyph:'❤', colors:['#ff5f8f','#ff9ecb'] },
    { type:'petal',  glyph:'✿', colors:['#ffc3dd','#ffd6e6','#f7a8c4'] },
    { type:'petal',  glyph:'❀', colors:['#ffb6d9','#ffe0ef'] },
    { type:'petal',  glyph:'✾', colors:['#ffd6a5','#ffe8c9'] },
    { type:'sparkle',glyph:'✦', colors:['#ffe14d','#ffc36b','#fff3b0'] },
    { type:'sparkle',glyph:'✧', colors:['#c9e8ff','#ffffff'] },
    { type:'sparkle',glyph:'·', colors:['#ffffff','#ffe9f2'] }
  ];

  var here = decodeURIComponent(location.pathname.split('/').pop() || '');
  var shapes = THEMES[here] || DEFAULT_THEME;

  var isSmallScreen = window.innerWidth < 400;
  var minInterval = isSmallScreen ? 75 : 50;

  var lastSpawn = 0;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildWaveKeyframes(x, y, size, kind){
    var totalDriftY = kind === 'sparkle' ? rand(-26,-10) : rand(50,95);
    var swayAmp = kind === 'sparkle' ? rand(4,10) : rand(18,34);
    var swayDir = Math.random() < 0.5 ? 1 : -1;
    var totalRot = rand(-50,50) * (kind === 'petal' ? 1.6 : 1);
    var steps = 6;
    var frames = [];

    for(var i=0;i<=steps;i++){
      var t = i/steps;
      var vy = totalDriftY * (t*t*(3-2*t));
      var vx = Math.sin(t*Math.PI*1.3) * swayAmp * swayDir * (kind === 'sparkle' ? 0.4 : 1);
      var rot = totalRot * t;
      var scale, opacity;
      if(kind === 'sparkle'){
        scale = t < 0.3 ? (0.4 + t*2.6) : (1.15 - (t-0.3)*0.6);
        opacity = t < 0.15 ? t/0.15 : (t > 0.7 ? Math.max(0,(1-t)/0.3) : 0.75 + Math.sin(t*22)*0.25);
      } else {
        scale = t < 0.25 ? (0.5 + t*2) : (1 - (t-0.25)*0.35);
        opacity = t < 0.12 ? t/0.12 : Math.max(0, 1 - Math.pow((t-0.12)/0.88, 1.4));
      }
      frames.push({
        transform: 'translate('+(x+vx-size/2)+'px,'+(y+vy-size/2)+'px) rotate('+rot+'deg) scale('+Math.max(0.05,scale).toFixed(3)+')',
        opacity: Math.max(0, Math.min(1, opacity)).toFixed(3),
        offset: t
      });
    }
    return frames;
  }

  function spawnAt(x, y, force){
    var now = performance.now();
    if(!force && now - lastSpawn < minInterval) return;
    lastSpawn = now;

    var shape = pick(shapes);
    var color = pick(shape.colors);

    var el = document.createElement('div');
    el.className = 'ct-particle';
    el.textContent = shape.glyph;

    var size = shape.type === 'sparkle' ? rand(7,13) : rand(12,20);
    el.style.fontSize = size + 'px';
    el.style.color = color;
    el.style.filter = 'drop-shadow(0 0 '+(size*0.7)+'px '+color+')';

    var offX = rand(-3,3);
    var offY = rand(-3,3);
    document.body.appendChild(el);

    var frames = buildWaveKeyframes(x+offX, y+offY, size, shape.type);
    var dur = shape.type === 'sparkle' ? rand(650,950) : rand(1300,1900);

    var anim = el.animate(frames, { duration: dur, easing: 'linear' });
    anim.onfinish = function(){ el.remove(); };
  }

  var lastX = null, lastY = null;
  var lastMoveTime = performance.now();
  var idleTimer = null;

  function scheduleIdle(x, y){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(x !== null) spawnAt(x, y, true);
      scheduleIdle(x, y);
    }, 2200 + rand(0,900));
  }

  function handlePointer(x, y){
    var now = performance.now();
    if(lastX !== null){
      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var dt = Math.max(8, now - lastMoveTime);
      var speed = dist / dt; // px per ms

      // faster movement -> denser trail (more interpolated steps), capped for performance
      var baseSteps = Math.max(1, Math.floor(dist / 20));
      var speedBoost = speed > 1.2 ? 2 : (speed > 0.6 ? 1 : 0);
      var steps = Math.min(isSmallScreen ? 4 : 7, baseSteps + speedBoost);

      for(var i=1;i<=steps;i++){
        var t = i/steps;
        spawnAt(lastX + dx*t, lastY + dy*t);
      }
    } else {
      spawnAt(x,y,true);
    }
    lastX = x; lastY = y;
    lastMoveTime = now;
    scheduleIdle(x, y);
  }

  window.addEventListener('mousemove', function(e){
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchstart', function(e){
    if(e.touches && e.touches[0]){
      spawnAt(e.touches[0].clientX, e.touches[0].clientY, true);
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      scheduleIdle(lastX, lastY);
    }
  }, {passive:true});

  window.addEventListener('click', function(e){
    var count = isSmallScreen ? 5 : 8;
    for(var i=0;i<count;i++){
      (function(i){
        var angle = (i/count) * Math.PI * 2;
        var dist = rand(6,26);
        setTimeout(function(){
          spawnAt(e.clientX + Math.cos(angle)*dist, e.clientY + Math.sin(angle)*dist, true);
        }, i*22);
      })(i);
    }
  });
})();
</script>

    if(t) pulse(t);
